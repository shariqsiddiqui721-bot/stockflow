                        <div className="text-[10px] text-[#8A9690]">bal {money(t.balance)}</div>
                      </div>
                    </div>
                  ))}
                </ReportTable>
              );
            })()}
          </React.Fragment>
        )}
        {tab === "Demand vs Issue" && (
          <ReportTable title={dateFilter ? `Demand vs Issue — ${dateFilter}` : "Demand vs Issue — All Dates"} onExport={() => downloadCSV("demand-vs-issue.csv", toCSV(filteredItems, [{ label: "Item", get: i => i.name }, { label: "Demanded", get: i => db.demands.filter(d => d.itemId === i.id && (!dateFilter || d.date === dateFilter)).reduce((a, d) => a + d.qty, 0) }, { label: "Issued", get: i => db.issues.filter(x => x.itemId === i.id && (!dateFilter || x.date === dateFilter)).reduce((a, x) => a + x.qty, 0) }]))}>
            <table className="w-full text-sm">
              <thead><tr className="text-left text-[#7A8880]"><th className="py-1.5">Item</th><th className="text-right py-1.5">Demanded</th><th className="text-right py-1.5">Issued</th></tr></thead>
              <tbody>
                {filteredItems.map(i => { const dem = db.demands.filter(d => d.itemId === i.id && (!dateFilter || d.date === dateFilter)).reduce((a, d) => a + d.qty, 0); const iss = db.issues.filter(x => x.itemId === i.id && (!dateFilter || x.date === dateFilter)).reduce((a, x) => a + x.qty, 0); if (dem === 0 && iss === 0) return null; return (
                  <tr key={i.id} className="border-t border-[#EFEBDF]"><td className="py-2 font-medium">{i.name}</td><td className="text-right py-2 font-mono">{dem}</td><td className={`text-right py-2 font-mono ${iss < dem ? "text-[#B33A3A] font-bold" : ""}`}>{iss}</td></tr>
                ); })}
              </tbody>
            </table>
          </ReportTable>
        )}
        {tab === "By Category" && (
          <ReportTable
            title={dateFilter ? `Demand / Issued / Ending by Category — ${dateFilter}` : "Demand / Issued / Ending by Category"}
            onExport={() => downloadCSV("by-category.csv", toCSV(db.categories, [
              { label: "Category", get: c => c },
              { label: "Demanded", get: c => db.demands.filter(d => db.items.find(i => i.id === d.itemId)?.category === c && (!dateFilter || d.date === dateFilter)).reduce((a, d) => a + d.qty, 0) },
              { label: "Issued", get: c => db.issues.filter(x => db.items.find(i => i.id === x.itemId)?.category === c && (!dateFilter || x.date === dateFilter)).reduce((a, x) => a + x.qty, 0) },
              { label: "Ending", get: c => db.endings.filter(x => db.items.find(i => i.id === x.itemId)?.category === c && (!dateFilter || x.date === dateFilter)).reduce((a, x) => a + x.qty, 0) },
            ]))}
          >
            <table className="w-full text-sm">
              <thead><tr className="text-left text-[#7A8880]"><th className="py-1.5">Category</th><th className="text-right py-1.5">Demanded</th><th className="text-right py-1.5">Issued</th><th className="text-right py-1.5">Ending</th></tr></thead>
              <tbody>
                {(catFilter ? [catFilter] : db.categories).map(c => {
                  const dem = db.demands.filter(d => db.items.find(i => i.id === d.itemId)?.category === c && (!dateFilter || d.date === dateFilter)).reduce((a, d) => a + d.qty, 0);
                  const iss = db.issues.filter(x => db.items.find(i => i.id === x.itemId)?.category === c && (!dateFilter || x.date === dateFilter)).reduce((a, x) => a + x.qty, 0);
                  const end = db.endings.filter(x => db.items.find(i => i.id === x.itemId)?.category === c && (!dateFilter || x.date === dateFilter)).reduce((a, x) => a + x.qty, 0);
                  if (dem === 0 && iss === 0 && end === 0) return null;
                  return (
                    <tr key={c} className="border-t border-[#EFEBDF]">
                      <td className="py-2 font-medium">{c}</td>
                      <td className="text-right py-2 font-mono">{dem}</td>
                      <td className={`text-right py-2 font-mono ${iss < dem ? "text-[#B33A3A] font-bold" : ""}`}>{iss}</td>
                      <td className="text-right py-2 font-mono">{end}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </ReportTable>
        )}
        {tab === "Demand" && (() => {
          const eff = dateFilter || demandDateStr();
          const kBranches = myBranches.filter(b => kitchensOf(db, b).length > 0);
          const isAdmin = (session.permissions || []).includes("admin");
          const branchSum = (branch, itemId) => demandCycle(db, itemId, branch, null, eff)[demandMode === "first" ? "firstDemand" : "currentDemand"]
            + kitchensOf(db, branch).reduce((a, k) => a + demandCycle(db, itemId, branch, k.id, eff)[demandMode === "first" ? "firstDemand" : "currentDemand"], 0);
          const adjFor = (itemId) => (db.demandAdjustments || []).filter(a => a.itemId === itemId && a.date === eff).reduce((a, x) => a + x.qty, 0);
          const voidedInfo = (itemId) => (db.voidedDemandItems || []).filter(v => v.itemId === itemId && v.date === eff);

          const rowsData = filteredItems.map(i => {
            const cols = kBranches.map(b => branchSum(b, i.id));
            const total = cols.reduce((a, v) => a + v, 0);
            const adj = demandMode === "current" ? adjFor(i.id) : 0;
            return { item: i, cols, total, adj, final: total + adj, voided: voidedInfo(i.id) };
          }).filter(r => r.total !== 0 || r.adj !== 0);

          return (
            <ReportTable
              title={`Demand — ${eff} (${demandMode === "first" ? "1st demand" : "after issue"})`}
              onExport={() => downloadCSV("demand.csv", toCSV(rowsData, [
                { label: "Item", get: r => r.item.name },
                ...kBranches.map((b, idx) => ({ label: b, get: r => r.cols[idx] })),
                { label: "Total", get: r => r.total }, { label: "Adjust", get: r => r.adj }, { label: "Final", get: r => r.final },
              ]))}
            >
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-left text-[#7A8880]">
                    <th className="py-1.5">Item</th>
                    {kBranches.map(b => <th key={b} className="text-right py-1.5">{b}</th>)}
                    <th className="text-right py-1.5">Total</th>
                    <th className="text-right py-1.5">Final</th>
                  </tr>
                </thead>
                <tbody>
                  {rowsData.map(r => (
                    <React.Fragment key={r.item.id}>
                      <tr className={`border-t border-[#EFEBDF] ${r.voided.length > 0 ? "bg-[#FBEAEA]" : ""}`}>
                        <td className="py-2 font-medium">{r.item.name}{r.item.nameUr && <span className="text-[#8A9690]"> — {r.item.nameUr}</span>}</td>
                        {r.cols.map((v, idx) => <td key={idx} className="text-right py-2 font-mono">{v}</td>)}
                        <td className="text-right py-2 font-mono">{r.total}</td>
                        <td className="text-right py-2 font-mono font-bold">
                          {r.final}
                          {isAdmin && <button onClick={() => setAdjOpenBranch(adjOpenBranch === r.item.id ? null : r.item.id)} className="ml-1.5 text-[10px] text-[#4A6FA5] font-semibold align-middle">✎</button>}
                        </td>
                      </tr>
                      {r.voided.length > 0 && (
                        <tr><td colSpan={kBranches.length + 3} className="text-[11px] text-[#B33A3A] font-semibold pb-1">voided for {r.voided.map(v => supplierName(v.supplierId)).join(", ")}</td></tr>
                      )}
                      {adjOpenBranch === r.item.id && (
                        <tr><td colSpan={kBranches.length + 3} className="pb-2">
                          <div className="flex gap-2 mt-1">
                            <input className={numCls} type="number" placeholder="+/- qty" value={adjQty} onChange={e => setAdjQty(e.target.value)} />
                            <input className={numCls + " font-sans"} placeholder="Reason" value={adjReason} onChange={e => setAdjReason(e.target.value)} />
                            <button onClick={() => saveDemandAdjustment(r.item.id)} className="bg-[#C98A2C] text-white px-4 rounded-xl font-semibold whitespace-nowrap">Save</button>
                          </div>
                        </td></tr>
                      )}
                    </React.Fragment>
                  ))}
                  {rowsData.length === 0 && <tr><td colSpan={kBranches.length + 3} className="py-3 text-[#8A9690]">No entries.</td></tr>}
                </tbody>
              </table>
            </ReportTable>
          );
        })()}
        {tab === "Kitchens" && (() => {
          const eff = dateFilter || demandDateStr();
          const allKitchens = myBranches.flatMap(b => kitchensOf(db, b)).sort((a, b) => (a.branch === b.branch ? 0 : a.branch < b.branch ? -1 : 1));
          const kSum = (arr, kitchenId, itemId) => arr.filter(r => r.itemId === itemId && r.date === eff && r.kitchenId === kitchenId).reduce((a, r) => a + r.qty, 0);
          const kDemand = (kitchen, itemId) => demandCycle(db, itemId, kitchen.branch, kitchen.id, eff)[demandMode === "first" ? "firstDemand" : "currentDemand"];

          const section = (title, arr, useCycle) => {
            const rowsData = filteredItems.map(i => ({ item: i, cols: allKitchens.map(k => useCycle ? kDemand(k, i.id) : kSum(arr, k.id, i.id)) })).filter(r => r.cols.some(v => v !== 0));
            return (
              <ReportTable
                title={`${title} — ${eff}${useCycle ? (demandMode === "first" ? " (1st demand)" : " (after issue)") : ""}`}
                onExport={() => downloadCSV(`${title.toLowerCase()}-by-kitchen.csv`, toCSV(rowsData, [
                  { label: "Item", get: r => r.item.name },
                  ...allKitchens.map((k, idx) => ({ label: `${k.name} (${k.branch})`, get: r => r.cols[idx] })),
                ]))}
              >
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-[#7A8880]">
                      <th className="py-1.5 sticky left-0 bg-white">Item</th>
                      {allKitchens.map(k => <th key={k.id} className="text-right py-1.5 px-2 whitespace-nowrap">{k.name}<br /><span className="font-normal text-[10px]">({k.branch})</span></th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {rowsData.map(r => (
                      <tr key={r.item.id} className="border-t border-[#EFEBDF]">
                        <td className="py-2 font-medium sticky left-0 bg-white">{r.item.name}{r.item.nameUr && <span className="text-[#8A9690]"> — {r.item.nameUr}</span>}</td>
                        {r.cols.map((v, idx) => <td key={idx} className="text-right py-2 px-2 font-mono">{v}</td>)}
                      </tr>
                    ))}
                    {rowsData.length === 0 && <tr><td colSpan={allKitchens.length + 1} className="py-3 text-[#8A9690]">No entries.</td></tr>}
                  </tbody>
                </table>
              </ReportTable>
            );
          };

          if (allKitchens.length === 0) return <div className="text-sm text-[#8A9690]">No kitchens set up yet — add them in Admin &gt; Kitchens.</div>;

          return (
            <React.Fragment>
              {section("Demand", db.demands, true)}
              <div className="mb-3" />
              {section("Ending", db.endings, false)}
            </React.Fragment>
          );
        })()}
        {tab === "Supplier Demand" && (() => {
          const eff = dateFilter || demandDateStr();
          const supplier = db.suppliers.find(s => s.id === ledgerSupplierId);
          const finalDemandOf = (itemId) => {
            const raw = myBranches.reduce((sum, b) => {
              const branchTotal = demandCycle(db, itemId, b, null, eff)[demandMode === "first" ? "firstDemand" : "currentDemand"];
              const kitchenTotal = kitchensOf(db, b).reduce((a, k) => a + demandCycle(db, itemId, b, k.id, eff)[demandMode === "first" ? "firstDemand" : "currentDemand"], 0);
              return sum + branchTotal + kitchenTotal;
            }, 0);
            const adj = demandMode === "current" ? (db.demandAdjustments || []).filter(a => a.itemId === itemId && a.date === eff).reduce((a, x) => a + x.qty, 0) : 0;
            return raw + adj;
          };
          const supplierItems = supplier ? db.items.filter(i => supplier.itemIds.includes(i.id)) : [];
          const isVoided = (itemId) => (db.voidedDemandItems || []).some(v => v.supplierId === ledgerSupplierId && v.itemId === itemId && v.date === eff);
          const visible = supplierItems.map(i => ({ item: i, qty: finalDemandOf(i.id) })).filter(r => r.qty > 0 && !isVoided(r.item.id));
          const voided = supplierItems.map(i => ({ item: i, qty: finalDemandOf(i.id) })).filter(r => isVoided(r.item.id));

          return (
            <React.Fragment>
              <select className={selCls + " mb-4"} value={ledgerSupplierId} onChange={e => setLedgerSupplierId(e.target.value)}>
                {db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
              {supplier && (
                <div className="bg-white rounded-xl p-4 border-2 border-[#1F2A24] mb-3">
                  <div className="font-bold text-[#1F2A24] text-lg mb-3">{supplier.name} — Demand for {eff}</div>
                  {visible.length === 0 && <div className="text-sm text-[#8A9690]">No demand for this supplier's items on this date.</div>}
                  {visible.map(r => (
                    <div key={r.item.id} className="flex justify-between items-center py-2 border-t border-[#EFEBDF] first:border-t-0">
                      <div>
                        <div className="font-semibold text-[#1F2A24]">{r.item.name}{r.item.nameUr && <span className="text-[#8A9690] font-normal"> — {r.item.nameUr}</span>}</div>
                        <div className="text-[11px] text-[#8A9690]">{r.item.unit}</div>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="font-mono font-bold text-lg">{r.qty}</span>
                        <button onClick={() => toggleVoidForSupplier(ledgerSupplierId, r.item.id, eff)} className="text-[10px] font-semibold text-[#B33A3A] bg-[#B33A3A]/10 px-2 py-1 rounded-full whitespace-nowrap">Void</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              {voided.length > 0 && (
                <div className="bg-[#F7F5F0] rounded-xl p-3 border border-[#EAE4D4]">
                  <div className="text-xs font-semibold uppercase tracking-wide text-[#8A9690] mb-2">Voided (won't be sent to {supplier?.name})</div>
                  {voided.map(r => (
                    <div key={r.item.id} className="flex justify-between items-center py-1.5 text-sm">
                      <span className="text-[#8A9690] line-through">{r.item.name} — {r.qty}</span>
                      <button onClick={() => toggleVoidForSupplier(ledgerSupplierId, r.item.id, eff)} className="text-[10px] font-semibold text-[#2B6E63] bg-[#2B6E63]/10 px-2 py-1 rounded-full">Un-void</button>
                    </div>
                  ))}
                </div>
              )}
            </React.Fragment>
          );
        })()}
        {tab === "Ending" && (
          <ReportTable
            title={dateFilter ? `Ending Count — ${dateFilter}` : "Ending Count — All Dates (latest each)"}
            onExport={() => downloadCSV("ending.csv", toCSV(filteredItems, [
              { label: "Item", get: i => i.name },
              ...myBranches.map(b => ({ label: b, get: i => { const e = db.endings.find(x => x.itemId === i.id && x.branch === b && (!dateFilter || x.date === dateFilter)); return e ? e.qty : ""; } })),
            ]))}
          >
            <table className="w-full text-sm">
              <thead><tr className="text-left text-[#7A8880]"><th className="py-1.5">Item</th>{myBranches.map(b => <th key={b} className="text-right py-1.5">{b}</th>)}</tr></thead>
              <tbody>
                {filteredItems.map(i => {
                  const rows = myBranches.map(b => db.endings.find(x => x.itemId === i.id && x.branch === b && (!dateFilter || x.date === dateFilter)));
                  if (rows.every(r => !r)) return null;
                  return (
                    <tr key={i.id} className="border-t border-[#EFEBDF]">
                      <td className="py-2 font-medium">{i.name}</td>
                      {rows.map((e, idx) => <td key={idx} className="text-right py-2 font-mono">{e ? e.qty : "–"}</td>)}
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div className="text-[11px] text-[#8A9690] mt-3">{dateFilter ? "Showing counts recorded on this date only." : "Showing the latest count ever recorded per branch, across all dates."} Ending doesn't affect Stock Balance — compare the two to spot mismatches.</div>
          </ReportTable>
        )}
        {tab === "Adjustments" && (
          <ReportTable
            title={dateFilter ? `Adjustments — ${dateFilter}` : "Adjustments — All Dates"}
            onExport={() => downloadCSV("adjustments.csv", toCSV((db.adjustments || []).filter(a => myBranches.includes(a.branch) && (!dateFilter || a.date === dateFilter)), [
              { label: "Date", get: a => a.date }, { label: "Branch", get: a => a.branch }, { label: "Item", get: a => itemName(a.itemId) },
              { label: "Qty", get: a => a.qty }, { label: "Type", get: a => a.kind }, { label: "Note", get: a => a.reason },
            ]))}
          >
            {(db.adjustments || []).filter(a => myBranches.includes(a.branch) && (!dateFilter || a.date === dateFilter) && itemName(a.itemId).toLowerCase().includes(q.toLowerCase())).slice(0, 200).map(a => (
              <div key={a.id} className="flex justify-between items-center py-2 border-t border-[#EFEBDF] first:border-t-0">
                <div className="min-w-0">
                  <div className="text-sm font-medium truncate">{itemName(a.itemId)}</div>
                  <div className="text-[11px] text-[#8A9690] capitalize">{a.branch} · {a.date} · {a.kind}{a.reason ? " — " + a.reason : ""}</div>
                </div>
                <div className={`font-mono font-bold text-sm ${a.qty < 0 ? "text-[#B33A3A]" : "text-[#2B6E63]"}`}>{a.qty > 0 ? "+" : ""}{a.qty}</div>
              </div>
            ))}
            {(db.adjustments || []).filter(a => myBranches.includes(a.branch) && (!dateFilter || a.date === dateFilter)).length === 0 && <div className="text-sm text-[#8A9690]">No adjustments{dateFilter ? " on this date" : ""}.</div>}
          </ReportTable>
        )}
        {tab === "Activity Log" && (
          <ReportTable title={dateFilter ? `User Activity — ${dateFilter}` : "User Activity"} onExport={() => downloadCSV("activity-log.csv", toCSV(db.log.filter(l => !dateFilter || l.date === dateFilter), [{ label: "Time", get: l => l.at }, { label: "User", get: l => l.user }, { label: "Action", get: l => l.action }, { label: "Detail", get: l => l.detail }]))}>
            {db.log.filter(l => !dateFilter || l.date === dateFilter).slice(0, 200).map(l => (
              <div key={l.id} className="bg-white rounded-xl p-3 mb-2 border border-[#EAE4D4]">
                <div className="flex justify-between text-sm"><span className="font-semibold">{l.action}</span><span className="text-xs text-[#8A9690]">{l.at}</span></div>
                <div className="text-xs text-[#5C6B62] mt-0.5">{l.user} · {l.detail}</div>
              </div>
            ))}
          </ReportTable>
        )}
      </div>
    </div>
  );
}
function ReportTable({ title, onExport, children }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <div className="font-bold text-[#1F2A24]">{title}</div>
        <button onClick={onExport} className="text-xs font-semibold text-[#2B6E63] bg-[#2B6E63]/10 px-3 py-1.5 rounded-full">⬇ CSV</button>
      </div>
      <div className="bg-white rounded-xl p-3 border border-[#EAE4D4] overflow-x-auto">{children}</div>
    </div>
  );
}

  const [editKitchenDraft, setEditKitchenDraft] = useState({});
  const [ratesSupplierId, setRatesSupplierId] = useState(db.suppliers[0]?.id || "");
  const [editItemId, setEditItemId] = useState(null);
  const [editItemDraft, setEditItemDraft] = useState({});
  const [editSupplierId, setEditSupplierId] = useState(null);
  const [editSupplierDraft, setEditSupplierDraft] = useState({});

  const addItem = () => { if (!newItemName.trim()) return; const rec = { id: uid("i"), name: newItemName.trim(), nameUr: newItemNameUr.trim(), category: newItemCat, unit: newItemUnit || "unit" }; const next = { ...db, items: [...db.items, rec] }; addLog(next, "Admin", `Added item ${rec.name}`); persist(next); setNewItemName(""); setNewItemNameUr(""); flash("Item added"); };
  const delItem = (id) => persist({ ...db, items: db.items.filter(i => i.id !== id) });
  const startEditItem = (i) => { setEditItemId(i.id); setEditItemDraft({ name: i.name, nameUr: i.nameUr || "", category: i.category, unit: i.unit }); };
  const saveEditItem = () => {
    const next = { ...db, items: db.items.map(i => i.id === editItemId ? { ...i, ...editItemDraft } : i) };
    addLog(next, "Admin", `Edited item ${editItemDraft.name}`);
    persist(next); setEditItemId(null); flash("Item updated");
  };

  const addSupplier = () => { if (!newSupplierName.trim()) return; const rec = { id: uid("s"), name: newSupplierName.trim(), itemIds: newSupplierItems }; const next = { ...db, suppliers: [...db.suppliers, rec] }; addLog(next, "Admin", `Added supplier ${rec.name}`); persist(next); setNewSupplierName(""); setNewSupplierItems([]); flash("Supplier added"); };
  const delSupplier = (id) => persist({ ...db, suppliers: db.suppliers.filter(s => s.id !== id) });
  const toggleSupplierItem = (id) => setNewSupplierItems(v => v.includes(id) ? v.filter(x => x !== id) : [...v, id]);
  const startEditSupplier = (s) => { setEditSupplierId(s.id); setEditSupplierDraft({ name: s.name, itemIds: [...s.itemIds] }); };
  const toggleEditSupplierItem = (id) => setEditSupplierDraft(d => ({ ...d, itemIds: d.itemIds.includes(id) ? d.itemIds.filter(x => x !== id) : [...d.itemIds, id] }));
  const saveEditSupplier = () => {
    const next = { ...db, suppliers: db.suppliers.map(s => s.id === editSupplierId ? { ...s, ...editSupplierDraft } : s) };
    addLog(next, "Admin", `Edited supplier ${editSupplierDraft.name}`);
    persist(next); setEditSupplierId(null); flash("Supplier updated");
  };

  const addUser = () => { if (!newUserName.trim() || newUserPin.length < 4) { flash("Name + 4-6 digit PIN required", "error"); return; } const rec = { id: uid("u"), name: newUserName.trim(), pin: newUserPin, permissions: newUserPerms, branches: newUserBranches, reportTabs: newUserReportTabs, kitchens: newUserKitchens, notifications: newUserNotifications }; const next = { ...db, users: [...db.users, rec] }; addLog(next, "Admin", `Added user ${rec.name}`); persist(next); setNewUserName(""); setNewUserPin(""); setNewUserPerms(["purchase"]); setNewUserBranches([...BRANCHES]); setNewUserReportTabs([...REPORT_TABS]); setNewUserKitchens([]); setNewUserNotifications(true); flash("User added"); };
  const delUser = (id) => persist({ ...db, users: db.users.filter(u => u.id !== id) });
  const toggleUserPerm = (userId, perm) => {
    const next = { ...db, users: db.users.map(u => {
      if (u.id !== userId) return u;
      const has = (u.permissions || []).includes(perm);
      return { ...u, permissions: has ? u.permissions.filter(p => p !== perm) : [...(u.permissions || []), perm] };
    }) };
    persist(next);
  };
  const toggleUserBranch = (userId, branch) => {
    const next = { ...db, users: db.users.map(u => {
      if (u.id !== userId) return u;
      const has = (u.branches || []).includes(branch);
      return { ...u, branches: has ? u.branches.filter(b => b !== branch) : [...(u.branches || []), branch] };
    }) };
    persist(next);
  };
  const toggleUserReportTab = (userId, t) => {
    const next = { ...db, users: db.users.map(u => {
      if (u.id !== userId) return u;
      const cur = (u.reportTabs && u.reportTabs.length) ? u.reportTabs : [...REPORT_TABS];
      const has = cur.includes(t);
      return { ...u, reportTabs: has ? cur.filter(x => x !== t) : [...cur, t] };
    }) };
    persist(next);
  };
  const toggleUserKitchen = (userId, kitchenId) => {
    const next = { ...db, users: db.users.map(u => {
      if (u.id !== userId) return u;
      const has = (u.kitchens || []).includes(kitchenId);
      return { ...u, kitchens: has ? u.kitchens.filter(x => x !== kitchenId) : [...(u.kitchens || []), kitchenId] };
    }) };
    persist(next);
  };
  const toggleUserNotifications = (userId) => {
    const next = { ...db, users: db.users.map(u => u.id === userId ? { ...u, notifications: u.notifications === false } : u) };
    persist(next);
  };

  const addKitchen = () => {
    if (!newKitchenName.trim()) return;
    const rec = { id: uid("k"), name: newKitchenName.trim(), branch: newKitchenBranch };
    const next = { ...db, kitchens: [...(db.kitchens || []), rec] };
    addLog(next, "Admin", `Added kitchen ${rec.name} (${rec.branch})`);
    persist(next); setNewKitchenName(""); flash("Kitchen added");
  };
  const delKitchen = (id) => persist({ ...db, kitchens: (db.kitchens || []).filter(k => k.id !== id) });
  const startEditKitchen = (k) => { setEditKitchenId(k.id); setEditKitchenDraft({ name: k.name, branch: k.branch }); };
  const saveEditKitchen = () => {
    const next = { ...db, kitchens: (db.kitchens || []).map(k => k.id === editKitchenId ? { ...k, ...editKitchenDraft } : k) };
    addLog(next, "Admin", `Edited kitchen ${editKitchenDraft.name}`);
    persist(next); setEditKitchenId(null); flash("Kitchen updated");
  };

  const ratesSupplier = db.suppliers.find(s => s.id === ratesSupplierId);
  const setPricing = (itemId, patch) => {
    const cur = (db.pricing && db.pricing[ratesSupplierId] && db.pricing[ratesSupplierId][itemId]) || { mode: "manual" };
    const next = { ...db, pricing: { ...db.pricing, [ratesSupplierId]: { ...(db.pricing[ratesSupplierId] || {}), [itemId]: { ...cur, ...patch } } } };
    persist(next);
  };

  const resetTransactions = () => {
    if (!window.confirm("This deletes ALL purchase, issue, ending, demand, adjustment, and payment entries plus the activity log — permanently. Items, suppliers, users, kitchens, and rates stay. Continue?")) return;
    if (!window.confirm("Are you sure? This cannot be undone.")) return;
    const next = { ...db, purchases: [], issues: [], endings: [], demands: [], payments: [], adjustments: [], demandAdjustments: [], voidedDemandItems: [], todayRates: {}, log: [] };
    persist(next);
    flash("All entries cleared — items, suppliers and users kept");
  };

  return (
    <div>
      <TopBar title="Admin" onBack={onBack} />
      <div className="px-4 pt-3 flex gap-2 overflow-x-auto">
        {["Items", "Suppliers", "Rates", "Kitchens", "Users", "Reset"].map(t => (
          <button key={t} onClick={() => setTab(t)} className={`flex-1 whitespace-nowrap py-2.5 px-3 rounded-xl text-sm font-semibold border-2 ${tab === t ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white text-[#5C6B62] border-[#EAE4D4]"}`}>{t}</button>
        ))}
      </div>
      <div className="p-4">
        {tab === "Items" && (
          <React.Fragment>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <div className="grid grid-cols-2 gap-2 mb-2">
                <input className={numCls + " font-sans"} placeholder="Item name" value={newItemName} onChange={e => setNewItemName(e.target.value)} />
                <input className={numCls + " font-sans"} placeholder="Urdu name (optional)" value={newItemNameUr} onChange={e => setNewItemNameUr(e.target.value)} dir="rtl" />
              </div>
              <div className="grid grid-cols-2 gap-2 mb-2">
                <select className={selCls} value={newItemCat} onChange={e => setNewItemCat(e.target.value)}>{db.categories.map(c => <option key={c}>{c}</option>)}</select>
                <input className={numCls + " font-sans"} placeholder="Unit (kg, ltr...)" value={newItemUnit} onChange={e => setNewItemUnit(e.target.value)} />
              </div>
              <button onClick={addItem} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold">+ Add</button>
            </div>
            <input className={numCls + " font-sans mb-3"} placeholder={`Search ${db.items.length} items…`} value={itemQ} onChange={e => setItemQ(e.target.value)} />
            {db.items.filter(i => i.name.toLowerCase().includes(itemQ.toLowerCase())).map(i => (
              editItemId === i.id ? (
                <div key={i.id} className="bg-white rounded-lg p-3 mb-1.5 border-2 border-[#C98A2C]">
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <input className={numCls + " font-sans"} value={editItemDraft.name} onChange={e => setEditItemDraft(d => ({ ...d, name: e.target.value }))} />
                    <input className={numCls + " font-sans"} value={editItemDraft.nameUr} onChange={e => setEditItemDraft(d => ({ ...d, nameUr: e.target.value }))} dir="rtl" placeholder="Urdu name" />
                  </div>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <select className={selCls} value={editItemDraft.category} onChange={e => setEditItemDraft(d => ({ ...d, category: e.target.value }))}>{db.categories.map(c => <option key={c}>{c}</option>)}</select>
                    <input className={numCls + " font-sans"} value={editItemDraft.unit} onChange={e => setEditItemDraft(d => ({ ...d, unit: e.target.value }))} />
                  </div>
                  <div className="flex gap-2">
                    <button onClick={saveEditItem} className="bg-[#2B6E63] text-white px-4 rounded-xl font-semibold">Save</button>
                    <button onClick={() => setEditItemId(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-4 rounded-xl font-semibold">Cancel</button>
                  </div>
                </div>
              ) : (
                <div key={i.id} className="flex justify-between items-center bg-white rounded-lg p-2.5 mb-1.5 border border-[#EFEBDF]">
                  <span className="text-sm"><b>{i.name}</b>{i.nameUr && <span> · {i.nameUr}</span>} <span className="text-[#8A9690]">· {i.category} · {i.unit}</span></span>
                  <div className="flex items-center gap-3">
                    <button onClick={() => startEditItem(i)} className="text-[#5C6B62]">✎</button>
                    <button onClick={() => delItem(i.id)} className="text-[#B33A3A]">✕</button>
                  </div>
                </div>
              )
            ))}
          </React.Fragment>
        )}
        {tab === "Suppliers" && (
          <React.Fragment>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <input className={numCls + " font-sans mb-2"} placeholder="Supplier name" value={newSupplierName} onChange={e => setNewSupplierName(e.target.value)} />
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Linked items</div>
              <div className="flex flex-wrap gap-1.5 mb-2">
                {db.items.map(i => (
                  <button key={i.id} onClick={() => toggleSupplierItem(i.id)} className={`px-2.5 py-1 rounded-full text-xs font-semibold border ${newSupplierItems.includes(i.id) ? "bg-[#2B6E63] text-white border-[#2B6E63]" : "bg-[#F7F5F0] border-[#D8D2C2] text-[#5C6B62]"}`}>{i.name}</button>
                ))}
              </div>
              <button onClick={addSupplier} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold">+ Add Supplier</button>
            </div>
            {db.suppliers.map(s => (
              editSupplierId === s.id ? (
                <div key={s.id} className="bg-white rounded-lg p-3 mb-1.5 border-2 border-[#C98A2C]">
                  <input className={numCls + " font-sans mb-2"} value={editSupplierDraft.name} onChange={e => setEditSupplierDraft(d => ({ ...d, name: e.target.value }))} />
                  <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Linked items</div>
                  <div className="flex flex-wrap gap-1.5 mb-2 max-h-40 overflow-y-auto">
                    {db.items.map(i => (
                      <button key={i.id} onClick={() => toggleEditSupplierItem(i.id)} className={`px-2.5 py-1 rounded-full text-xs font-semibold border ${editSupplierDraft.itemIds.includes(i.id) ? "bg-[#2B6E63] text-white border-[#2B6E63]" : "bg-[#F7F5F0] border-[#D8D2C2] text-[#5C6B62]"}`}>{i.name}</button>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    <button onClick={saveEditSupplier} className="bg-[#2B6E63] text-white px-4 py-2 rounded-xl font-semibold">Save</button>
                    <button onClick={() => setEditSupplierId(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-4 py-2 rounded-xl font-semibold">Cancel</button>
                  </div>
                </div>
              ) : (
                <div key={s.id} className="flex justify-between items-center bg-white rounded-lg p-2.5 mb-1.5 border border-[#EFEBDF]">
                  <span className="text-sm"><b>{s.name}</b> <span className="text-[#8A9690]">· {s.itemIds.length} item(s)</span></span>
                  <div className="flex items-center gap-3">
                    <button onClick={() => startEditSupplier(s)} className="text-[#5C6B62]">✎</button>
                    <button onClick={() => delSupplier(s.id)} className="text-[#B33A3A]">✕</button>
                  </div>
                </div>
              )
            ))}
          </React.Fragment>
        )}
        {tab === "Rates" && (
          <React.Fragment>
            <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">Supplier</div>
            <select className={selCls + " mb-4"} value={ratesSupplierId} onChange={e => setRatesSupplierId(e.target.value)}>
              {db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {ratesSupplier && ratesSupplier.itemIds.map(itemId => {
              const item = db.items.find(i => i.id === itemId);
              if (!item) return null;
              const cfg = (db.pricing && db.pricing[ratesSupplierId] && db.pricing[ratesSupplierId][itemId]) || { mode: "manual" };
              return (
                <div key={itemId} className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-3">
                  <div className="font-semibold text-[#1F2A24] mb-2">{item.name}</div>
                  <div className="grid grid-cols-3 gap-1.5 mb-2">
                    {["manual", "fixed", "formula"].map(m => (
                      <button key={m} onClick={() => setPricing(itemId, { mode: m })} className={`py-2 rounded-lg text-xs font-semibold capitalize border-2 ${cfg.mode === m ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-[#F7F5F0] border-[#D8D2C2] text-[#5C6B62]"}`}>{m}</button>
                    ))}
                  </div>
                  {cfg.mode === "fixed" && (
                    <input className={numCls} type="number" placeholder="Fixed rate" defaultValue={cfg.rate || ""} onBlur={e => setPricing(itemId, { rate: Number(e.target.value) || 0 })} />
                  )}
                  {cfg.mode === "formula" && (
                    <div className="grid grid-cols-2 gap-2">
                      <input className={numCls} type="number" placeholder="Offset (+)" defaultValue={cfg.offset || ""} onBlur={e => setPricing(itemId, { offset: Number(e.target.value) || 0 })} />
                      <input className={numCls} type="number" placeholder="Multiplier (×)" defaultValue={cfg.multiplier || ""} onBlur={e => setPricing(itemId, { multiplier: Number(e.target.value) || 1 })} />
                    </div>
                  )}
                  {cfg.mode !== "manual" && (
                    <label className="flex items-center gap-2 mt-2.5 text-sm font-medium">
                      <input type="checkbox" checked={!!cfg.cashOnly} onChange={e => setPricing(itemId, { cashOnly: e.target.checked })} /> Cash only (no credit)
                    </label>
                  )}
                </div>
              );
            })}
            {ratesSupplier && ratesSupplier.itemIds.length === 0 && <div className="text-sm text-[#8A9690]">This supplier has no linked items yet — add them in the Suppliers tab.</div>}
          </React.Fragment>
        )}
        {tab === "Kitchens" && (
          <React.Fragment>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <div className="grid grid-cols-2 gap-2 mb-2">
                <input className={numCls + " font-sans"} placeholder="Kitchen name" value={newKitchenName} onChange={e => setNewKitchenName(e.target.value)} />
                <select className={selCls} value={newKitchenBranch} onChange={e => setNewKitchenBranch(e.target.value)}>{BRANCHES.map(b => <option key={b}>{b}</option>)}</select>
              </div>
              <button onClick={addKitchen} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold">+ Add Kitchen</button>
            </div>
            {BRANCHES.map(b => {
              const list = (db.kitchens || []).filter(k => k.branch === b);
              if (list.length === 0) return null;
              return (
                <div key={b} className="mb-3">
                  <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">{b}</div>
                  {list.map(k => (
                    editKitchenId === k.id ? (
                      <div key={k.id} className="bg-white rounded-lg p-3 mb-1.5 border-2 border-[#C98A2C]">
                        <div className="grid grid-cols-2 gap-2 mb-2">
                          <input className={numCls + " font-sans"} value={editKitchenDraft.name} onChange={e => setEditKitchenDraft(d => ({ ...d, name: e.target.value }))} />
                          <select className={selCls} value={editKitchenDraft.branch} onChange={e => setEditKitchenDraft(d => ({ ...d, branch: e.target.value }))}>{BRANCHES.map(bb => <option key={bb}>{bb}</option>)}</select>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={saveEditKitchen} className="bg-[#2B6E63] text-white px-4 rounded-xl font-semibold">Save</button>
                          <button onClick={() => setEditKitchenId(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-4 rounded-xl font-semibold">Cancel</button>
                        </div>
                      </div>
                    ) : (
                      <div key={k.id} className="flex justify-between items-center bg-white rounded-lg p-2.5 mb-1.5 border border-[#EFEBDF]">
                        <span className="text-sm"><b>{k.name}</b></span>
                        <div className="flex items-center gap-3">
                          <button onClick={() => startEditKitchen(k)} className="text-[#5C6B62]">✎</button>
                          <button onClick={() => delKitchen(k.id)} className="text-[#B33A3A]">✕</button>
                        </div>
                      </div>
                    )
                  ))}
                </div>
              );
            })}
            {(db.kitchens || []).length === 0 && <div className="text-sm text-[#8A9690]">No kitchens yet. Only branches with kitchens get a kitchen-selection step in Ending/Demand/Issue.</div>}
          </React.Fragment>
        )}
        {tab === "Users" && (
          <React.Fragment>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <div className="grid grid-cols-2 gap-2 mb-2">
                <input className={numCls + " font-sans"} placeholder="Name" value={newUserName} onChange={e => setNewUserName(e.target.value)} />
                <input className={numCls} placeholder="PIN" value={newUserPin} onChange={e => setNewUserPin(e.target.value.replace(/\D/g, "").slice(0, 6))} />
              </div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Allowed screens</div>
              <div className="mb-3"><PermChips selected={newUserPerms} onToggle={(p) => setNewUserPerms(v => v.includes(p) ? v.filter(x => x !== p) : [...v, p])} /></div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Branches</div>
              <div className="mb-3"><BranchChips selected={newUserBranches} onToggle={(b) => setNewUserBranches(v => v.includes(b) ? v.filter(x => x !== b) : [...v, b])} /></div>
              {(db.kitchens || []).filter(k => newUserBranches.includes(k.branch)).length > 0 && (
                <React.Fragment>
                  <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Kitchens (leave blank for all in their branches)</div>
                  <div className="mb-3"><KitchenChips kitchens={(db.kitchens || []).filter(k => newUserBranches.includes(k.branch))} selected={newUserKitchens} onToggle={(id) => setNewUserKitchens(v => v.includes(id) ? v.filter(x => x !== id) : [...v, id])} /></div>
                </React.Fragment>
              )}
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Report tabs visible</div>
              <div className="mb-3"><ReportTabChips selected={newUserReportTabs} onToggle={(t) => setNewUserReportTabs(v => v.includes(t) ? v.filter(x => x !== t) : [...v, t])} /></div>
              <label className="flex items-center gap-2 mb-3 text-sm font-medium">
                <input type="checkbox" checked={newUserNotifications} onChange={e => setNewUserNotifications(e.target.checked)} /> Push notifications enabled
              </label>
              <button onClick={addUser} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold">+ Add User</button>
            </div>
            {db.users.map(u => (
              <div key={u.id} className="bg-white rounded-lg p-2.5 mb-1.5 border border-[#EFEBDF]">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="text-sm"><b>{u.name}</b> <span className="text-[#8A9690]">· PIN {u.pin}</span></span>
                  <button onClick={() => delUser(u.id)} className="text-[#B33A3A]">✕</button>
                </div>
                <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mb-1">Screens</div>
                <PermChips selected={u.permissions || []} onToggle={(p) => toggleUserPerm(u.id, p)} />
                <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mt-2 mb-1">Branches</div>
                <BranchChips selected={u.branches || []} onToggle={(b) => toggleUserBranch(u.id, b)} />
                {(db.kitchens || []).filter(k => (u.branches || []).includes(k.branch)).length > 0 && (
                  <React.Fragment>
                    <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mt-2 mb-1">Kitchens (blank = all in their branches)</div>
                    <KitchenChips kitchens={(db.kitchens || []).filter(k => (u.branches || []).includes(k.branch))} selected={u.kitchens || []} onToggle={(id) => toggleUserKitchen(u.id, id)} />
                  </React.Fragment>
                )}
                {(u.permissions || []).includes("reports") && (
                  <React.Fragment>
                    <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mt-2 mb-1">Report tabs visible</div>
                    <ReportTabChips selected={(u.reportTabs && u.reportTabs.length) ? u.reportTabs : [...REPORT_TABS]} onToggle={(t) => toggleUserReportTab(u.id, t)} />
                  </React.Fragment>
                )}
                <label className="flex items-center gap-2 mt-2.5 text-xs font-semibold text-[#5C6B62]">
                  <input type="checkbox" checked={u.notifications !== false} onChange={() => toggleUserNotifications(u.id)} /> Push notifications enabled
                </label>
              </div>
            ))}
          </React.Fragment>
        )}
        {tab === "Reset" && (
          <div className="bg-white rounded-xl p-4 border-2 border-[#B33A3A]">
            <div className="font-bold text-[#B33A3A] mb-1">Clear all entries</div>
            <div className="text-sm text-[#5C6B62] mb-4">
              Deletes every Purchase, Issue, Ending, Demand, and Payment record, plus the Activity Log and today's rates —
              for a fresh start. Your Items, Suppliers, Users, and Rate settings are kept.
            </div>
            <button onClick={resetTransactions} className="bg-[#B33A3A] text-white w-full py-3 rounded-xl font-semibold">Delete All Entries</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
