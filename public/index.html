// Business day runs 9:00 AM to 6:00 AM the next calendar day.
// Anything before 9 AM still counts as "yesterday's" business date.
const pad2 = (n) => String(n).padStart(2, "0");
const businessDateOf = (input) => {
  const d = new Date(input);
  if (d.getHours() < 9) d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
const todayStr = () => businessDateOf(new Date());
const nowStr = () => new Date().toLocaleString();
const money = (n) => "Rs " + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });

// Demand runs on its own window: 9:00 PM through 6:00 PM the following calendar day.
// e.g. "15 Aug demand" = everything entered from 14 Aug 9pm through 15 Aug 6pm.
const demandDateStr = (ts) => {
  const d = new Date(ts || Date.now());
  const bucket = new Date(d);
  if (d.getHours() >= 21) bucket.setDate(bucket.getDate() + 1);
  return `${bucket.getFullYear()}-${pad2(bucket.getMonth() + 1)}-${pad2(bucket.getDate())}`;
};
const demandWindowOf = (dateStr) => {
  const [y, m, dd] = dateStr.split("-").map(Number);
  const end = new Date(y, m - 1, dd, 18, 0, 0, 0).getTime();
  const start = new Date(y, m - 1, dd - 1, 21, 0, 0, 0).getTime();
  return { start, end };
};
// Fallback timestamp for records saved before "ts" existed — noon of their own date bucket.
const tsOf = (r) => r.ts || new Date(r.date + "T12:00:00").getTime();

// Splits an item's demand for one branch/kitchen on one demand-date into:
// - firstDemand: everything asked for before the first issue that day (a historical snapshot)
// - currentDemand: everything asked for since the LAST issue that day (what's still outstanding)
// Multiple same-day demand entries add together until an issue resets the cycle.
function demandCycle(db, itemId, branch, kitchenId, dateStr) {
  const { start, end } = demandWindowOf(dateStr);
  const inWindow = (r) => { const t = tsOf(r); return t >= start && t < end; };
  const demandEntries = db.demands
    .filter(d => d.itemId === itemId && d.branch === branch && (kitchenId ? d.kitchenId === kitchenId : true) && inWindow(d))
    .sort((a, b) => tsOf(a) - tsOf(b));
  const issueEntries = db.issues
    .filter(x => x.itemId === itemId && x.to === branch && (kitchenId ? x.kitchenId === kitchenId : true) && inWindow(x))
    .sort((a, b) => tsOf(a) - tsOf(b));
  const firstIssueTs = issueEntries.length ? tsOf(issueEntries[0]) : null;
  const lastIssueTs = issueEntries.length ? tsOf(issueEntries[issueEntries.length - 1]) : null;
  const firstDemand = demandEntries.filter(d => firstIssueTs === null || tsOf(d) <= firstIssueTs).reduce((a, d) => a + d.qty, 0);
  const currentDemand = demandEntries.filter(d => lastIssueTs === null || tsOf(d) > lastIssueTs).reduce((a, d) => a + d.qty, 0);
  return { firstDemand, currentDemand, wasIssued: issueEntries.length > 0 };
}

const VAPID_PUBLIC_KEY = "BH5Tvcl3ie8t3JLf1bCGaRD7keOkjdGZ8v94HblObxmY-Mjbjq1Vfo-VQRisWmMpSgffKPJg6zHPoVeUJ_Cp7fU";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const arr = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) arr[i] = rawData.charCodeAt(i);
  return arr;
}

// Requests permission and registers this device for push, tied to the given user id.
// Must be called from a user gesture (button tap) — browsers block silent permission prompts.
async function enablePush(userId) {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
    const reg = await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if (permission !== "granted") return false;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    }
    await fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId, subscription: sub }) });
    return true;
  } catch (e) { return false; }
}

// Fire-and-forget: ask the server to push a notification to these users' devices.
function notifyUsers(userIds, title, body, url) {
  const ids = [...new Set((userIds || []).filter(Boolean))];
  if (ids.length === 0) return;
  fetch("/api/push/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userIds: ids, title, body: body || "", url: url || "/" }) }).catch(() => {});
}

function toCSV(rows, headers) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map(h => esc(h.label)).join(",")];
  rows.forEach(r => lines.push(headers.map(h => esc(h.get(r))).join(",")));
  return lines.join("\n");
}
function downloadCSV(filename, csv) {
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Resolve how an item should be priced for a given supplier.
// Returns null for plain manual entry, or an object describing fixed/formula pricing.
function computeRate(db, supplierId, itemId) {
  const cfg = db.pricing && db.pricing[supplierId] && db.pricing[supplierId][itemId];
  if (!cfg || cfg.mode === "manual") return null;
  const item = db.items.find(i => i.id === itemId);
  if (cfg.mode === "fixed") {
    return { mode: "fixed", rate: Number(cfg.rate) || 0, cashOnly: !!cfg.cashOnly };
  }
  if (cfg.mode === "formula") {
    const tr = db.todayRates && db.todayRates[item.category];
    const fresh = tr && tr.date === todayStr();
    if (!fresh) {
      return { mode: "formula", needsToday: true, cashOnly: !!cfg.cashOnly, offset: Number(cfg.offset) || 0, multiplier: Number(cfg.multiplier) || 1, category: item.category };
    }
    const rate = (Number(cfg.offset || 0) + Number(tr.rate)) * Number(cfg.multiplier || 1);
    return { mode: "formula", rate, cashOnly: !!cfg.cashOnly, category: item.category, todayRate: Number(tr.rate) };
  }
  return null;
}

// A branch "has kitchens" if any kitchen record points to it.
function kitchensOf(db, branch) {
  return (db.kitchens || []).filter(k => k.branch === branch);
}

// Kitchens a given user is allowed to record for, within one branch.
// Empty session.kitchens means "all kitchens in their branches" (no restriction).
function myKitchensFor(db, session, branch) {
  const branchKitchens = kitchensOf(db, branch);
  if (!session.kitchens || session.kitchens.length === 0) return branchKitchens;
  return branchKitchens.filter(k => session.kitchens.includes(k.id));
}

// Items a user is allowed to work with, everywhere in the app. Empty session.itemIds = no restriction.
function itemsForUser(db, session, items) {
  if (!session.itemIds || session.itemIds.length === 0) return items;
  return items.filter(i => session.itemIds.includes(i.id));
}
// Categories that still have at least one item visible to this user, given an optional kitchen restriction too.
function categoriesForUser(db, session, kitchenItemIds) {
  const allowed = itemsForUser(db, session, db.items).filter(i => !kitchenItemIds || kitchenItemIds.includes(i.id));
  const cats = [...new Set(allowed.map(i => i.category))];
  return db.categories.filter(c => cats.includes(c));
}

// Pulls the DesiFlow Google Sheet ID out of a normal share link.
function extractSheetId(url) {
  const m = (url || "").match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

// Fetches one tab of a shared ("anyone with the link") Google Sheet as parsed rows (array of objects, keyed by header row).
async function fetchGoogleSheetTab(sheetId, tabName, force) {
  const bust = force ? `&_=${Date.now()}` : "";
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}${bust}`;
  const res = await fetch(url, force ? { cache: "no-store" } : {});
  if (!res.ok) throw new Error("Could not reach that sheet tab: " + tabName);
  const text = await res.text();
  const wb = XLSX.read(text, { type: "string" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  // raw:false makes SheetJS return the cell's formatted display text (e.g. "2026-08-17") instead of a
  // raw spreadsheet serial-date number for genuinely date-typed cells.
  return XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
}

// Combines a date-only string ("2026-08-17") with a 12-hour time string ("2:34:55 pm") into one Date.
function parseDateTimeParts(dateStr, timeStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  if (timeStr) {
    const m = String(timeStr).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]\.?m\.?)?$/i);
    if (m) {
      let h = parseInt(m[1], 10);
      const min = parseInt(m[2], 10);
      const sec = m[3] ? parseInt(m[3], 10) : 0;
      const ampm = m[4] ? m[4].toLowerCase().replace(/\./g, "") : null;
      if (ampm === "pm" && h !== 12) h += 12;
      if (ampm === "am" && h === 12) h = 0;
      d.setHours(h, min, sec, 0);
    }
  }
  return d;
}

// "2 x Chicken Biryani, 1 x Naan" -> [{ name: "Chicken Biryani", qty: 2 }, { name: "Naan", qty: 1 }]
function parseSoldItemsText(text) {
  return String(text || "")
    .split(",")
    .map(s => s.trim())
    .filter(Boolean)
    .map(s => {
      const m = s.match(/^(\d+(?:\.\d+)?)\s*x\s*(.+)$/i);
      if (!m) return null;
      return { name: m[2].trim(), qty: Number(m[1]) };
    })
    .filter(Boolean);
}

// Reads a 2-column Excel/CSV file (Name, Amount/Qty) into [{name, value}]. Header row is auto-skipped
// since a non-numeric second column fails the value check and gets dropped.
function parseTwoColFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        const out = rows
          .filter(r => r && r.length >= 2 && r[0] !== undefined && r[0] !== "")
          .map(r => ({ name: String(r[0]).trim(), value: Number(r[1]) }))
          .filter(r => r.name && !isNaN(r.value));
        resolve(out);
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsArrayBuffer(file);
  });
}

// A file-picker + "Upload" button. Calls onRows(parsedRows) once a file is chosen and parsed.
function FileUploadRow({ onRows, flash, label }) {
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);
  const doUpload = async () => {
    if (!file) { flash("Choose a file first", "error"); return; }
    setBusy(true);
    try {
      const rows = await parseTwoColFile(file);
      if (rows.length === 0) { flash("No valid rows found — expect column A = name, column B = amount/qty", "error"); setBusy(false); return; }
      onRows(rows);
      setFile(null);
      if (inputRef.current) inputRef.current.value = "";
    } catch (e) {
      flash("Couldn't read that file", "error");
    }
    setBusy(false);
  };
  return (
    <div className="flex gap-2 items-center">
      <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" onChange={e => setFile(e.target.files[0] || null)}
        className="flex-1 text-xs file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-[#F7F5F0] file:text-[#5C6B62] file:font-semibold" />
      <button onClick={doUpload} disabled={busy} className="bg-[#4A6FA5] text-white px-3 py-2 rounded-xl font-semibold text-xs whitespace-nowrap disabled:opacity-50">{busy ? "..." : (label || "Upload")}</button>
    </div>
  );
}

// Restricts a user to whole categories at a time (tap a category to select/deselect every item in it).
// selected = the user's itemIds array; onSetItemIds replaces it wholesale.
function UserCategoryItemPicker({ db, selectedItemIds, onSetItemIds }) {
  return (
    <div className="flex flex-wrap gap-1.5">
      {db.categories.map(cat => {
        const catItems = db.items.filter(i => i.category === cat).map(i => i.id);
        const selectedCount = catItems.filter(id => selectedItemIds.includes(id)).length;
        const full = selectedCount === catItems.length;
        const partial = selectedCount > 0 && !full;
        return (
          <button key={cat} type="button"
            onClick={() => {
              if (full) onSetItemIds(selectedItemIds.filter(id => !catItems.includes(id)));
              else onSetItemIds([...new Set([...selectedItemIds, ...catItems])]);
            }}
            className={`px-2.5 py-1 rounded-full text-xs font-semibold border ${full ? "bg-[#2B6E63] text-white border-[#2B6E63]" : partial ? "bg-[#FBF0DD] border-[#C98A2C] text-[#7A5C2E]" : "bg-[#F7F5F0] border-[#D8D2C2] text-[#5C6B62]"}`}>
            {cat}{partial ? ` (${selectedCount}/${catItems.length})` : ""}
          </button>
        );
      })}
    </div>
  );
}

/* ---------- App ---------- */

function App() {
  const [db, setDb] = useState(null);
  const [session, setSession] = useState(null);
  const [screen, setScreen] = useState("menu");
  const [toast, setToast] = useState(null);

  useEffect(() => { apiGet().then(setDb).catch(() => setToast({ msg: "Could not connect to server", kind: "error" })); }, []);

  useEffect(() => {
    if (!["menu", "reports"].includes(screen)) return;
    const t = setInterval(() => { apiGet().then(setDb).catch(() => {}); }, 5000);
    return () => clearInterval(t);
  }, [screen]);

  const persist = useCallback(async (next) => {
    setDb(next);
    try { await apiSave(next); } catch { /* best effort */ }
  }, []);

  const flash = (msg, kind = "ok") => { setToast({ msg, kind }); setTimeout(() => setToast(null), 2200); };
  const addLog = (dbNext, action, detail) => {
    dbNext.log = [{ id: uid("l"), at: nowStr(), date: todayStr(), user: session?.name || "-", action, detail }, ...dbNext.log].slice(0, 2000);
  };

  const stockOf = useMemo(() => (branch, itemId, asOfDate) => {
    if (!db) return 0;
    let qty = Number(db.openingStock?.[branch]?.[itemId] || 0);
    if (branch === "Store") db.purchases.forEach(p => { if (p.itemId === itemId && (!asOfDate || p.date <= asOfDate)) qty += Number(p.qty); });
    db.issues.forEach(iss => {
      if (iss.itemId !== itemId) return;
      if (asOfDate && iss.date > asOfDate) return;
      if (iss.from === branch) qty -= Number(iss.qty);
      if (iss.to === branch) qty += Number(iss.qty);
    });
    (db.adjustments || []).forEach(a => {
      if (a.itemId !== itemId || a.branch !== branch) return;
      if (asOfDate && a.date > asOfDate) return;
      qty += Number(a.qty);
    });
    return qty;
  }, [db]);

  const balanceOf = useMemo(() => (supplierId) => {
    if (!db) return 0;
    const supplier = db.suppliers.find(s => s.id === supplierId);
    const opening = Number(supplier?.openingBalance || 0);
    const owed = db.purchases.filter(p => p.supplierId === supplierId && p.paymentMode === "credit").reduce((a, p) => a + p.amount, 0);
    const paid = (db.payments || []).filter(x => x.supplierId === supplierId).reduce((a, x) => a + x.amount, 0);
    return opening + owed - paid;
  }, [db]);

  const lastBillOf = useMemo(() => (supplierId) => {
    if (!db) return null;
    const list = db.purchases.filter(p => p.supplierId === supplierId);
    return list.length ? list[0] : null; // purchases are prepended, so first = latest
  }, [db]);

  if (!db) return <div className="min-h-screen flex items-center justify-center text-[#1F2A24] font-semibold">Loading…</div>;
  if (!session) return <LoginScreen db={db} onLogin={(u) => { setSession(u); setScreen("menu"); }} />;

  const commonProps = { db, session, persist, addLog, flash, stockOf, balanceOf, lastBillOf, setScreen };

  return (
    <div className="min-h-screen bg-[#F4EFE4] pb-8">
      <Toast msg={toast?.msg} kind={toast?.kind} />
      {screen === "menu" && <MainMenu db={db} session={session} persist={persist} onLogout={() => setSession(null)} setScreen={setScreen} />}
      {screen === "purchase" && <PurchaseScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "issue" && <IssueScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "ending" && <EndingScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "demand" && <DemandScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "adjustment" && <AdjustmentScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "conversion" && <ConversionScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "labor" && <LaborScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "review" && <CustomerReviewScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "owner_ledger" && <OwnerTransactionScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "receive" && <ConfirmReceiptScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "payment" && <PaymentScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "reports" && <ReportsScreen {...commonProps} onBack={() => setScreen("menu")} />}
      {screen === "admin" && <AdminScreen {...commonProps} onBack={() => setScreen("menu")} />}
    </div>
  );
}

/* ---------- Login ---------- */

function LoginScreen({ db, onLogin }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const press = (d) => {
    setErr("");
    const next = (pin + d).slice(0, 6);
    setPin(next);
    const match = db.users.find(u => u.pin === next);
    if (match) setTimeout(() => onLogin(match), 120);
  };
  const back = () => setPin(pin.slice(0, -1));
  useEffect(() => {
    if (pin.length === 6 && !db.users.find(u => u.pin === pin)) {
      setErr("Incorrect PIN"); setTimeout(() => setPin(""), 500);
    }
  }, [pin]);

  return (
    <div className="min-h-screen bg-[#1F2A24] flex flex-col items-center justify-center px-6">
      <div className="text-2xl font-black tracking-tight text-[#F4EFE4] mb-1">🏭 StockFlow</div>
      <div className="text-[#8FA096] text-sm mb-8">Enter your PIN to continue</div>
      <div className="flex gap-3 mb-2 h-4">
        {Array.from({ length: Math.max(pin.length, 4) }).map((_, i) => (
          <div key={i} className={`w-3.5 h-3.5 rounded-full border-2 ${i < pin.length ? "bg-[#C98A2C] border-[#C98A2C]" : "border-[#4A5952]"}`} />
        ))}
      </div>
      <div className="text-xs h-5 mb-4 font-semibold" style={{ color: err ? "#E8877A" : "transparent" }}>{err || "-"}</div>
      <div className="grid grid-cols-3 gap-4 w-full max-w-[280px]">
        {[1,2,3,4,5,6,7,8,9].map(d => (
          <button key={d} onClick={() => press(String(d))} className="aspect-square rounded-full bg-[#2C3931] active:bg-[#3A4A40] text-[#F4EFE4] text-2xl font-bold">{d}</button>
        ))}
        <div />
        <button onClick={() => press("0")} className="aspect-square rounded-full bg-[#2C3931] active:bg-[#3A4A40] text-[#F4EFE4] text-2xl font-bold">0</button>
        <button onClick={back} className="aspect-square rounded-full flex items-center justify-center text-[#8FA096] active:text-white text-xl">⌫</button>
      </div>
    </div>
  );
}

/* ---------- Purchase ---------- */

function PurchaseScreen({ db, session, persist, addLog, flash, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const canBackdate = session.canBackdate || (session.permissions || []).includes("admin");
  const [entryDate, setEntryDate] = useState(todayStr());
  const [supplierId, setSupplierId] = useState(db.suppliers[0]?.id || "");
  const [category, setCategory] = useState("");
  const [cashBranch, setCashBranch] = useState(myBranches[0]);
  const [rows, setRows] = useState({}); // itemId -> { qty, rate }
  const [payMode, setPayMode] = useState("credit");
  const [todayInputs, setTodayInputs] = useState({}); // category -> value

  const supplier = db.suppliers.find(s => s.id === supplierId);
  const supplierItems = itemsForUser(db, session, supplier ? db.items.filter(i => supplier.itemIds.includes(i.id)) : []);
  const supplierCats = [...new Set(supplierItems.map(i => i.category))];
  const cashCategories = categoriesForUser(db, session, null);
  const visibleItems = payMode === "cash"
    ? (category ? itemsForUser(db, session, db.items.filter(i => i.category === category)) : [])
    : (category ? supplierItems.filter(i => i.category === category) : supplierItems);

  useEffect(() => { setRows({}); setCategory(""); }, [supplierId, payMode]);

  // pricing per item, recomputed whenever today's rates change
  const pricingByItem = useMemo(() => {
    const map = {};
    visibleItems.forEach(i => { map[i.id] = supplierId ? computeRate(db, supplierId, i.id) : null; });
    return map;
  }, [supplierId, visibleItems.map(i => i.id).join(","), db.todayRates]);

  useEffect(() => {
    setRows(prev => {
      const next = { ...prev };
      visibleItems.forEach(i => {
        const p = pricingByItem[i.id];
        if (p && p.rate !== undefined && (next[i.id]?.rate === undefined || next[i.id]?.rate === "")) {
          next[i.id] = { ...next[i.id], rate: String(p.rate) };
        }
      });
      return next;
    });
  }, [pricingByItem]);

  const anyCashOnly = visibleItems.some(i => rows[i.id]?.qty && pricingByItem[i.id]?.cashOnly);
  useEffect(() => { if (anyCashOnly) setPayMode("cash"); }, [anyCashOnly]);

  const categoriesNeedingToday = [...new Set(
    visibleItems.filter(i => pricingByItem[i.id]?.needsToday).map(i => pricingByItem[i.id].category)
  )];
  // Every category with at least one formula-priced item in view, whether or not today's rate is already set —
  // shown so the rate is always visible/changeable, not just the first time it's missing.
  const formulaCategories = [...new Set(
    visibleItems.filter(i => pricingByItem[i.id]?.mode === "formula").map(i => pricingByItem[i.id].category)
  )];
  const [editingTodayCat, setEditingTodayCat] = useState(null);

  const setRow = (itemId, field, value) => setRows(v => ({ ...v, [itemId]: { ...v[itemId], [field]: value } }));

  const saveTodayRate = (cat) => {
    const val = todayInputs[cat];
    if (!val || Number(val) <= 0) { flash("Enter a valid rate", "error"); return; }
    const next = { ...db, todayRates: { ...db.todayRates, [cat]: { date: todayStr(), rate: Number(val) } } };
    addLog(next, "Today's Rate", `${cat} rate set to ${val}`);
    persist(next);
    // Clear any rates already shown for this category's formula items so they recompute with the new rate.
    setRows(prev => {
      const next2 = { ...prev };
      visibleItems.forEach(i => {
        if (pricingByItem[i.id]?.mode === "formula" && pricingByItem[i.id]?.category === cat) {
          next2[i.id] = { ...next2[i.id], rate: "" };
        }
      });
      return next2;
    });
    setTodayInputs(v => ({ ...v, [cat]: "" }));
    flash("Today's rate saved");
  };

  const entries = Object.entries(rows).filter(([id, r]) => Number(r?.qty) > 0 && Number(r?.rate) > 0);
  const total = entries.reduce((a, [, r]) => a + Number(r.qty) * Number(r.rate), 0);

  const save = () => {
    if (entries.length === 0) { flash("Enter quantity and rate for at least one item", "error"); return; }
    if (categoriesNeedingToday.length > 0) { flash("Set today's rate for: " + categoriesNeedingToday.join(", "), "error"); return; }
    const recs = entries.map(([itemId, r]) => {
      const qty = Number(r.qty), rate = Number(r.rate);
      return { id: uid("p"), date: entryDate, itemId, supplierId, qty, rate, amount: qty * rate, paymentMode: payMode, branch: payMode === "cash" ? cashBranch : null, userId: session.id };
    });
    const next = { ...db, purchases: [...recs, ...db.purchases] };
    addLog(next, "Purchase", `${supplier.name}: ${recs.length} item(s), bill ${money(total)} (${payMode})`);
    persist(next);
    notifyUsers(adminRecipients(db), "New Purchase", `${supplier.name}: ${recs.length} item(s), ${money(total)} (${payMode})`);
    flash("Bill saved — " + recs.length + " item(s)");
    setRows({});
  };

  return (
    <div>
      <TopBar title="Purchase" onBack={onDone} />
      <div className="p-5">
        {canBackdate && (
          <Field label="Date">
            <input type="date" className={selCls} value={entryDate} onChange={e => setEntryDate(e.target.value)} max={todayStr()} />
          </Field>
        )}
        <Field label="Supplier">
          <select className={selCls} value={supplierId} onChange={e => setSupplierId(e.target.value)}>
            {db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>

        <Field label="Payment">
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={() => !anyCashOnly && setPayMode("credit")}
              className={`py-3 rounded-xl font-semibold border-2 ${payMode === "credit" ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white border-[#D8D2C2] text-[#5C6B62]"} ${anyCashOnly ? "opacity-40 pointer-events-none" : ""}`}>
              Credit (Udhaar)
            </button>
            <button type="button" onClick={() => setPayMode("cash")}
              className={`py-3 rounded-xl font-semibold border-2 ${payMode === "cash" ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white border-[#D8D2C2] text-[#5C6B62]"}`}>
              Cash
            </button>
          </div>
          {anyCashOnly && <div className="text-xs text-[#B3562C] font-semibold mt-1.5">One or more selected items are cash-only</div>}
        </Field>

        {payMode === "cash" && (
          <React.Fragment>
            <Field label="Branch (for cash material)">
              <select className={selCls} value={cashBranch} onChange={e => setCashBranch(e.target.value)}>
                {myBranches.map(b => <option key={b}>{b}</option>)}
              </select>
            </Field>
            <Field label="Category">
              <select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>
                <option value="">Select a category…</option>
                {cashCategories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
          </React.Fragment>
        )}

        {formulaCategories.map(cat => {
          const needsToday = categoriesNeedingToday.includes(cat);
          const currentRate = db.todayRates?.[cat]?.rate;
          const isOpen = needsToday || editingTodayCat === cat;
          return (
            <div key={cat} className="bg-[#FBF0DD] border-2 border-[#C98A2C] rounded-xl p-3.5 mb-4">
              {!isOpen ? (
                <div className="flex items-center justify-between">
                  <div className="text-sm font-semibold text-[#7A5C2E]">Today's {cat} rate: <span className="font-mono">{currentRate}</span></div>
                  <button onClick={() => { setEditingTodayCat(cat); setTodayInputs(v => ({ ...v, [cat]: String(currentRate ?? "") })); }} className="text-xs font-semibold text-[#7A5C2E] bg-white px-3 py-1.5 rounded-full border border-[#C98A2C]">Change</button>
                </div>
              ) : (
                <React.Fragment>
                  <div className="text-sm font-semibold text-[#7A5C2E] mb-2">{needsToday ? `Set today's ${cat} rate first` : `Update today's ${cat} rate`}</div>
                  <div className="flex gap-2">
                    <input className={numCls} type="number" inputMode="decimal" placeholder="e.g. 450"
                      value={todayInputs[cat] || ""} onChange={e => setTodayInputs(v => ({ ...v, [cat]: e.target.value }))} />
                    <button onClick={() => { saveTodayRate(cat); setEditingTodayCat(null); }} className="bg-[#C98A2C] text-white px-4 rounded-xl font-semibold whitespace-nowrap">Set</button>
                    {!needsToday && <button onClick={() => setEditingTodayCat(null)} className="bg-white text-[#7A5C2E] px-3 rounded-xl font-semibold border border-[#C98A2C]">Cancel</button>}
                  </div>
                </React.Fragment>
              )}
            </div>
          );
        })}

        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">
          {payMode === "cash"
            ? (category ? `${category} — Items & Rates` : "Select a category")
            : (supplier ? `${supplier.name} — Items & Rates` : "Select a supplier")}
        </div>
        <div className="space-y-2.5 mb-5">
          {visibleItems.map(it => {
            const p = pricingByItem[it.id];
            const locked = !!(p && (p.mode === "fixed" || (p.mode === "formula" && !p.needsToday)));
            const r = rows[it.id] || {};
            const amt = (Number(r.qty) || 0) * (Number(r.rate) || 0);
            return (
              <div key={it.id} className="bg-white rounded-xl p-3 border-2 border-[#EAE4D4]">
                <div className="flex items-center justify-between mb-2">
                  <div className="font-semibold text-[#1F2A24]">{it.name}{it.nameUr && <span className="text-[#8A9690] font-normal"> — {it.nameUr}</span>}</div>
                  <div className="text-[11px] text-[#8A9690]">{it.unit}{p?.cashOnly ? " · cash only" : ""}</div>
                </div>
                <div className="grid grid-cols-3 gap-2 items-center">
                  <input className="bg-[#F7F5F0] border-2 border-[#D8D2C2] rounded-lg px-2 py-2 text-right font-mono font-semibold text-[15px] focus:outline-none focus:border-[#C98A2C]"
                    type="number" inputMode="decimal" placeholder="Qty" value={r.qty || ""} onChange={e => setRow(it.id, "qty", e.target.value)} />
                  <input className="bg-[#F7F5F0] border-2 border-[#D8D2C2] rounded-lg px-2 py-2 text-right font-mono font-semibold text-[15px] focus:outline-none focus:border-[#C98A2C] disabled:opacity-70"
                    type="number" inputMode="decimal" placeholder="Rate" value={r.rate || ""} onChange={e => setRow(it.id, "rate", e.target.value)}
                    disabled={locked} />
                  <div className="text-right font-mono font-bold text-[#1F2A24]">{amt > 0 ? money(amt) : "–"}</div>
                </div>
              </div>
            );
          })}
          {payMode !== "cash" && supplier && visibleItems.length === 0 && <div className="text-sm text-[#8A9690]">No items linked to this supplier yet — add them in Admin.</div>}
          {payMode === "cash" && category && visibleItems.length === 0 && <div className="text-sm text-[#8A9690]">No items in this category yet — add them in Admin.</div>}
        </div>

        <div className="bg-[#2C3931] text-[#F4EFE4] rounded-xl p-4 mb-5 flex items-center justify-between">
          <span className="text-sm font-semibold text-[#C98A2C] uppercase tracking-wide">Bill Total</span>
          <span className="text-xl font-mono font-bold">{money(total)}</span>
        </div>
        <button className={btnPrimary} onClick={save} disabled={entries.length === 0}>Save Bill</button>
      </div>
    </div>
  );
}
/* ---------- Shared grid ---------- */

function ItemQtyGrid({ items, values, setValues, stockCheck }) {
  return (
    <div className="space-y-2.5">
      {items.map(it => {
        const val = values[it.id] || "";
        const avail = stockCheck ? stockCheck(it.id) : null;
        const over = stockCheck && Number(val) > avail;
        return (
          <div key={it.id} className={`bg-white rounded-xl p-3 border-2 flex items-center justify-between gap-3 ${over ? "border-[#B33A3A]" : "border-[#EAE4D4]"}`}>
            <div className="min-w-0">
              <div className="font-semibold text-[#1F2A24] truncate">{it.name}{it.nameUr && <span className="text-[#8A9690] font-normal"> — {it.nameUr}</span>}</div>
              <div className="text-[11px] text-[#8A9690]">{it.unit}{stockCheck && <span className={over ? "text-[#B33A3A] font-bold" : ""}> · {avail} in stock</span>}</div>
            </div>
            <input className="w-24 bg-[#F7F5F0] border-2 border-[#D8D2C2] rounded-lg px-2 py-2 text-right font-mono font-bold text-[16px] focus:outline-none focus:border-[#C98A2C]"
              type="number" inputMode="decimal" placeholder="0" value={val} onChange={e => setValues(v => ({ ...v, [it.id]: e.target.value }))} />
          </div>
        );
      })}
    </div>
  );
}

// Compact "pick item + qty, add to list" builder used for recipe consumes/produces lists.
function RecipeItemList({ db, list, onAdd, onRemove, addItemId, setAddItemId, addQty, setAddQty }) {
  const itemName = (id) => db.items.find(i => i.id === id)?.name || id;
  return (
    <div>
      {list.map(row => (
        <div key={row.itemId} className="flex justify-between items-center bg-white rounded-lg p-2 mb-1.5 border border-[#EFEBDF]">
          <span className="text-sm">{itemName(row.itemId)} <span className="text-[#8A9690] font-mono">× {row.qty}</span></span>
          <button onClick={() => onRemove(row.itemId)} className="text-[#B33A3A] text-xs font-semibold">✕</button>

      ))}

        <select className={selCls} value={addItemId} onChange={e => setAddItemId(e.target.value)}>

          {db.items.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}

        <input className={numCls + " w-20"} type="number" placeholder="Qty" value={addQty} onChange={e => setAddQty(e.target.value)} />
        <button onClick={onAdd} className="bg-[#2B6E63] text-white px-3 rounded-xl font-semibold whitespace-nowrap">+ Add</button>
      </div>
    </div>
  );
}

/* ---------- Issue ---------- */

function IssueScreen({ db, session, persist, addLog, flash, stockOf, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const canBackdate = session.canBackdate || (session.permissions || []).includes("admin");
  const [entryDate, setEntryDate] = useState(todayStr());
  const [from, setFrom] = useState(myBranches[0]);
  const [to, setTo] = useState(BRANCHES.find(b => b !== myBranches[0]) || BRANCHES[1]);
  const toKitchens = kitchensOf(db, to);
  const [kitchenId, setKitchenId] = useState("");
  const myCategories = categoriesForUser(db, session, null);
  const [category, setCategory] = useState(myCategories[0] || db.categories[0]);
  const [values, setValues] = useState({});
  const items = itemsForUser(db, session, db.items.filter(i => i.category === category));
  useEffect(() => { setValues({}); }, [category, from, to, kitchenId]);
  useEffect(() => { setKitchenId(""); }, [to]);
  const entries = Object.entries(values).filter(([, v]) => Number(v) > 0);
  const anyOver = entries.some(([id, v]) => Number(v) > stockOf(from, id));

  const save = () => {
    if (from === to) { flash("From and To must differ", "error"); return; }
    if (entries.length === 0) { flash("Enter at least one quantity", "error"); return; }
    if (anyOver) { flash("Not enough stock for one or more items", "error"); return; }
    const recs = entries.map(([itemId, v]) => ({ id: uid("iss"), date: entryDate, ts: Date.now(), from, to, kitchenId: kitchenId || null, itemId, qty: Number(v), userId: session.id }));
    const next = { ...db, issues: [...recs, ...db.issues] };
    const kName = toKitchens.find(k => k.id === kitchenId)?.name;
    addLog(next, "Issue", `${from} → ${to}${kName ? " (" + kName + ")" : ""}: ${entries.length} item(s)`);
    persist(next);
    notifyUsers(branchRecipients(db, to, kitchenId), "Stock Delivered", `${entries.length} item(s) sent from ${from} to ${to}${kName ? " (" + kName + ")" : ""}`);
    flash("Issue saved"); setValues({});
  };

  return (
    <div>
      <TopBar title="Issue" onBack={onDone} />
      <div className="p-5">
        {canBackdate && (
          <Field label="Date">
            <input type="date" className={selCls} value={entryDate} onChange={e => setEntryDate(e.target.value)} max={todayStr()} />
          </Field>
        )}
        <div className="grid grid-cols-2 gap-3">
          <Field label="Issue From"><select className={selCls} value={from} onChange={e => setFrom(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>
          <Field label="Issue To"><select className={selCls} value={to} onChange={e => setTo(e.target.value)}>{BRANCHES.filter(b => b !== from).map(b => <option key={b}>{b}</option>)}</select></Field>
        </div>
        {toKitchens.length > 0 && (
          <Field label="Kitchen (optional)">
            <select className={selCls} value={kitchenId} onChange={e => setKitchenId(e.target.value)}>
              <option value="">— Branch general —</option>
              {toKitchens.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}
            </select>
          </Field>
        )}
        <Field label="Item Category"><select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>{myCategories.map(c => <option key={c}>{c}</option>)}</select></Field>
        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">Items & Quantity</div>
        <div className="mb-5"><ItemQtyGrid items={items} values={values} setValues={setValues} stockCheck={(id) => stockOf(from, id)} /></div>
        <button className={btnPrimary} onClick={save}>Save Issue</button>
      </div>
    </div>
  );
}

/* ---------- Ending ---------- */

function EndingScreen({ db, session, persist, addLog, flash, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const canBackdate = session.canBackdate || (session.permissions || []).includes("admin");
  const [entryDate, setEntryDate] = useState(todayStr());
  const [branch, setBranch] = useState(myBranches[0]);
  const myKitchens = myKitchensFor(db, session, branch);
  const [kitchenId, setKitchenId] = useState(myKitchens[0]?.id || "");
  const activeKitchen = myKitchens.find(k => k.id === kitchenId);
  const kitchenItemIds = activeKitchen && activeKitchen.itemIds && activeKitchen.itemIds.length ? activeKitchen.itemIds : null;
  const myCategories = categoriesForUser(db, session, kitchenItemIds);
  const [category, setCategory] = useState(myCategories[0] || db.categories[0]);
  useEffect(() => { if (!myCategories.includes(category)) setCategory(myCategories[0] || ""); }, [kitchenId, branch]);
  const [values, setValues] = useState({});
  const items = itemsForUser(db, session, db.items.filter(i => i.category === category && (!kitchenItemIds || kitchenItemIds.includes(i.id))));

  useEffect(() => { setKitchenId(myKitchensFor(db, session, branch)[0]?.id || ""); }, [branch]);
  const entries = Object.entries(values).filter(([, v]) => v !== "" && v !== undefined);

  const save = () => {
    if (entries.length === 0) { flash("Enter at least one quantity", "error"); return; }

    const recs = entries.map(([itemId, v]) => ({ id: uid("end"), date: entryDate, branch, kitchenId: kitchenId || null, itemId, qty: Number(v), userId: session.id }));
    const next = { ...db, endings: [...recs, ...db.endings] };
    const kName = myKitchens.find(k => k.id === kitchenId)?.name;
    addLog(next, "Ending", `${branch}${kName ? " — " + kName : ""}: ${entries.length} item(s)`);
    persist(next);
    notifyUsers(adminRecipients(db), "Ending Recorded", `${branch}${kName ? " — " + kName : ""}: ${entries.length} item(s)`);

        )}
        <Field label="Branch"><select className={selCls} value={branch} onChange={e => setBranch(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>
        {myKitchens.length > 0 && (
          <Field label="Kitchen">
            <select className={selCls} value={kitchenId} onChange={e => setKitchenId(e.target.value)}>
              {myKitchens.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}
            </select>
          </Field>
        )}
        <Field label="Item Category"><select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>{myCategories.map(c => <option key={c}>{c}</option>)}</select></Field>
        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">Closing Count</div>
        <div className="mb-5"><ItemQtyGrid items={items} values={values} setValues={setValues} /></div>
        <button className={btnPrimary} onClick={save}>Save Ending</button>
      </div>
    </div>
  );
}

/* ---------- Adjustment (wastage / theft / found stock) ---------- */

function AdjustmentScreen({ db, session, persist, addLog, flash, stockOf, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const canBackdate = session.canBackdate || (session.permissions || []).includes("admin");
  const [entryDate, setEntryDate] = useState(todayStr());
  const [branch, setBranch] = useState(myBranches[0]);
  const myCategories = categoriesForUser(db, session, null);
  const [category, setCategory] = useState(myCategories[0] || db.categories[0]);
  const [kind, setKind] = useState("wastage"); // wastage | theft | damage | found
  const [reason, setReason] = useState("");
  const [values, setValues] = useState({}); // itemId -> qty (always entered positive, sign applied on save)
  const items = itemsForUser(db, session, db.items.filter(i => i.category === category));
  useEffect(() => { setValues({}); }, [category, branch]);
  const entries = Object.entries(values).filter(([, v]) => Number(v) > 0);
  const isLoss = kind !== "found";

  const save = () => {
    if (entries.length === 0) { flash("Enter at least one quantity", "error"); return; }
    const recs = entries.map(([itemId, v]) => ({
      id: uid("adj"), date: entryDate, branch, itemId,
      qty: isLoss ? -Math.abs(Number(v)) : Math.abs(Number(v)),
      kind, reason: reason.trim(), userId: session.id,
    }));
    const next = { ...db, adjustments: [...recs, ...(db.adjustments || [])] };
    addLog(next, "Adjustment", `${branch}: ${entries.length} item(s) — ${kind}${reason ? " (" + reason + ")" : ""}`);
    persist(next);
    notifyUsers(adminRecipients(db), "Stock Adjustment", `${branch}: ${entries.length} item(s) — ${kind}${reason ? " (" + reason + ")" : ""}`);
    flash("Adjustment saved"); setValues({}); setReason("");
  };

  return (
    <div>
      <TopBar title="Adjustment" onBack={onDone} />
      <div className="p-5">
        {canBackdate && (
          <Field label="Date">
            <input type="date" className={selCls} value={entryDate} onChange={e => setEntryDate(e.target.value)} max={todayStr()} />
          </Field>
        )}
        <Field label="Branch"><select className={selCls} value={branch} onChange={e => setBranch(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>
        <Field label="Type">
          <div className="grid grid-cols-4 gap-1.5">
            {["wastage", "theft", "damage", "found"].map(k => (
              <button key={k} onClick={() => setKind(k)} className={`py-2.5 rounded-lg text-xs font-semibold capitalize border-2 ${kind === k ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white border-[#D8D2C2] text-[#5C6B62]"}`}>{k}</button>
            ))}
          </div>
        </Field>
        <Field label="Note (optional)">
          <input className={numCls + " font-sans"} value={reason} onChange={e => setReason(e.target.value)} placeholder="e.g. spoiled overnight" />
        </Field>
        <Field label="Item Category"><select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>{myCategories.map(c => <option key={c}>{c}</option>)}</select></Field>
        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">
          {isLoss ? "Quantity Lost" : "Quantity Found"}
        </div>
        <div className="mb-5"><ItemQtyGrid items={items} values={values} setValues={setValues} stockCheck={(id) => stockOf(branch, id)} /></div>
        <button className={btnPrimary} onClick={save}>Save Adjustment</button>
      </div>
    </div>
  );
}

/* ---------- Conversion (raw material -> finished items, e.g. BBQ station) ---------- */

function ConversionScreen({ db, session, persist, addLog, flash, stockOf, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const [branch, setBranch] = useState(myBranches[0]);
  const availableRecipes = (db.recipes || []).filter(r => !r.branch || r.branch === branch);
  const [recipeId, setRecipeId] = useState("");
  const [batches, setBatches] = useState("1");
  const [note, setNote] = useState("");
  useEffect(() => { setRecipeId(availableRecipes[0]?.id || ""); }, [branch]);
  const recipe = availableRecipes.find(r => r.id === recipeId);
  const itemName = (id) => db.items.find(i => i.id === id)?.name || id;
  const mult = Number(batches) || 0;

  const save = () => {
    if (!recipe) { flash("Select a recipe", "error"); return; }
    if (mult <= 0) { flash("Enter how many batches", "error"); return; }
    const usedRecs = recipe.consumes.map(c => ({
      id: uid("adj"), date: todayStr(), branch, itemId: c.itemId, qty: -Math.abs(c.qty * mult),
      kind: "conversion", reason: `Recipe: ${recipe.name} × ${mult}${note ? " — " + note : ""}`,
      userId: session.id,
    }));
    const madeRecs = recipe.produces.map(p => ({
      id: uid("adj"), date: todayStr(), branch, itemId: p.itemId, qty: Math.abs(p.qty * mult),
      kind: "conversion", reason: `Recipe: ${recipe.name} × ${mult}${note ? " — " + note : ""}`,
      userId: session.id,
    }));
    const next = { ...db, adjustments: [...usedRecs, ...madeRecs, ...(db.adjustments || [])] };
    addLog(next, "Conversion", `${branch}: ${recipe.name} × ${mult}${note ? " — " + note : ""}`);
    persist(next);
    notifyUsers(adminRecipients(db), "Conversion Recorded", `${branch}: ${recipe.name} × ${mult}`);
    flash("Conversion saved"); setBatches("1"); setNote("");
  };

  return (
    <div>
      <TopBar title="Conversion" onBack={onDone} />
      <div className="p-5">
        <Field label="Branch"><select className={selCls} value={branch} onChange={e => setBranch(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>

        {availableRecipes.length === 0 ? (
          <div className="text-sm text-[#8A9690] mb-4">No recipes set up for {branch} yet — ask your admin to add one in Admin &gt; Recipes.</div>
        ) : (
          <React.Fragment>
            <Field label="Recipe">
              <select className={selCls} value={recipeId} onChange={e => setRecipeId(e.target.value)}>
                {availableRecipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
            </Field>

            {recipe && (
              <div className="bg-white rounded-xl p-3.5 border-2 border-[#EAE4D4] mb-4">
                <div className="text-xs font-semibold uppercase tracking-wide text-[#8A9690] mb-1.5">Uses</div>
                {recipe.consumes.map(c => (
                  <div key={c.itemId} className="flex justify-between text-sm py-0.5">
                    <span>{itemName(c.itemId)}</span>
                    <span className="font-mono">{(c.qty * mult) || c.qty}{mult !== 1 ? ` (${c.qty} × ${mult})` : ""}</span>
                  </div>
                ))}
                <div className="text-xs font-semibold uppercase tracking-wide text-[#8A9690] mt-3 mb-1.5">Makes</div>
                {recipe.produces.map(p => (
                  <div key={p.itemId} className="flex justify-between text-sm py-0.5">
                    <span>{itemName(p.itemId)}</span>
                    <span className="font-mono">{(p.qty * mult) || p.qty}{mult !== 1 ? ` (${p.qty} × ${mult})` : ""}</span>
                  </div>
                ))}
              </div>
            )}

            <Field label="How many batches">
              <input className={numCls} type="number" inputMode="decimal" value={batches} onChange={e => setBatches(e.target.value)} placeholder="1" />
            </Field>
            <Field label="Note (optional)">
              <input className={numCls + " font-sans"} value={note} onChange={e => setNote(e.target.value)} placeholder="e.g. evening batch" />
            </Field>

            <div className="text-[11px] text-[#8A9690] mb-4">If the real output is different, save this as-is and correct the difference in Adjustment.</div>
            <button className={btnPrimary} onClick={save}>Save Conversion</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ---------- Labor (attendance + daily wage) ---------- */

function LaborScreen({ db, session, persist, addLog, flash, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const [branch, setBranch] = useState(myBranches[0]);
  const [date, setDate] = useState(todayStr());
  const laborsHere = (db.labors || []).filter(l => l.active !== false && (!l.branch || l.branch === branch));
  const [statusDraft, setStatusDraft] = useState({}); // laborId -> status
  const [payOpenFor, setPayOpenFor] = useState(null);
  const [payAmount, setPayAmount] = useState("");
  const [payNote, setPayNote] = useState("");
  const [showAddLabor, setShowAddLabor] = useState(false);
  const [newLaborName, setNewLaborName] = useState("");
  const [newLaborNic, setNewLaborNic] = useState("");
  const [newLaborPhone, setNewLaborPhone] = useState("");
  const [newLaborWage, setNewLaborWage] = useState("");

  const addLaborHere = () => {
    if (!newLaborName.trim() || !newLaborWage || Number(newLaborWage) <= 0) { flash("Name and daily wage required", "error"); return; }
    const rec = { id: uid("lab"), name: newLaborName.trim(), nic: newLaborNic.trim(), phone: newLaborPhone.trim(), dailyWage: Number(newLaborWage), branch, active: true };
    const next = { ...db, labors: [...(db.labors || []), rec] };
    addLog(next, "Labor", `Added labor ${rec.name} (${branch})`);
    persist(next); setNewLaborName(""); setNewLaborNic(""); setNewLaborPhone(""); setNewLaborWage(""); setShowAddLabor(false); flash("Labor added");
  };

  const statusFor = (laborId) => {
    if (statusDraft[laborId]) return statusDraft[laborId];
    const existing = (db.attendance || []).find(a => a.laborId === laborId && a.date === date);
    return existing?.status || "";
  };

  const setStatus = (laborId, status) => setStatusDraft(d => ({ ...d, [laborId]: status }));

  const saveAttendance = () => {
    const toSave = Object.entries(statusDraft).filter(([, v]) => v);
    if (toSave.length === 0) { flash("Mark at least one person's attendance", "error"); return; }
    let next = { ...db };
    toSave.forEach(([laborId, status]) => {
      const existingIdx = (next.attendance || []).findIndex(a => a.laborId === laborId && a.date === date);
      const rec = { id: existingIdx >= 0 ? next.attendance[existingIdx].id : uid("att"), date, laborId, branch, status, userId: session.id };
      if (existingIdx >= 0) {
        next.attendance = next.attendance.map((a, i) => i === existingIdx ? rec : a);
      } else {
        next.attendance = [rec, ...(next.attendance || [])];
      }
    });
    addLog(next, "Attendance", `${branch} ${date}: ${toSave.length} marked`);
    persist(next); flash("Attendance saved"); setStatusDraft({});
  };

  const savePayment = (laborId) => {
    const amt = Number(payAmount);
    if (!amt || amt <= 0) { flash("Enter a valid amount", "error"); return; }
    const rec = { id: uid("lpay"), date, laborId, amount: amt, note: payNote.trim(), userId: session.id };
    const next = { ...db, laborPayments: [rec, ...(db.laborPayments || [])] };
    const labor = (db.labors || []).find(l => l.id === laborId);
    addLog(next, "Labor Payment", `Paid ${money(amt)} to ${labor?.name}`);
    persist(next); setPayOpenFor(null); setPayAmount(""); setPayNote(""); flash("Payment saved");
  };

  return (
    <div>
      <TopBar title="Labor" onBack={onDone} />
      <div className="p-5">
        <div className="grid grid-cols-2 gap-3 mb-2">
          <Field label="Branch"><select className={selCls} value={branch} onChange={e => setBranch(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>
          <Field label="Date"><input type="date" className={selCls} value={date} onChange={e => setDate(e.target.value)} /></Field>
        </div>

        {!showAddLabor ? (
          <button onClick={() => setShowAddLabor(true)} className="text-xs font-semibold text-[#4A6FA5] bg-[#4A6FA5]/10 px-3 py-2 rounded-full mb-4">+ Add New Labor</button>
        ) : (
          <div className="bg-white rounded-xl p-3.5 border-2 border-[#4A6FA5] mb-4">
            <input className={numCls + " font-sans mb-2"} placeholder="Name" value={newLaborName} onChange={e => setNewLaborName(e.target.value)} />
            <div className="grid grid-cols-2 gap-2 mb-2">
              <input className={numCls + " font-sans"} placeholder="NIC number" value={newLaborNic} onChange={e => setNewLaborNic(e.target.value)} />
              <input className={numCls} type="tel" placeholder="Contact number" value={newLaborPhone} onChange={e => setNewLaborPhone(e.target.value)} />
            </div>
            <input className={numCls + " mb-2"} type="number" placeholder="Daily wage" value={newLaborWage} onChange={e => setNewLaborWage(e.target.value)} />
            <div className="text-[11px] text-[#8A9690] mb-2">Will be added for {branch}.</div>
            <div className="flex gap-2">
              <button onClick={addLaborHere} className="bg-[#C98A2C] text-white px-4 py-2 rounded-xl font-semibold">Save</button>
              <button onClick={() => setShowAddLabor(false)} className="bg-[#F7F5F0] text-[#5C6B62] px-4 py-2 rounded-xl font-semibold">Cancel</button>
            </div>
          </div>
        )}

        {laborsHere.length === 0 && <div className="text-sm text-[#8A9690] mb-4">No labor set up for {branch} yet.</div>}

        {laborsHere.map(l => {
          const st = statusFor(l.id);
          return (
            <div key={l.id} className="bg-white rounded-xl p-3 border-2 border-[#EAE4D4] mb-3">
              <div className="flex justify-between items-center mb-2">
                <div className="font-semibold text-[#1F2A24]">{l.name}</div>
                <div className="text-xs text-[#8A9690] font-mono">{money(l.dailyWage)}/day</div>
              </div>
              <div className="grid grid-cols-3 gap-1.5 mb-2">
                {["present", "late", "absent"].map(s => (
                  <button key={s} onClick={() => setStatus(l.id, s)} className={`py-2 rounded-lg text-xs font-semibold capitalize border-2 ${st === s ? (s === "absent" ? "bg-[#B33A3A] text-white border-[#B33A3A]" : s === "late" ? "bg-[#C98A2C] text-white border-[#C98A2C]" : "bg-[#2B6E63] text-white border-[#2B6E63]") : "bg-white border-[#D8D2C2] text-[#5C6B62]"}`}>{s}</button>
                ))}
              </div>
              {payOpenFor !== l.id ? (
                <button onClick={() => { setPayOpenFor(l.id); setPayAmount(""); setPayNote(""); }} className="text-xs font-semibold text-[#4A6FA5] bg-[#4A6FA5]/10 px-3 py-1.5 rounded-full">+ Record Payment</button>
              ) : (
                <div className="flex gap-2 mt-1">
                  <input className={numCls} type="number" placeholder="Amount" value={payAmount} onChange={e => setPayAmount(e.target.value)} />
                  <input className={numCls + " font-sans"} placeholder="Note" value={payNote} onChange={e => setPayNote(e.target.value)} />
                  <button onClick={() => savePayment(l.id)} className="bg-[#C98A2C] text-white px-3 rounded-xl font-semibold whitespace-nowrap">Save</button>
                  <button onClick={() => setPayOpenFor(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-3 rounded-xl font-semibold">✕</button>
                </div>
              )}
            </div>
          );
        })}

        {laborsHere.length > 0 && <button className={btnPrimary} onClick={saveAttendance}>Save Attendance</button>}
      </div>
    </div>
  );
}

/* ---------- Confirm Receipt ---------- */

function ConfirmReceiptScreen({ db, session, persist, addLog, flash, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const itemName = (id) => db.items.find(i => i.id === id)?.name || id;
  const kitchenName = (id) => (db.kitchens || []).find(k => k.id === id)?.name;
  const pending = db.issues.filter(x => !x.confirmed && myBranches.includes(x.to)).sort((a, b) => tsOf(b) - tsOf(a));
  const TEN_MIN = 10 * 60 * 1000;
  const recent = db.issues.filter(x => x.confirmed && x.confirmedBy === session.id && x.confirmedTs && (Date.now() - x.confirmedTs) < TEN_MIN).sort((a, b) => b.confirmedTs - a.confirmedTs);
  const [openId, setOpenId] = useState(null);
  const [adjustQty, setAdjustQty] = useState("");

  // Removes any previously-logged mismatch for this issue, so re-confirming doesn't double up.
  const clearPriorMismatch = (dbNext, issueId) => {
    dbNext.adjustments = (dbNext.adjustments || []).filter(a => !(a.kind === "received-mismatch" && a.issueId === issueId));
  };

  const confirmOk = (issue, isEdit) => {
    const next = { ...db, issues: db.issues.map(x => x.id === issue.id ? { ...x, confirmed: true, confirmedQty: x.qty, confirmedBy: session.id, confirmedAt: nowStr(), confirmedTs: Date.now() } : x) };
    if (isEdit) clearPriorMismatch(next, issue.id);
    addLog(next, isEdit ? "Receipt Corrected" : "Receipt Confirmed", `${itemName(issue.itemId)} at ${issue.to}${kitchenName(issue.kitchenId) ? " (" + kitchenName(issue.kitchenId) + ")" : ""}: matches, ${issue.qty}`);
    persist(next); setOpenId(null); flash("Confirmed");
  };

  const confirmMismatch = (issue, isEdit) => {
    const actual = Number(adjustQty);
    if (adjustQty === "" || isNaN(actual)) { flash("Enter the quantity you actually received", "error"); return; }
    const diff = actual - issue.qty;
    const next = { ...db, issues: db.issues.map(x => x.id === issue.id ? { ...x, confirmed: true, confirmedQty: actual, confirmedBy: session.id, confirmedAt: nowStr(), confirmedTs: Date.now() } : x) };
    if (isEdit) clearPriorMismatch(next, issue.id);
    if (diff !== 0) {
      const adjRec = { id: uid("adj"), date: todayStr(), branch: issue.to, kitchenId: issue.kitchenId || null, itemId: issue.itemId, qty: diff, kind: "received-mismatch", reason: `Issued ${issue.qty}, received ${actual} (issue from ${issue.from})`, userId: session.id, senderUserId: issue.userId, issuedQty: issue.qty, receivedQty: actual, acknowledged: false, issueId: issue.id };
      next.adjustments = [adjRec, ...(next.adjustments || [])];
    }
    addLog(next, isEdit ? "Receipt Corrected" : "Receipt Mismatch", `${itemName(issue.itemId)} at ${issue.to}: issued ${issue.qty}, received ${actual}`);
    persist(next);
    if (diff !== 0) {
      notifyUsers(
        [...adminRecipients(db), issue.userId],
        "Receipt mismatch",
        `${itemName(issue.itemId)}: issued ${issue.qty}, received ${actual} at ${issue.to}${kitchenName(issue.kitchenId) ? " (" + kitchenName(issue.kitchenId) + ")" : ""} — reported by ${session.name}`
      );
    }
    setOpenId(null); setAdjustQty(""); flash(isEdit ? "Correction saved" : "Mismatch recorded and reported");
  };

  const minutesLeft = (ts) => Math.max(1, Math.ceil((TEN_MIN - (Date.now() - ts)) / 60000));

  const renderCard = (issue, isEdit) => (
    <div key={issue.id} className="bg-white rounded-xl p-3.5 border-2 border-[#EAE4D4] mb-3">
      <div className="flex justify-between items-start mb-2">
        <div>
          <div className="font-semibold text-[#1F2A24]">{itemName(issue.itemId)}</div>
          <div className="text-[11px] text-[#8A9690]">from {issue.from} → {issue.to}{kitchenName(issue.kitchenId) ? " (" + kitchenName(issue.kitchenId) + ")" : ""} · {issue.date}</div>
          {isEdit && <div className="text-[11px] text-[#C98A2C] font-semibold mt-0.5">Confirmed as {issue.confirmedQty} · edit window closes in {minutesLeft(issue.confirmedTs)} min</div>}
        </div>
        <div className="font-mono font-bold text-lg">{issue.qty}</div>
      </div>
      {openId !== issue.id ? (
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => confirmOk(issue, isEdit)} className="bg-[#2B6E63] text-white py-2.5 rounded-xl font-semibold text-sm">✓ Received OK</button>
          <button onClick={() => { setOpenId(issue.id); setAdjustQty(isEdit ? String(issue.confirmedQty) : ""); }} className="bg-[#B33A3A] text-white py-2.5 rounded-xl font-semibold text-sm">✗ Different Amount</button>
        </div>
      ) : (
        <div className="flex gap-2">
          <input className={numCls} type="number" inputMode="decimal" placeholder="Actual qty received" value={adjustQty} onChange={e => setAdjustQty(e.target.value)} />
          <button onClick={() => confirmMismatch(issue, isEdit)} className="bg-[#C98A2C] text-white px-4 rounded-xl font-semibold whitespace-nowrap">Save</button>
          <button onClick={() => setOpenId(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-3 rounded-xl font-semibold">Cancel</button>
        </div>
      )}
    </div>
  );

  return (
    <div>
      <TopBar title="Confirm Receipt" onBack={onDone} />
      <div className="p-5">
        {pending.length === 0 && recent.length === 0 && <div className="text-sm text-[#8A9690]">Nothing waiting on confirmation.</div>}
        {pending.map(issue => renderCard(issue, false))}
        {recent.length > 0 && (
          <React.Fragment>
            <div className="text-xs font-semibold uppercase tracking-wide text-[#8A9690] mt-4 mb-1.5">Just confirmed — tap to fix a mistake</div>
            {recent.map(issue => renderCard(issue, true))}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function ReportsScreen({ db, session, persist, addLog, flash, stockOf, balanceOf, onBack }) {

  const [catFilter, setCatFilter] = useState("");
  const [dateFilter, setDateFilter] = useState(todayStr());
  const [muBranch, setMuBranch] = useState(myBranches[0]);
  const [khItemId, setKhItemId] = useState("");
  const [adjOpenBranch, setAdjOpenBranch] = useState(null);
  const [demandMode, setDemandMode] = useState("current"); // "current" (after last issue) or "first" (before any issue)
  const [adjQty, setAdjQty] = useState("");
  const [adjReason, setAdjReason] = useState("");
  const [ledgerSupplierId, setLedgerSupplierId] = useState(db.suppliers[0]?.id || "");
  const ledgerSupplier = db.suppliers.find(s => s.id === ledgerSupplierId);
  const [editPurchaseId, setEditPurchaseId] = useState(null);
  const [editPurchaseDraft, setEditPurchaseDraft] = useState({});
  const itemName = (id) => db.items.find(i => i.id === id)?.name || id;
  const supplierName = (id) => db.suppliers.find(s => s.id === id)?.name || id;
  const filteredItems = db.items.filter(i => i.name.toLowerCase().includes(q.toLowerCase()) && (!catFilter || i.category === catFilter));

  const startEditPurchase = (p) => { setEditPurchaseId(p.id); setEditPurchaseDraft({ qty: String(p.qty), rate: String(p.rate), paymentMode: p.paymentMode || "credit" }); };
  const saveEditPurchase = () => {
    const qty = Number(editPurchaseDraft.qty) || 0, rate = Number(editPurchaseDraft.rate) || 0;
    if (qty <= 0 || rate <= 0) { flash("Enter valid qty and rate", "error"); return; }
    const next = { ...db, purchases: db.purchases.map(p => p.id === editPurchaseId ? { ...p, qty, rate, amount: qty * rate, paymentMode: editPurchaseDraft.paymentMode } : p) };
    addLog(next, "Admin", `Corrected purchase entry`);
    persist(next); setEditPurchaseId(null); flash("Purchase updated");
  };
  const deletePurchase = (id) => {
    const next = { ...db, purchases: db.purchases.filter(p => p.id !== id) };
    addLog(next, "Admin", `Deleted a purchase entry`);
    persist(next); flash("Purchase deleted");
  };

  const saveDemandAdjustment = (itemId) => {
    const qty = Number(adjQty);

    const rec = { id: uid("dadj"), date: dateFilter || todayStr(), itemId, qty, reason: adjReason.trim(), userId: session.id };
