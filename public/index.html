    persist(next); setAdjOpenBranch(null); setAdjQty(""); setAdjReason(""); flash("Adjustment saved");
  };

  const toggleVoidForSupplier = (supplierId, itemId, date) => {
    const existing = (db.voidedDemandItems || []).find(v => v.supplierId === supplierId && v.itemId === itemId && v.date === date);
    let next;
    if (existing) {
      next = { ...db, voidedDemandItems: db.voidedDemandItems.filter(v => v.id !== existing.id) };
      addLog(next, "Demand Void", `Un-voided ${itemName(itemId)} for ${supplierName(supplierId)}`);
    } else {
      const rec = { id: uid("void"), date, supplierId, itemId, userId: session.id };
      next = { ...db, voidedDemandItems: [rec, ...(db.voidedDemandItems || [])] };
      addLog(next, "Demand Void", `Voided ${itemName(itemId)} for ${supplierName(supplierId)}`);
    }
    persist(next);
  };

  // Opening balance for an item at a branch: the previous day's actual recorded Ending count
  // (physical ground truth) if one was taken; otherwise falls back to the running purchases/issues/adjustments total.
  const openingOf = (branch, itemId, date) => {
    if (!date) return 0;
    const d = new Date(date + "T00:00:00");
    d.setDate(d.getDate() - 1);
    const prevDay = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const prevEnding = db.endings.find(e => e.branch === branch && e.itemId === itemId && e.date === prevDay && !e.kitchenId);
    if (prevEnding) return prevEnding.qty;
    return stockOf(branch, itemId, prevDay);
  };

  // ---- Live Google Sheet (DesiFlow POS) reports ----
  const posSheetId = extractSheetId(db.posSheetLink);
  const [posSalesRows, setPosSalesRows] = useState(null);
  const [posVoidRows, setPosVoidRows] = useState(null);
  const [posLoading, setPosLoading] = useState(false);
  const [posError, setPosError] = useState(null);
  const [expandedVoidItem, setExpandedVoidItem] = useState(null);
  const [lossReasonFor, setLossReasonFor] = useState(null);
  const [editOwnerFor, setEditOwnerFor] = useState(null);
  const [lossReasonText, setLossReasonText] = useState("");

  const loadPosSales = async (force) => {
    if (!posSheetId) { setPosError("No Google Sheet link saved yet — add one in Admin → POS."); return; }
    setPosLoading(true); setPosError(null);
    try { setPosSalesRows(await fetchGoogleSheetTab(posSheetId, "Sales", force)); }
    catch (e) { setPosError("Couldn't load the Sales tab — check the sheet is shared \"Anyone with the link\"."); }
    setPosLoading(false);
  };
  const loadPosVoid = async (force) => {
    if (!posSheetId) { setPosError("No Google Sheet link saved yet — add one in Admin → POS."); return; }
    setPosLoading(true); setPosError(null);
    try { setPosVoidRows(await fetchGoogleSheetTab(posSheetId, "Reduced-Voided", force)); }
    catch (e) { setPosError("Couldn't load the Reduced-Voided tab — check the sheet is shared \"Anyone with the link\"."); }
    setPosLoading(false);
  };
  const refreshPosData = () => {
    if (tab === "POS Void/Less") loadPosVoid(true);
    else loadPosSales(true);
  };
  useEffect(() => {
    if ((tab === "POS Sale" || tab === "POS Item Sale" || tab === "POS vs Stock" || tab === "Owner Ledger") && !posSalesRows && !posLoading) loadPosSales();
    if (tab === "POS Void/Less" && !posVoidRows && !posLoading) loadPosVoid();
  }, [tab]);

  // A row only counts if it has a real, parseable date. The sheet's format changed partway through:
  // older rows had one combined ISO datetime in "Date" (Time blank); newer rows (19 Aug onward) split
  // it into a plain date in "Date" ("2026-08-17") and a 12-hour clock time in "Time" ("2:34:55 pm").
  // Both are tried; rows matching neither are excluded rather than silently defaulting to 1 Jan 1970.
  const validBusinessDate = (row) => {
    const dateRaw = row && row.Date, timeRaw = row && row.Time;
    if (!dateRaw) return null;
    // New format: date-only + separate 12-hour time.
    let d = parseDateTimeParts(dateRaw, timeRaw);
    if (d && !isNaN(d.getTime()) && d.getFullYear() >= 2020) return businessDateOf(d);
    // Old format: one combined ISO datetime already in "Date".
    d = new Date(dateRaw);
    if (!isNaN(d.getTime()) && d.getFullYear() >= 2020) return businessDateOf(d);
    return null;
  };
  const posSalesUndated = (posSalesRows || []).filter(r => !validBusinessDate(r)).length;
  const posSalesFiltered = (posSalesRows || []).filter(r => {
    const bd = validBusinessDate(r);
    if (!bd) return false;
    if (dateFilter && bd !== dateFilter) return false;
    const sfBranch = mapPosBranch(r.Branch);
    if (!myBranches.includes(sfBranch) && r.Branch !== "ALL") return false;
    return true;
  });
  const posVoidUndated = (posVoidRows || []).filter(r => !validBusinessDate(r)).length;
  const posVoidFiltered = (posVoidRows || []).filter(r => {
    const bd = validBusinessDate(r);
    if (!bd) return false;
    if (dateFilter && bd !== dateFilter) return false;
    const sfBranch = mapPosBranch(r.Branch);
    if (!myBranches.includes(sfBranch) && r.Branch !== "ALL") return false;
    return true;
  });
  const posItemQtySold = useMemo(() => {
    const totals = {};
    posSalesFiltered.forEach(r => {
      parseSoldItemsText(r.Items).forEach(({ name, qty }) => { totals[name] = (totals[name] || 0) + qty; });
    });
    return totals;
  }, [posSalesFiltered.length, dateFilter]);

  // Maps a raw POS "Payment Method" value to one of our 4 owner-ledger modes.
  const paymentModeOf = (raw) => {
    const s = String(raw || "").toLowerCase();
    if (s.includes("cash")) return "cash";
    if (s.includes("easypaisa")) return "easypaisa";
    if (s.includes("jazzcash") || s.includes("jazz cash")) return "jazzcash";
    if (s.includes("card") || s.includes("bank")) return "bank";
    return "other";
  };
  const ownerFor = (invoiceNo, mode) => {
    const override = (db.ownerOverrides || {})[invoiceNo];
    if (override !== undefined) return override || null;
    return (db.ownerModeDefaults || {})[mode] || null;
  };
  const setOwnerOverride = (invoiceNo, ownerId) => {
    const next = { ...db, ownerOverrides: { ...(db.ownerOverrides || {}), [invoiceNo]: ownerId || null } };
    persist(next);
  };

  const saveLossReason = (key, branch, itemId) => {
    if (!lossReasonText.trim()) { flash("Enter a reason", "error"); return; }
    const rec = { id: uid("plr"), date: dateFilter || todayStr(), branch, itemId, reason: lossReasonText.trim(), userId: session.id };
    const next = { ...db, posLossReasons: [rec, ...(db.posLossReasons || [])] };
    addLog(next, "POS Loss Reason", `${db.items.find(i => i.id === itemId)?.name} at ${branch}: ${lossReasonText.trim()}`);
    persist(next); setLossReasonFor(null); setLossReasonText(""); flash("Reason recorded");
  };

  return (
    <div>
      <TopBar title="Reports" onBack={onBack} />
      <div className="px-4 pt-3">
        <div className="flex gap-2 overflow-x-auto pb-2 -mx-1 px-1">
          {myTabs.map(t => (
            <button key={t} onClick={() => setTab(t)} className={`whitespace-nowrap px-3.5 py-2 rounded-full text-sm font-semibold border-2 ${tab === t ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white text-[#5C6B62] border-[#EAE4D4]"}`}>{t}</button>
          ))}
        </div>
      </div>
      <div className="px-4 mt-2 mb-3 flex gap-2 flex-wrap">
        <input className="flex-1 min-w-[110px] bg-white border-2 border-[#EAE4D4] rounded-xl pl-4 pr-3 py-2.5 text-sm" placeholder="Search item…" value={q} onChange={e => setQ(e.target.value)} />
        {(tab === "Stock Balance" || tab === "Demand vs Issue" || tab === "Ending" || tab === "By Category" || tab === "Kitchens" || tab === "Demand" || tab === "Material Used") && (
          <select className="bg-white border-2 border-[#EAE4D4] rounded-xl px-2.5 py-2.5 text-sm font-medium max-w-[130px]" value={catFilter} onChange={e => setCatFilter(e.target.value)}>
            <option value="">All categories</option>
            {db.categories.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        )}
        <input type="date" className="bg-white border-2 border-[#EAE4D4] rounded-xl px-2.5 py-2.5 text-sm font-medium" value={dateFilter} onChange={e => setDateFilter(e.target.value)} />
        {dateFilter && (
          <button onClick={() => setDateFilter("")} className="text-xs font-semibold text-[#5C6B62] bg-[#F0ECE0] px-3 rounded-xl">All dates</button>
        )}
        {(tab === "Demand" || tab === "Kitchens" || tab === "Supplier Demand" || tab === "Material Used") && (
          <div className="flex gap-1 bg-[#EAE4D4] rounded-xl p-1">
            <button onClick={() => setDemandMode("current")} className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold ${demandMode === "current" ? "bg-[#1F2A24] text-white" : "text-[#5C6B62]"}`}>After Issue</button>
            <button onClick={() => setDemandMode("first")} className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold ${demandMode === "first" ? "bg-[#1F2A24] text-white" : "text-[#5C6B62]"}`}>1st Demand</button>
          </div>
        )}
      </div>
      <div className="px-4 pb-8">
        {tab === "Stock Balance" && (
          <ReportTable title={dateFilter ? `Stock Balance as of ${dateFilter}` : "Stock Balance by Branch"} onExport={() => downloadCSV("stock-balance.csv", toCSV(filteredItems, [{ label: "Item", get: i => i.name }, { label: "Category", get: i => i.category }, ...myBranches.map(b => ({ label: b, get: i => stockOf(b, i.id, dateFilter) }))]))}>
            <table className="w-full text-sm">
              <thead><tr className="text-left text-[#7A8880]"><th className="py-1.5">Item</th>{myBranches.map(b => <th key={b} className="text-right py-1.5">{b}</th>)}</tr></thead>
              <tbody>
                {filteredItems.map(i => (
                  <tr key={i.id} className="border-t border-[#EFEBDF]">
                    <td className="py-2 font-medium">{i.name}</td>
                    {myBranches.map(b => { const v = stockOf(b, i.id, dateFilter); return <td key={b} className={`text-right py-2 font-mono ${v < 0 ? "text-[#B33A3A]" : v <= 5 && v >= 0 ? "text-[#B3562C] font-bold" : ""}`}>{v}</td>; })}
                  </tr>
                ))}
              </tbody>
            </table>
            {dateFilter && <div className="text-[11px] text-[#8A9690] mt-3">Includes all purchases, issues, and adjustments up to and including this date.</div>}
          </ReportTable>
        )}
        {tab === "Material Used" && (() => {
          const eff = dateFilter || todayStr();
          const demEff = dateFilter || demandDateStr();
          // Build the selector list: Store (no kitchens) as a plain branch entry;
          // branches with kitchens get an "All kitchens" combined entry plus one per kitchen.
          const options = [];
          myBranches.forEach(b => {
            const ks = kitchensOf(db, b);
            if (ks.length === 0) { options.push({ value: `b:${b}`, label: b, branch: b, kitchenId: null }); return; }
            options.push({ value: `ba:${b}`, label: `${b} — All Kitchens`, branch: b, kitchenId: null });
            ks.forEach(k => options.push({ value: `k:${k.id}`, label: `${k.name} (${b})`, branch: b, kitchenId: k.id }));
          });
          const current = options.find(o => o.value === muBranch) || options[0];
          const branch = current?.branch, kitchenId = current?.kitchenId;
          const mode = demandMode === "first" ? "firstDemand" : "currentDemand";

          const demandOf = (itemId) => kitchenId
            ? demandCycle(db, itemId, branch, kitchenId, demEff)[mode]
            : demandCycle(db, itemId, branch, null, demEff)[mode] + kitchensOf(db, branch).reduce((a, k) => a + demandCycle(db, itemId, branch, k.id, demEff)[mode], 0);
          const receivedOf = (itemId) => db.issues.filter(x => x.itemId === itemId && x.date === eff && x.to === branch && (kitchenId ? x.kitchenId === kitchenId : true)).reduce((a, x) => a + x.qty, 0) + (!kitchenId && branch === "Store" ? db.purchases.filter(p => p.itemId === itemId && p.date === eff).reduce((a, p) => a + p.qty, 0) : 0);
          const endingOf = (itemId) => db.endings.find(x => x.itemId === itemId && x.date === eff && x.branch === branch && (kitchenId ? x.kitchenId === kitchenId : true));

          const rowsData = filteredItems.map(i => {
            const demand = demandOf(i.id);
            const received = receivedOf(i.id);
            const e = endingOf(i.id);
            const opening = kitchenId ? null : openingOf(branch, i.id, eff);
            const used = e ? (opening || 0) + received - e.qty : null;
            return { item: i, demand, received, ending: e ? e.qty : null, used };
          }).filter(r => r.demand !== 0 || r.received !== 0 || r.ending !== null);

          return (
            <ReportTable
              title={`Material Used — ${current?.label} — ${eff}`}
              onExport={() => downloadCSV("material-used.csv", toCSV(rowsData, [
                { label: "Item", get: r => r.item.name }, { label: "Demand", get: r => r.demand },
                { label: "Received", get: r => r.received }, { label: "Ending", get: r => r.ending ?? "" },
                { label: "Used", get: r => r.used ?? "" },
              ]))}
            >
              <div className="mb-3">
                <select className="w-full bg-white border-2 border-[#D8D2C2] rounded-xl px-3 py-2.5 text-sm font-medium" value={muBranch} onChange={e => setMuBranch(e.target.value)}>
                  {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>
              <table className="w-full text-sm">
                <thead><tr className="text-left text-[#7A8880]"><th className="py-1.5">Item</th><th className="text-right py-1.5">Demand</th><th className="text-right py-1.5">Received</th><th className="text-right py-1.5">Ending</th><th className="text-right py-1.5 font-bold">Used</th></tr></thead>
                <tbody>
                  {rowsData.map(r => (
                    <tr key={r.item.id} className="border-t border-[#EFEBDF]">
                      <td className="py-2 font-medium">{r.item.name}{r.item.nameUr && <span className="text-[#8A9690]"> — {r.item.nameUr}</span>}</td>
                      <td className="text-right py-2 font-mono">{r.demand}</td>
                      <td className="text-right py-2 font-mono">{r.received}</td>
                      <td className="text-right py-2 font-mono">{r.ending ?? "–"}</td>
                      <td className="text-right py-2 font-mono font-bold">{r.used !== null ? r.used : "–"}</td>
                    </tr>
                  ))}
                  {rowsData.length === 0 && <tr><td colSpan={5} className="py-3 text-[#8A9690]">No entries.</td></tr>}
                </tbody>
              </table>
              <div className="text-[11px] text-[#8A9690] mt-3">Used = Opening (yesterday's ending) + Received − Ending. Opening isn't tracked per-kitchen, so it's blank when a single kitchen is selected.</div>
            </ReportTable>
          );
        })()}
        {tab === "Purchases" && (() => {
          // Credit purchases arrive at Store; only someone with Store access should see them.
          // Cash purchases are tagged with a branch directly.
          const purchasesVisible = db.purchases.filter(p => (p.paymentMode === "cash" ? myBranches.includes(p.branch || "Store") : myBranches.includes("Store")));
          return (
          <ReportTable title="Purchase History" onExport={() => downloadCSV("purchases.csv", toCSV(purchasesVisible, [{ label: "Date", get: p => p.date }, { label: "Item", get: p => itemName(p.itemId) }, { label: "Supplier", get: p => supplierName(p.supplierId) }, { label: "Qty", get: p => p.qty }, { label: "Rate", get: p => p.rate }, { label: "Amount", get: p => p.amount }, { label: "Payment", get: p => p.paymentMode || "credit" }]))}>
            {purchasesVisible.filter(p => itemName(p.itemId).toLowerCase().includes(q.toLowerCase()) && (!dateFilter || p.date === dateFilter)).slice(0, 200).map(p => (
              editPurchaseId === p.id ? (
                <div key={p.id} className="bg-white rounded-xl p-3 mb-2 border-2 border-[#C98A2C]">
                  <div className="text-sm font-semibold mb-2">{itemName(p.itemId)} · {supplierName(p.supplierId)}</div>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <input className={numCls} type="number" placeholder="Qty" value={editPurchaseDraft.qty} onChange={e => setEditPurchaseDraft(d => ({ ...d, qty: e.target.value }))} />
                    <input className={numCls} type="number" placeholder="Rate" value={editPurchaseDraft.rate} onChange={e => setEditPurchaseDraft(d => ({ ...d, rate: e.target.value }))} />
                  </div>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <button onClick={() => setEditPurchaseDraft(d => ({ ...d, paymentMode: "credit" }))} className={`py-2 rounded-lg text-xs font-semibold border-2 ${editPurchaseDraft.paymentMode === "credit" ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-[#F7F5F0] border-[#D8D2C2] text-[#5C6B62]"}`}>Credit</button>
                    <button onClick={() => setEditPurchaseDraft(d => ({ ...d, paymentMode: "cash" }))} className={`py-2 rounded-lg text-xs font-semibold border-2 ${editPurchaseDraft.paymentMode === "cash" ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-[#F7F5F0] border-[#D8D2C2] text-[#5C6B62]"}`}>Cash</button>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={saveEditPurchase} className="bg-[#2B6E63] text-white px-4 py-2 rounded-xl font-semibold text-sm">Save</button>
                    <button onClick={() => setEditPurchaseId(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-4 py-2 rounded-xl font-semibold text-sm">Cancel</button>
                    <button onClick={() => deletePurchase(p.id)} className="ml-auto text-[#B33A3A] text-sm font-semibold">Delete</button>
                  </div>
                </div>
              ) : (
                <div key={p.id} className="bg-white rounded-xl p-3 mb-2 border border-[#EAE4D4] flex justify-between items-center">
                  <div><div className="font-semibold">{itemName(p.itemId)}</div><div className="text-xs text-[#8A9690]">{supplierName(p.supplierId)} · {p.date} · {p.paymentMode === "cash" ? "Cash" : "Credit"}</div></div>
                  <div className="flex items-center gap-3">
                    <div className="text-right"><div className="font-mono font-bold">{money(p.amount)}</div><div className="text-xs text-[#8A9690]">{p.qty} × {p.rate}</div></div>
                    {(session.permissions || []).includes("admin") && <button onClick={() => startEditPurchase(p)} className="text-[#5C6B62]">✎</button>}
                  </div>
                </div>
              )
            ))}
          </ReportTable>
          );
        })()}
        {tab === "Cash Material" && (() => {
          const cashPurchases = db.purchases.filter(p => p.paymentMode === "cash" && itemName(p.itemId).toLowerCase().includes(q.toLowerCase()) && (!dateFilter || p.date === dateFilter));
          const byBranch = myBranches.map(b => ({ branch: b, list: cashPurchases.filter(p => (p.branch || "Store") === b) })).filter(g => g.list.length > 0);
          const grandTotal = cashPurchases.reduce((a, p) => a + p.amount, 0);
          return (
            <ReportTable
              title={dateFilter ? `Cash Material — ${dateFilter}` : "Cash Material — All Dates"}
              onExport={() => downloadCSV("cash-material.csv", toCSV(cashPurchases, [
                { label: "Date", get: p => p.date }, { label: "Branch", get: p => p.branch || "Store" }, { label: "Item", get: p => itemName(p.itemId) },
                { label: "Qty", get: p => p.qty }, { label: "Rate", get: p => p.rate }, { label: "Amount", get: p => p.amount },
              ]))}
            >
              {byBranch.length === 0 && <div className="text-sm text-[#8A9690]">No cash purchases{dateFilter ? " on this date" : ""}.</div>}
              {byBranch.map(g => (
                <div key={g.branch} className="mb-3 last:mb-0">
                  <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">{g.branch}</div>
                  {g.list.map(p => (
                    <div key={p.id} className="flex justify-between items-center py-1.5 border-t border-[#EFEBDF] first:border-t-0">
                      <div>
                        <div className="text-sm font-medium">{itemName(p.itemId)}</div>
                        <div className="text-[11px] text-[#8A9690]">{p.date} · {p.qty} × {p.rate}</div>
                      </div>
                      <div className="font-mono font-bold text-sm">{money(p.amount)}</div>
                    </div>
                  ))}
                </div>
              ))}
              {byBranch.length > 0 && (
                <div className="flex justify-between pt-2 mt-1 border-t-2 border-[#1F2A24] font-bold text-sm">
                  <span>Grand Total</span>
                  <span className="font-mono">{money(grandTotal)}</span>
                </div>
              )}
            </ReportTable>
          );
        })()}
        {tab === "Supplier Ledger" && (
          <React.Fragment>
            <select className={selCls + " mb-3"} value={ledgerSupplierId} onChange={e => setLedgerSupplierId(e.target.value)}>
              {db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {ledgerSupplier && (() => {
              const purchaseTx = db.purchases.filter(p => p.supplierId === ledgerSupplierId && p.paymentMode !== "cash").map(p => ({
                date: p.date, type: "Purchase",
                desc: `${itemName(p.itemId)} — ${p.qty} × ${p.rate}`,
                amount: p.amount,
              }));
              const paymentTx = (db.payments || []).filter(x => x.supplierId === ledgerSupplierId).map(x => ({
                date: x.date, type: "Payment", desc: x.note || "Payment", amount: -x.amount,
              }));
              const allTx = [...purchaseTx, ...paymentTx]
                .filter(t => !dateFilter || t.date === dateFilter)
                .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
              let running = Number(ledgerSupplier.openingBalance || 0);
              const openingRow = running !== 0 && !dateFilter ? [{ date: "—", type: "Opening", desc: "Opening balance", amount: running, balance: running }] : [];
              const withBalance = [...openingRow, ...allTx.map(t => { running += t.amount; return { ...t, balance: running }; })];
              const totalPurchases = db.purchases.filter(p => p.supplierId === ledgerSupplierId && p.paymentMode !== "cash").reduce((a, p) => a + p.amount, 0);
              const totalPaid = (db.payments || []).filter(x => x.supplierId === ledgerSupplierId).reduce((a, x) => a + x.amount, 0);
              const bal = balanceOf(ledgerSupplierId);
              return (
                <ReportTable
                  title={ledgerSupplier.name}
                  onExport={() => downloadCSV(`ledger-${ledgerSupplier.name}.csv`, toCSV(withBalance, [
                    { label: "Date", get: t => t.date }, { label: "Type", get: t => t.type },
                    { label: "Detail", get: t => t.desc }, { label: "Amount", get: t => t.amount }, { label: "Running Balance", get: t => t.balance },
                  ]))}
                >
                  <div className="grid grid-cols-3 gap-2 mb-3">
                    <div className="bg-[#F7F5F0] rounded-lg p-2.5 text-center">
                      <div className="text-[10px] uppercase text-[#8A9690] font-semibold">Purchased</div>
                      <div className="font-mono font-bold text-sm">{money(totalPurchases)}</div>
                    </div>
                    <div className="bg-[#F7F5F0] rounded-lg p-2.5 text-center">
                      <div className="text-[10px] uppercase text-[#8A9690] font-semibold">Paid</div>
                      <div className="font-mono font-bold text-sm">{money(totalPaid)}</div>
                    </div>
                    <div className={`rounded-lg p-2.5 text-center ${bal > 0 ? "bg-[#FBEAEA]" : "bg-[#EAF3F1]"}`}>
                      <div className="text-[10px] uppercase text-[#8A9690] font-semibold">Balance</div>
                      <div className={`font-mono font-bold text-sm ${bal > 0 ? "text-[#B33A3A]" : "text-[#2B6E63]"}`}>{money(bal)}</div>

        <button onClick={onExport} className="text-xs font-semibold text-[#2B6E63] bg-[#2B6E63]/10 px-3 py-1.5 rounded-full">⬇ CSV</button>
      </div>
      <div className="bg-white rounded-xl p-3 border border-[#EAE4D4] overflow-x-auto">{children}</div>
    </div>
  );
}

/* ---------- Admin ---------- */

function AdminScreen({ db, session, persist, addLog, flash, onBack }) {
  const [tab, setTab] = useState("Items");
  const [itemQ, setItemQ] = useState("");
  const [newItemName, setNewItemName] = useState("");
  const [newItemNameUr, setNewItemNameUr] = useState("");
  const [newItemCat, setNewItemCat] = useState(db.categories[0]);
  const [newItemUnit, setNewItemUnit] = useState("kg");
  const [newSupplierName, setNewSupplierName] = useState("");
  const [newSupplierItems, setNewSupplierItems] = useState([]);
  const [newSupplierOpening, setNewSupplierOpening] = useState("");
  const [newSupplierOpeningDate, setNewSupplierOpeningDate] = useState(todayStr());
  const [newUserName, setNewUserName] = useState("");
  const [newUserPin, setNewUserPin] = useState("");
  const [newUserPerms, setNewUserPerms] = useState(["purchase"]);
  const [newUserBranches, setNewUserBranches] = useState([...BRANCHES]);
  const [newUserReportTabs, setNewUserReportTabs] = useState([...REPORT_TABS]);
  const [newUserKitchens, setNewUserKitchens] = useState([]);
  const [newUserItemIds, setNewUserItemIds] = useState([]);
  const [newUserNotifications, setNewUserNotifications] = useState(true);
  const [newUserBackdate, setNewUserBackdate] = useState(false);
  const [newKitchenName, setNewKitchenName] = useState("");
  const [newKitchenBranch, setNewKitchenBranch] = useState(BRANCHES.find(b => b !== "Store") || BRANCHES[0]);
  const [newKitchenItems, setNewKitchenItems] = useState([]);
  const [editKitchenId, setEditKitchenId] = useState(null);
  const [editKitchenDraft, setEditKitchenDraft] = useState({});
  const [recipeName, setRecipeName] = useState("");
  const [recipeBranch, setRecipeBranch] = useState("");
  const [recipeConsumes, setRecipeConsumes] = useState([]); // [{itemId, qty}]
  const [recipeProduces, setRecipeProduces] = useState([]);
  const [recipeAddItemId, setRecipeAddItemId] = useState("");
  const [recipeAddQty, setRecipeAddQty] = useState("");
  const [recipeAddItemId2, setRecipeAddItemId2] = useState("");
  const [recipeAddQty2, setRecipeAddQty2] = useState("");
  const [editAddItemId, setEditAddItemId] = useState("");
  const [editAddQty, setEditAddQty] = useState("");
  const [editAddItemId2, setEditAddItemId2] = useState("");
  const [editAddQty2, setEditAddQty2] = useState("");
  const [editRecipeId, setEditRecipeId] = useState(null);
  const [editRecipeDraft, setEditRecipeDraft] = useState(null);
  const [ratesSupplierId, setRatesSupplierId] = useState(db.suppliers[0]?.id || "");
  const [editItemId, setEditItemId] = useState(null);
  const [editItemDraft, setEditItemDraft] = useState({});
  const [editSupplierId, setEditSupplierId] = useState(null);
  const [editSupplierDraft, setEditSupplierDraft] = useState({});

  const addItem = () => { if (!newItemName.trim()) return; const rec = { id: uid("i"), name: newItemName.trim(), nameUr: newItemNameUr.trim(), category: newItemCat, unit: newItemUnit || "unit" }; const next = { ...db, items: [...db.items, rec] }; addLog(next, "Admin", `Added item ${rec.name}`); persist(next); setNewItemName(""); setNewItemNameUr(""); flash("Item added"); };
  const delItem = (id) => persist({ ...db, items: db.items.filter(i => i.id !== id) });
  const startEditItem = (i) => { setEditItemId(i.id); setEditItemDraft({ name: i.name, nameUr: i.nameUr || "", category: i.category, unit: i.unit }); };
  const saveEditItem = () => {
    const next = { ...db, items: db.items.map(i => i.id === editItemId ? { ...i, ...editItemDraft } : i) };
    addLog(next, "Admin", `Edited item ${editItemDraft.name}`);
    persist(next); setEditItemId(null); flash("Item updated");
  };

  const addSupplier = () => { if (!newSupplierName.trim()) return; const rec = { id: uid("s"), name: newSupplierName.trim(), itemIds: newSupplierItems, openingBalance: Number(newSupplierOpening) || 0, openingDate: newSupplierOpeningDate }; const next = { ...db, suppliers: [...db.suppliers, rec] }; addLog(next, "Admin", `Added supplier ${rec.name}`); persist(next); setNewSupplierName(""); setNewSupplierItems([]); setNewSupplierOpening(""); setNewSupplierOpeningDate(todayStr()); flash("Supplier added"); };
  const delSupplier = (id) => persist({ ...db, suppliers: db.suppliers.filter(s => s.id !== id) });
  const toggleSupplierItem = (id) => setNewSupplierItems(v => v.includes(id) ? v.filter(x => x !== id) : [...v, id]);
  const startEditSupplier = (s) => { setEditSupplierId(s.id); setEditSupplierDraft({ name: s.name, itemIds: [...s.itemIds], openingBalance: s.openingBalance || 0, openingDate: s.openingDate || todayStr() }); };
  const toggleEditSupplierItem = (id) => setEditSupplierDraft(d => ({ ...d, itemIds: d.itemIds.includes(id) ? d.itemIds.filter(x => x !== id) : [...d.itemIds, id] }));
  const saveEditSupplier = () => {
    const next = { ...db, suppliers: db.suppliers.map(s => s.id === editSupplierId ? { ...s, ...editSupplierDraft } : s) };
    addLog(next, "Admin", `Edited supplier ${editSupplierDraft.name}`);
    persist(next); setEditSupplierId(null); flash("Supplier updated");
  };

  const addUser = () => { if (!newUserName.trim() || newUserPin.length < 4) { flash("Name + 4-6 digit PIN required", "error"); return; } const rec = { id: uid("u"), name: newUserName.trim(), pin: newUserPin, permissions: newUserPerms, branches: newUserBranches, reportTabs: newUserReportTabs, kitchens: newUserKitchens, itemIds: newUserItemIds, notifications: newUserNotifications, canBackdate: newUserBackdate }; const next = { ...db, users: [...db.users, rec] }; addLog(next, "Admin", `Added user ${rec.name}`); persist(next); setNewUserName(""); setNewUserPin(""); setNewUserPerms(["purchase"]); setNewUserBranches([...BRANCHES]); setNewUserReportTabs([...REPORT_TABS]); setNewUserKitchens([]); setNewUserItemIds([]); setNewUserNotifications(true); setNewUserBackdate(false); flash("User added"); };
  const delUser = (id) => persist({ ...db, users: db.users.filter(u => u.id !== id) });
  const toggleUserPerm = (userId, perm) => {
    const next = { ...db, users: db.users.map(u => {
      if (u.id !== userId) return u;
      const has = (u.permissions || []).includes(perm);
      return { ...u, permissions: has ? u.permissions.filter(p => p !== perm) : [...(u.permissions || []), perm] };
    }) };
    persist(next);
  };
  const toggleUserBranch = (userId, branch) => {
    const next = { ...db, users: db.users.map(u => {
      if (u.id !== userId) return u;
      const has = (u.branches || []).includes(branch);
      return { ...u, branches: has ? u.branches.filter(b => b !== branch) : [...(u.branches || []), branch] };
    }) };
    persist(next);
  };
  const toggleUserReportTab = (userId, t) => {
    const next = { ...db, users: db.users.map(u => {
      if (u.id !== userId) return u;
      const cur = (u.reportTabs && u.reportTabs.length) ? u.reportTabs : [...REPORT_TABS];
      const has = cur.includes(t);
      return { ...u, reportTabs: has ? cur.filter(x => x !== t) : [...cur, t] };
    }) };
    persist(next);
  };
  const toggleUserKitchen = (userId, kitchenId) => {
    const next = { ...db, users: db.users.map(u => {
      if (u.id !== userId) return u;
      const has = (u.kitchens || []).includes(kitchenId);
      return { ...u, kitchens: has ? u.kitchens.filter(x => x !== kitchenId) : [...(u.kitchens || []), kitchenId] };
    }) };
    persist(next);
  };
  const toggleUserNotifications = (userId) => {
    const next = { ...db, users: db.users.map(u => u.id === userId ? { ...u, notifications: u.notifications === false } : u) };
    persist(next);
  };
  const toggleUserBackdate = (userId) => {
    const next = { ...db, users: db.users.map(u => u.id === userId ? { ...u, canBackdate: !u.canBackdate } : u) };
    persist(next);
  };

  const addKitchen = () => {
    if (!newKitchenName.trim()) return;
    const rec = { id: uid("k"), name: newKitchenName.trim(), branch: newKitchenBranch, itemIds: newKitchenItems };
    const next = { ...db, kitchens: [...(db.kitchens || []), rec] };
    addLog(next, "Admin", `Added kitchen ${rec.name} (${rec.branch})`);
    persist(next); setNewKitchenName(""); setNewKitchenItems([]); flash("Kitchen added");
  };
  const delKitchen = (id) => persist({ ...db, kitchens: (db.kitchens || []).filter(k => k.id !== id) });
  const startEditKitchen = (k) => { setEditKitchenId(k.id); setEditKitchenDraft({ name: k.name, branch: k.branch, itemIds: k.itemIds || [] }); };
  const toggleEditKitchenItem = (id) => setEditKitchenDraft(d => ({ ...d, itemIds: (d.itemIds || []).includes(id) ? d.itemIds.filter(x => x !== id) : [...(d.itemIds || []), id] }));
  const saveEditKitchen = () => {
    const next = { ...db, kitchens: (db.kitchens || []).map(k => k.id === editKitchenId ? { ...k, ...editKitchenDraft } : k) };
    addLog(next, "Admin", `Edited kitchen ${editKitchenDraft.name}`);
    persist(next); setEditKitchenId(null); flash("Kitchen updated");
  };

  const addToRecipeList = (setList, list, itemId, qty, clearFns) => {
    if (!itemId || !qty || Number(qty) <= 0) { flash("Pick an item and a quantity", "error"); return; }
    if (list.some(x => x.itemId === itemId)) { flash("Already in the list", "error"); return; }
    setList([...list, { itemId, qty: Number(qty) }]);
    clearFns();
  };
  const addRecipe = () => {
    if (!recipeName.trim() || recipeConsumes.length === 0 || recipeProduces.length === 0) { flash("Name, at least one used item and one made item required", "error"); return; }
    const rec = { id: uid("rcp"), name: recipeName.trim(), branch: recipeBranch || null, consumes: recipeConsumes, produces: recipeProduces };
    const next = { ...db, recipes: [...(db.recipes || []), rec] };
    addLog(next, "Admin", `Added recipe ${rec.name}`);
    persist(next); setRecipeName(""); setRecipeBranch(""); setRecipeConsumes([]); setRecipeProduces([]); flash("Recipe added");
  };
  const delRecipe = (id) => persist({ ...db, recipes: (db.recipes || []).filter(r => r.id !== id) });
  const startEditRecipe = (r) => { setEditRecipeId(r.id); setEditRecipeDraft({ name: r.name, branch: r.branch || "", consumes: [...r.consumes], produces: [...r.produces] }); };
  const saveEditRecipe = () => {
    if (!editRecipeDraft.name.trim() || editRecipeDraft.consumes.length === 0 || editRecipeDraft.produces.length === 0) { flash("Name, at least one used item and one made item required", "error"); return; }
    const next = { ...db, recipes: (db.recipes || []).map(r => r.id === editRecipeId ? { ...r, name: editRecipeDraft.name.trim(), branch: editRecipeDraft.branch || null, consumes: editRecipeDraft.consumes, produces: editRecipeDraft.produces } : r) };
    addLog(next, "Admin", `Edited recipe ${editRecipeDraft.name}`);
    persist(next); setEditRecipeId(null); setEditRecipeDraft(null); flash("Recipe updated");
  };

  const ratesSupplier = db.suppliers.find(s => s.id === ratesSupplierId);
  const setPricing = (itemId, patch) => {
    const cur = (db.pricing && db.pricing[ratesSupplierId] && db.pricing[ratesSupplierId][itemId]) || { mode: "manual" };
    const next = { ...db, pricing: { ...db.pricing, [ratesSupplierId]: { ...(db.pricing[ratesSupplierId] || {}), [itemId]: { ...cur, ...patch } } } };
    persist(next);
  };

  const [openingBranch, setOpeningBranch] = useState(BRANCHES[0]);
  const [openingKitchenId, setOpeningKitchenId] = useState("");
  const openingKitchenOptions = kitchensOf(db, openingBranch);
  const openingActiveKitchen = openingKitchenOptions.find(k => k.id === openingKitchenId);
  const openingKitchenItemIds = openingActiveKitchen && openingActiveKitchen.itemIds && openingActiveKitchen.itemIds.length ? openingActiveKitchen.itemIds : null;
  const [openingCat, setOpeningCat] = useState(db.categories[0]);
  const [openingValues, setOpeningValues] = useState(() => ({ ...(db.openingStock?.[openingBranch] || {}) }));
  const [openingStockDate, setOpeningStockDate] = useState(db.openingStockDate?.[openingBranch] || todayStr());
  useEffect(() => { setOpeningValues({ ...(db.openingStock?.[openingBranch] || {}) }); setOpeningKitchenId(""); setOpeningStockDate(db.openingStockDate?.[openingBranch] || todayStr()); }, [openingBranch]);
  const saveOpeningStock = () => {
    const cleaned = { ...(db.openingStock?.[openingBranch] || {}) };
    Object.entries(openingValues).forEach(([id, v]) => {
      if (v === "" || v === undefined || Number(v) === 0) delete cleaned[id];
      else cleaned[id] = Number(v);
    });
    const next = { ...db, openingStock: { ...db.openingStock, [openingBranch]: cleaned }, openingStockDate: { ...db.openingStockDate, [openingBranch]: openingStockDate } };
    addLog(next, "Admin", `Set opening stock for ${openingBranch}${openingActiveKitchen ? " (" + openingActiveKitchen.name + " items)" : ""} as of ${openingStockDate}`);
    persist(next); flash("Opening stock saved");
  };
  const uploadOpeningStock = (rows) => {
    let matched = 0;
    const cleaned = { ...(db.openingStock?.[openingBranch] || {}) };
    rows.forEach(row => {
      const item = db.items.find(i => i.name.toLowerCase() === row.name.toLowerCase() && (!openingKitchenItemIds || openingKitchenItemIds.includes(i.id)));
      if (item) { cleaned[item.id] = row.value; matched++; }
    });
    const unmatched = rows.length - matched;
    const next = { ...db, openingStock: { ...db.openingStock, [openingBranch]: cleaned }, openingStockDate: { ...db.openingStockDate, [openingBranch]: openingStockDate } };
    addLog(next, "Admin", `Uploaded opening stock for ${openingBranch} as of ${openingStockDate}: ${matched} matched, ${unmatched} not found`);
    persist(next);
    setOpeningValues(cleaned);
    flash(`Updated ${matched} item(s)${unmatched ? `, ${unmatched} name(s) not found` : ""}`);
  };

  const [newLaborName, setNewLaborName] = useState("");
  const [newLaborNic, setNewLaborNic] = useState("");
  const [newLaborPhone, setNewLaborPhone] = useState("");
  const [newLaborWage, setNewLaborWage] = useState("");
  const [newLaborBranch, setNewLaborBranch] = useState("");
  const [newLaborOpening, setNewLaborOpening] = useState("");
  const [newLaborOpeningDate, setNewLaborOpeningDate] = useState(todayStr());
  const [editLaborId, setEditLaborId] = useState(null);
  const [editLaborDraft, setEditLaborDraft] = useState({});
  const [laborUploadBranch, setLaborUploadBranch] = useState("");
  const [posUploadBranch, setPosUploadBranch] = useState(BRANCHES[0]);
  const [posUploadDate, setPosUploadDate] = useState(todayStr());
  const [posSheetLink, setPosSheetLink] = useState(db.posSheetLink || "");
  const savePosSheetLink = () => {
    const next = { ...db, posSheetLink: posSheetLink.trim() };
    addLog(next, "Admin", "Updated POS Google Sheet link");
    persist(next); flash("Link saved");
  };

  const [newOwnerName, setNewOwnerName] = useState("");
  const addOwner = () => {
    if (!newOwnerName.trim()) return;
    const rec = { id: uid("own"), name: newOwnerName.trim() };
    const next = { ...db, owners: [...(db.owners || []), rec] };
    addLog(next, "Admin", `Added owner ${rec.name}`);
    persist(next); setNewOwnerName(""); flash("Owner added");
  };
  const delOwner = (id) => {
    const next = { ...db, owners: (db.owners || []).filter(o => o.id !== id) };
    persist(next);
  };
  const setOwnerModeDefault = (mode, ownerId) => {
    const next = { ...db, ownerModeDefaults: { ...(db.ownerModeDefaults || {}), [mode]: ownerId || null } };
    addLog(next, "Admin", `Set default owner for ${mode} to ${db.owners.find(o => o.id === ownerId)?.name || "Branch (none)"}`);
    persist(next); flash("Default updated");
  };

  const generatePosApiKey = () => {
    const key = "sf_" + Array.from({ length: 32 }, () => "abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random() * 36)]).join("");
    const next = { ...db, posApiKey: key };
    addLog(next, "Admin", "Generated new POS API key");
    persist(next); flash("New API key generated");
  };

  const uploadPosSales = (rows) => {
    const saleRecs = [];
    const adjRecs = [];
    let matchedRecipes = 0;
    rows.forEach(row => {
      saleRecs.push({ id: uid("pos"), date: posUploadDate, branch: posUploadBranch, itemName: row.name, qty: row.value, source: "upload" });
      const recipe = (db.recipes || []).find(r => (!r.branch || r.branch === posUploadBranch) && r.produces.some(p => db.items.find(i => i.id === p.itemId)?.name.toLowerCase() === row.name.toLowerCase()));
      if (recipe) {
        matchedRecipes++;
        const producedEntry = recipe.produces.find(p => db.items.find(i => i.id === p.itemId)?.name.toLowerCase() === row.name.toLowerCase());
        const batches = row.value / (producedEntry.qty || 1);
        recipe.consumes.forEach(c => {
          adjRecs.push({ id: uid("adj"), date: posUploadDate, branch: posUploadBranch, itemId: c.itemId, qty: -Math.abs(c.qty * batches), kind: "pos-sale", reason: `POS sale: ${row.value} × ${row.name} (recipe: ${recipe.name})`, userId: session.id });
        });
      }
    });
    const next = { ...db, posSales: [...saleRecs, ...(db.posSales || [])], adjustments: [...adjRecs, ...(db.adjustments || [])] };
    addLog(next, "Admin", `Uploaded POS sales for ${posUploadBranch} (${posUploadDate}): ${saleRecs.length} item(s), ${matchedRecipes} matched a recipe`);
    persist(next);
    flash(`Recorded ${saleRecs.length} sold item(s)${matchedRecipes ? `, deducted raw material for ${matchedRecipes}` : ""}`);
  };
  const addLabor = () => {
    if (!newLaborName.trim() || !newLaborWage || Number(newLaborWage) <= 0) { flash("Name and daily wage required", "error"); return; }
    const rec = { id: uid("lab"), name: newLaborName.trim(), nic: newLaborNic.trim(), phone: newLaborPhone.trim(), dailyWage: Number(newLaborWage), branch: newLaborBranch || null, openingDue: Number(newLaborOpening) || 0, openingDate: newLaborOpeningDate, active: true };
    const next = { ...db, labors: [...(db.labors || []), rec] };
    addLog(next, "Admin", `Added labor ${rec.name}`);
    persist(next); setNewLaborName(""); setNewLaborNic(""); setNewLaborPhone(""); setNewLaborWage(""); setNewLaborBranch(""); setNewLaborOpening(""); setNewLaborOpeningDate(todayStr()); flash("Labor added");
  };
  const delLabor = (id) => persist({ ...db, labors: (db.labors || []).filter(l => l.id !== id) });
  const startEditLabor = (l) => { setEditLaborId(l.id); setEditLaborDraft({ name: l.name, nic: l.nic || "", phone: l.phone || "", dailyWage: l.dailyWage, branch: l.branch || "", openingDue: l.openingDue || 0, openingDate: l.openingDate || todayStr() }); };
  const saveEditLabor = () => {
    const next = { ...db, labors: (db.labors || []).map(l => l.id === editLaborId ? { ...l, name: editLaborDraft.name.trim(), nic: editLaborDraft.nic.trim(), phone: editLaborDraft.phone.trim(), dailyWage: Number(editLaborDraft.dailyWage) || 0, branch: editLaborDraft.branch || null, openingDue: Number(editLaborDraft.openingDue) || 0, openingDate: editLaborDraft.openingDate } : l) };
    addLog(next, "Admin", `Edited labor ${editLaborDraft.name}`);
    persist(next); setEditLaborId(null); flash("Labor updated");
  };
  const uploadLaborOpening = (rows) => {
    let matched = 0;
    const next = { ...db, labors: (db.labors || []).map(l => {
      if (laborUploadBranch && l.branch !== laborUploadBranch) return l;
      const row = rows.find(r => r.name.toLowerCase() === l.name.toLowerCase());
      if (row) { matched++; return { ...l, openingDue: row.value, openingDate: newLaborOpeningDate }; }
      return l;
    }) };
    const unmatched = rows.length - matched;
    addLog(next, "Admin", `Uploaded labor opening due (as of ${newLaborOpeningDate})${laborUploadBranch ? " for " + laborUploadBranch : ""}: ${matched} matched, ${unmatched} not found`);
    persist(next);
    flash(`Updated ${matched} labor(s)${unmatched ? `, ${unmatched} name(s) not found` : ""}`);
  };

  const resetTransactions = () => {
    if (!window.confirm("This deletes ALL purchase, issue, ending, demand, adjustment, payment, and labor attendance/payment entries plus the activity log — permanently. Items, suppliers, users, kitchens, labor list, and rates stay. Continue?")) return;
    if (!window.confirm("Are you sure? This cannot be undone.")) return;
    const next = { ...db, purchases: [], issues: [], endings: [], demands: [], payments: [], adjustments: [], demandAdjustments: [], voidedDemandItems: [], attendance: [], laborPayments: [], todayRates: {}, log: [] };
    persist(next);
    flash("All entries cleared — items, suppliers and users kept");
  };

  return (
    <div>
      <TopBar title="Admin" onBack={onBack} />
      <div className="px-4 pt-3 flex gap-2 overflow-x-auto">
        {["Items", "Suppliers", "Rates", "Opening Stock", "Kitchens", "Recipes", "Labor", "POS", "Owners", "Users", "Reset"].map(t => (
          <button key={t} onClick={() => setTab(t)} className={`flex-1 whitespace-nowrap py-2.5 px-3 rounded-xl text-sm font-semibold border-2 ${tab === t ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white text-[#5C6B62] border-[#EAE4D4]"}`}>{t}</button>
        ))}
      </div>
      <div className="p-4">
        {tab === "Items" && (
          <React.Fragment>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <div className="grid grid-cols-2 gap-2 mb-2">
                <input className={numCls + " font-sans"} placeholder="Item name" value={newItemName} onChange={e => setNewItemName(e.target.value)} />
                <input className={numCls + " font-sans"} placeholder="Urdu name (optional)" value={newItemNameUr} onChange={e => setNewItemNameUr(e.target.value)} dir="rtl" />
              </div>
              <div className="grid grid-cols-2 gap-2 mb-2">
                <select className={selCls} value={newItemCat} onChange={e => setNewItemCat(e.target.value)}>{db.categories.map(c => <option key={c}>{c}</option>)}</select>
                <input className={numCls + " font-sans"} placeholder="Unit (kg, ltr...)" value={newItemUnit} onChange={e => setNewItemUnit(e.target.value)} />
              </div>
              <button onClick={addItem} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold">+ Add</button>
            </div>
            <input className={numCls + " font-sans mb-3"} placeholder={`Search ${db.items.length} items…`} value={itemQ} onChange={e => setItemQ(e.target.value)} />
            {db.items.filter(i => i.name.toLowerCase().includes(itemQ.toLowerCase())).map(i => (
              editItemId === i.id ? (
                <div key={i.id} className="bg-white rounded-lg p-3 mb-1.5 border-2 border-[#C98A2C]">
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <input className={numCls + " font-sans"} value={editItemDraft.name} onChange={e => setEditItemDraft(d => ({ ...d, name: e.target.value }))} />
                    <input className={numCls + " font-sans"} value={editItemDraft.nameUr} onChange={e => setEditItemDraft(d => ({ ...d, nameUr: e.target.value }))} dir="rtl" placeholder="Urdu name" />

              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Upload opening due (Excel/CSV: col A = labor name, col B = amount due)</div>
              <div className="grid grid-cols-2 gap-2 mb-2">
                <select className={selCls} value={laborUploadBranch} onChange={e => setLaborUploadBranch(e.target.value)}>
                  <option value="">All branches</option>
                  {BRANCHES.map(b => <option key={b}>{b}</option>)}
                </select>
                <input className={selCls} type="date" value={newLaborOpeningDate} onChange={e => setNewLaborOpeningDate(e.target.value)} />
              </div>
              <FileUploadRow flash={flash} onRows={uploadLaborOpening} />
            </div>
            {(db.labors || []).map(l => (
              editLaborId === l.id ? (
                <div key={l.id} className="bg-white rounded-lg p-3 mb-1.5 border-2 border-[#C98A2C]">
                  <input className={numCls + " font-sans mb-2"} value={editLaborDraft.name} onChange={e => setEditLaborDraft(d => ({ ...d, name: e.target.value }))} />
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <input className={numCls + " font-sans"} placeholder="NIC number" value={editLaborDraft.nic} onChange={e => setEditLaborDraft(d => ({ ...d, nic: e.target.value }))} />
                    <input className={numCls} type="tel" placeholder="Contact number" value={editLaborDraft.phone} onChange={e => setEditLaborDraft(d => ({ ...d, phone: e.target.value }))} />
                  </div>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <input className={numCls} type="number" value={editLaborDraft.dailyWage} onChange={e => setEditLaborDraft(d => ({ ...d, dailyWage: e.target.value }))} />
                    <select className={selCls} value={editLaborDraft.branch} onChange={e => setEditLaborDraft(d => ({ ...d, branch: e.target.value }))}>
                      <option value="">Any branch</option>
                      {BRANCHES.map(b => <option key={b}>{b}</option>)}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <div>
                      <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Opening due</div>
                      <input className={numCls} type="number" value={editLaborDraft.openingDue} onChange={e => setEditLaborDraft(d => ({ ...d, openingDue: e.target.value }))} />
                    </div>
                    <div>
                      <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">As of date</div>
                      <input className={selCls} type="date" value={editLaborDraft.openingDate} onChange={e => setEditLaborDraft(d => ({ ...d, openingDate: e.target.value }))} />
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={saveEditLabor} className="bg-[#2B6E63] text-white px-4 rounded-xl font-semibold">Save</button>
                    <button onClick={() => setEditLaborId(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-4 rounded-xl font-semibold">Cancel</button>
                  </div>
                </div>
              ) : (
                <div key={l.id} className="flex justify-between items-center bg-white rounded-lg p-2.5 mb-1.5 border border-[#EFEBDF]">
                  <span className="text-sm">
                    <b>{l.name}</b> <span className="text-[#8A9690]">· {money(l.dailyWage)}/day · {l.branch || "any branch"}{l.openingDue ? ` · opening ${money(l.openingDue)} (${l.openingDate || "—"})` : ""}</span>
                    {(l.nic || l.phone) && <div className="text-[11px] text-[#8A9690] mt-0.5">{l.nic}{l.nic && l.phone ? " · " : ""}{l.phone}</div>}
                  </span>
                  <div className="flex items-center gap-3">
                    <button onClick={() => startEditLabor(l)} className="text-[#5C6B62]">✎</button>
                    <button onClick={() => delLabor(l.id)} className="text-[#B33A3A]">✕</button>
                  </div>
                </div>
              )
            ))}
            {(db.labors || []).length === 0 && <div className="text-sm text-[#8A9690]">No labor added yet.</div>}
          </React.Fragment>
        )}
        {tab === "POS" && (
          <React.Fragment>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <div className="font-bold text-[#1F2A24] mb-2">POS Sales Sheet</div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Google Sheet link (end-of-day sales from POS)</div>
              <input className={numCls + " font-sans mb-2"} placeholder="https://docs.google.com/spreadsheets/..." value={posSheetLink} onChange={e => setPosSheetLink(e.target.value)} />
              <button onClick={savePosSheetLink} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold mb-2">Save Link</button>
              {db.posSheetLink && (
                <a href={db.posSheetLink} target="_blank" rel="noopener noreferrer" className="block text-center bg-[#2B6E63] text-white py-2.5 rounded-xl font-semibold">Open Sheet</a>
              )}
            </div>
            <div className="bg-[#F7F5F0] rounded-xl p-3.5 border border-[#D8D2C2] mb-4 opacity-70">
              <div className="font-bold text-[#1F2A24] mb-1">Automatic connection — not set up yet</div>
              <div className="text-xs text-[#5C6B62]">The API endpoint and recipe-based auto-deduction below are already built and ready, for whenever you want to wire the full comparison (POS sold qty vs StockFlow's recipe-expected vs actual usage).</div>
            </div>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <div className="font-bold text-[#1F2A24] mb-2">Live connection (for a POS to push sales automatically)</div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Endpoint</div>
              <div className="bg-[#F7F5F0] rounded-lg p-2.5 text-xs font-mono break-all mb-3">{typeof window !== "undefined" ? window.location.origin : ""}/api/pos/sales</div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">API Key</div>
              {db.posApiKey ? (
                <div className="bg-[#F7F5F0] rounded-lg p-2.5 text-xs font-mono break-all mb-3">{db.posApiKey}</div>
              ) : (
                <div className="text-sm text-[#8A9690] mb-3">No key generated yet.</div>
              )}
              <button onClick={generatePosApiKey} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold">{db.posApiKey ? "Regenerate" : "Generate"} API Key</button>
              <div className="text-[11px] text-[#8A9690] mt-3">
                POST JSON to the endpoint above: {"{ apiKey, branch, date (optional), items: [{ name, qty }] }"}.
                If a sold item matches a Recipe (Admin → Recipes), its raw material is deducted automatically. Regenerating the key breaks the old one.
              </div>
            </div>
            <div className="bg-[#F7F5F0] rounded-xl p-3.5 border border-[#D8D2C2] mb-4">
              <div className="font-bold text-[#1F2A24] mb-2">Manual upload (works today, no POS changes needed)</div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Excel/CSV: col A = item name, col B = qty sold</div>
              <div className="grid grid-cols-2 gap-2 mb-2">
                <select className={selCls} value={posUploadBranch} onChange={e => setPosUploadBranch(e.target.value)}>{BRANCHES.map(b => <option key={b}>{b}</option>)}</select>
                <input className={selCls} type="date" value={posUploadDate} onChange={e => setPosUploadDate(e.target.value)} />
              </div>
              <FileUploadRow flash={flash} onRows={uploadPosSales} />
            </div>
            <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">Recent POS Sales</div>
            {(db.posSales || []).slice(0, 30).map(s => (
              <div key={s.id} className="flex justify-between items-center bg-white rounded-lg p-2.5 mb-1.5 border border-[#EFEBDF]">
                <span className="text-sm">{s.itemName} <span className="text-[#8A9690]">· {s.branch} · {s.date} · {s.source}</span></span>
                <span className="font-mono font-bold text-sm">{s.qty}</span>
              </div>
            ))}
            {(db.posSales || []).length === 0 && <div className="text-sm text-[#8A9690]">No POS sales recorded yet.</div>}
          </React.Fragment>
        )}
        {tab === "Owners" && (
          <React.Fragment>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <input className={numCls + " font-sans mb-2"} placeholder="Owner name" value={newOwnerName} onChange={e => setNewOwnerName(e.target.value)} />
              <button onClick={addOwner} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold">+ Add Owner</button>
            </div>
            {(db.owners || []).map(o => (
              <div key={o.id} className="flex justify-between items-center bg-white rounded-lg p-2.5 mb-1.5 border border-[#EFEBDF]">
                <span className="text-sm font-semibold">{o.name}</span>
                <button onClick={() => delOwner(o.id)} className="text-[#B33A3A]">✕</button>
              </div>
            ))}
            <div className="bg-[#F7F5F0] rounded-xl p-3.5 border border-[#D8D2C2] mt-4">
              <div className="font-bold text-[#1F2A24] mb-2">Default owner per payment mode</div>
              <div className="text-[11px] text-[#8A9690] mb-3">Cash stays with the branch (used to pay suppliers/partners locally) — no owner assigned. Every other mode routes straight to an owner by default; this can still be changed per-transaction in Reports → Owner Ledger.</div>
              {["easypaisa", "jazzcash", "bank"].map(mode => (
                <div key={mode} className="mb-2">
                  <div className="text-xs font-semibold text-[#5C6B62] mb-1 capitalize">{mode}</div>
                  <select className={selCls} value={db.ownerModeDefaults?.[mode] || ""} onChange={e => setOwnerModeDefault(mode, e.target.value)}>
                    <option value="">— none —</option>
                    {(db.owners || []).map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                  </select>
                </div>
              ))}
            </div>
          </React.Fragment>
        )}
        {tab === "Users" && (
          <React.Fragment>
            <div className="bg-white rounded-xl p-3.5 border border-[#EAE4D4] mb-4">
              <div className="grid grid-cols-2 gap-2 mb-2">
                <input className={numCls + " font-sans"} placeholder="Name" value={newUserName} onChange={e => setNewUserName(e.target.value)} />
                <input className={numCls} placeholder="PIN" value={newUserPin} onChange={e => setNewUserPin(e.target.value.replace(/\D/g, "").slice(0, 6))} />
              </div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Allowed screens</div>
              <div className="mb-3"><PermChips selected={newUserPerms} onToggle={(p) => setNewUserPerms(v => v.includes(p) ? v.filter(x => x !== p) : [...v, p])} /></div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Branches</div>
              <div className="mb-3"><BranchChips selected={newUserBranches} onToggle={(b) => setNewUserBranches(v => v.includes(b) ? v.filter(x => x !== b) : [...v, b])} /></div>
              {(db.kitchens || []).filter(k => newUserBranches.includes(k.branch)).length > 0 && (
                <React.Fragment>
                  <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Kitchens (leave blank for all in their branches)</div>
                  <div className="mb-3"><KitchenChips kitchens={(db.kitchens || []).filter(k => newUserBranches.includes(k.branch))} selected={newUserKitchens} onToggle={(id) => setNewUserKitchens(v => v.includes(id) ? v.filter(x => x !== id) : [...v, id])} /></div>
                </React.Fragment>
              )}
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Items/categories visible (leave blank for all)</div>
              <div className="mb-3"><UserCategoryItemPicker db={db} selectedItemIds={newUserItemIds} onSetItemIds={setNewUserItemIds} /></div>
              <div className="text-xs font-semibold text-[#5C6B62] mb-1.5">Report tabs visible</div>
              <div className="mb-3"><ReportTabChips selected={newUserReportTabs} onToggle={(t) => setNewUserReportTabs(v => v.includes(t) ? v.filter(x => x !== t) : [...v, t])} /></div>
              <label className="flex items-center gap-2 mb-3 text-sm font-medium">
                <input type="checkbox" checked={newUserNotifications} onChange={e => setNewUserNotifications(e.target.checked)} /> Push notifications enabled
              </label>
              <label className="flex items-center gap-2 mb-3 text-sm font-medium">
                <input type="checkbox" checked={newUserBackdate} onChange={e => setNewUserBackdate(e.target.checked)} /> Can pick a past date when adding entries
              </label>
              <button onClick={addUser} className="bg-[#C98A2C] text-white w-full py-2.5 rounded-xl font-semibold">+ Add User</button>
            </div>
            {db.users.map(u => (
              <div key={u.id} className="bg-white rounded-lg p-2.5 mb-1.5 border border-[#EFEBDF]">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="text-sm"><b>{u.name}</b> <span className="text-[#8A9690]">· PIN {u.pin}</span></span>
                  <button onClick={() => delUser(u.id)} className="text-[#B33A3A]">✕</button>
                </div>
                <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mb-1">Screens</div>
                <PermChips selected={u.permissions || []} onToggle={(p) => toggleUserPerm(u.id, p)} />
                <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mt-2 mb-1">Branches</div>
                <BranchChips selected={u.branches || []} onToggle={(b) => toggleUserBranch(u.id, b)} />
                {(db.kitchens || []).filter(k => (u.branches || []).includes(k.branch)).length > 0 && (
                  <React.Fragment>
                    <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mt-2 mb-1">Kitchens (blank = all in their branches)</div>
                    <KitchenChips kitchens={(db.kitchens || []).filter(k => (u.branches || []).includes(k.branch))} selected={u.kitchens || []} onToggle={(id) => toggleUserKitchen(u.id, id)} />
                  </React.Fragment>
                )}
                <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mt-2 mb-1">Items/categories visible (blank = all)</div>
                <UserCategoryItemPicker db={db} selectedItemIds={u.itemIds || []} onSetItemIds={(ids) => persist({ ...db, users: db.users.map(x => x.id === u.id ? { ...x, itemIds: ids } : x) })} />
                {(u.permissions || []).includes("reports") && (
                  <React.Fragment>
                    <div className="text-[10px] uppercase tracking-wide font-semibold text-[#8A9690] mt-2 mb-1">Report tabs visible</div>
                    <ReportTabChips selected={(u.reportTabs && u.reportTabs.length) ? u.reportTabs : [...REPORT_TABS]} onToggle={(t) => toggleUserReportTab(u.id, t)} />
                  </React.Fragment>
                )}
                <label className="flex items-center gap-2 mt-2.5 text-xs font-semibold text-[#5C6B62]">
                  <input type="checkbox" checked={u.notifications !== false} onChange={() => toggleUserNotifications(u.id)} /> Push notifications enabled
                </label>
                <label className="flex items-center gap-2 mt-1.5 text-xs font-semibold text-[#5C6B62]">
                  <input type="checkbox" checked={!!u.canBackdate} onChange={() => toggleUserBackdate(u.id)} /> Can pick a past date when adding entries
                </label>
              </div>
            ))}
          </React.Fragment>
        )}
        {tab === "Reset" && (
          <div className="bg-white rounded-xl p-4 border-2 border-[#B33A3A]">
            <div className="font-bold text-[#B33A3A] mb-1">Clear all entries</div>
            <div className="text-sm text-[#5C6B62] mb-4">
              Deletes every Purchase, Issue, Ending, Demand, and Payment record, plus the Activity Log and today's rates —
              for a fresh start. Your Items, Suppliers, Users, and Rate settings are kept.
            </div>
            <button onClick={resetTransactions} className="bg-[#B33A3A] text-white w-full py-3 rounded-xl font-semibold">Delete All Entries</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

<script>
(function () {
  var code = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(code, { presets: [["react", { runtime: "classic" }]], sourceType: "script" }).code;
  var script = document.createElement("script");
  script.textContent = compiled;
  document.body.appendChild(script);
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
</script>
</body>
</html>
