const uid = (p) => p + Math.random().toString(36).slice(2, 9);
// Business day runs 9:00 AM to 6:00 AM the next calendar day.
// Anything before 9 AM still counts as "yesterday's" business date.
const pad2 = (n) => String(n).padStart(2, "0");
const todayStr = () => {
  const d = new Date();
  if (d.getHours() < 9) d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
const nowStr = () => new Date().toLocaleString();
const money = (n) => "Rs " + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });

// Demand runs on its own window: 9:00 PM through 6:00 PM the following calendar day.
// e.g. "15 Aug demand" = everything entered from 14 Aug 9pm through 15 Aug 6pm.
const demandDateStr = (ts) => {
  const d = new Date(ts || Date.now());
  const bucket = new Date(d);
  if (d.getHours() >= 21) bucket.setDate(bucket.getDate() + 1);
  return `${bucket.getFullYear()}-${pad2(bucket.getMonth() + 1)}-${pad2(bucket.getDate())}`;
};
const demandWindowOf = (dateStr) => {
  const [y, m, dd] = dateStr.split("-").map(Number);
  const end = new Date(y, m - 1, dd, 18, 0, 0, 0).getTime();
  const start = new Date(y, m - 1, dd - 1, 21, 0, 0, 0).getTime();
  return { start, end };
};
// Fallback timestamp for records saved before "ts" existed — noon of their own date bucket.
const tsOf = (r) => r.ts || new Date(r.date + "T12:00:00").getTime();

// Splits an item's demand for one branch/kitchen on one demand-date into:
// - firstDemand: everything asked for before the first issue that day (a historical snapshot)
// - currentDemand: everything asked for since the LAST issue that day (what's still outstanding)
// Multiple same-day demand entries add together until an issue resets the cycle.
function demandCycle(db, itemId, branch, kitchenId, dateStr) {
  const { start, end } = demandWindowOf(dateStr);
  const inWindow = (r) => { const t = tsOf(r); return t >= start && t < end; };
  const demandEntries = db.demands
    .filter(d => d.itemId === itemId && d.branch === branch && (kitchenId ? d.kitchenId === kitchenId : true) && inWindow(d))
    .sort((a, b) => tsOf(a) - tsOf(b));
  const issueEntries = db.issues
    .filter(x => x.itemId === itemId && x.to === branch && (kitchenId ? x.kitchenId === kitchenId : true) && inWindow(x))
    .sort((a, b) => tsOf(a) - tsOf(b));
  const firstIssueTs = issueEntries.length ? tsOf(issueEntries[0]) : null;
  const lastIssueTs = issueEntries.length ? tsOf(issueEntries[issueEntries.length - 1]) : null;
  const firstDemand = demandEntries.filter(d => firstIssueTs === null || tsOf(d) <= firstIssueTs).reduce((a, d) => a + d.qty, 0);
  const currentDemand = demandEntries.filter(d => lastIssueTs === null || tsOf(d) > lastIssueTs).reduce((a, d) => a + d.qty, 0);
  return { firstDemand, currentDemand, wasIssued: issueEntries.length > 0 };
}

const VAPID_PUBLIC_KEY = "BH5Tvcl3ie8t3JLf1bCGaRD7keOkjdGZ8v94HblObxmY-Mjbjq1Vfo-VQRisWmMpSgffKPJg6zHPoVeUJ_Cp7fU";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const arr = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) arr[i] = rawData.charCodeAt(i);
  return arr;
}

// Requests permission and registers this device for push, tied to the given user id.
// Must be called from a user gesture (button tap) — browsers block silent permission prompts.
async function enablePush(userId) {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
    const reg = await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if (permission !== "granted") return false;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    }
    await fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId, subscription: sub }) });
    return true;
  } catch (e) { return false; }
}

// Fire-and-forget: ask the server to push a notification to these users' devices.
function notifyUsers(userIds, title, body, url) {
  const ids = [...new Set((userIds || []).filter(Boolean))];
  if (ids.length === 0) return;
  fetch("/api/push/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userIds: ids, title, body: body || "", url: url || "/" }) }).catch(() => {});
}

const adminRecipients = (db) => db.users.filter(u => (u.permissions || []).includes("admin") && u.notifications !== false).map(u => u.id);
const branchRecipients = (db, branch, kitchenId) => db.users.filter(u => {
  if (u.notifications === false) return false;
  if ((u.permissions || []).includes("admin")) return true;
  const myBr = u.branches || [];
  if (myBr.length > 0 && !myBr.includes(branch)) return false;
  if (kitchenId && u.kitchens && u.kitchens.length > 0 && !u.kitchens.includes(kitchenId)) return false;
  return true;
}).map(u => u.id);

async function apiGet() {
  const r = await fetch("/api/state");
  return r.json();
}
async function apiSave(data) {
  await fetch("/api/state", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
}

function toCSV(rows, headers) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map(h => esc(h.label)).join(",")];
  rows.forEach(r => lines.push(headers.map(h => esc(h.get(r))).join(",")));
  return lines.join("\n");
}
function downloadCSV(filename, csv) {
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Resolve how an item should be priced for a given supplier.
// Returns null for plain manual entry, or an object describing fixed/formula pricing.
function computeRate(db, supplierId, itemId) {
  const cfg = db.pricing && db.pricing[supplierId] && db.pricing[supplierId][itemId];
  if (!cfg || cfg.mode === "manual") return null;
  const item = db.items.find(i => i.id === itemId);
  if (cfg.mode === "fixed") {
    return { mode: "fixed", rate: Number(cfg.rate) || 0, cashOnly: !!cfg.cashOnly };
  }
  if (cfg.mode === "formula") {
    const tr = db.todayRates && db.todayRates[item.category];
    const fresh = tr && tr.date === todayStr();
    if (!fresh) {
      return { mode: "formula", needsToday: true, cashOnly: !!cfg.cashOnly, offset: Number(cfg.offset) || 0, multiplier: Number(cfg.multiplier) || 1, category: item.category };
    }
    const rate = (Number(cfg.offset || 0) + Number(tr.rate)) * Number(cfg.multiplier || 1);
    return { mode: "formula", rate, cashOnly: !!cfg.cashOnly, category: item.category, todayRate: Number(tr.rate) };
  }
  return null;
}

const selCls = "w-full bg-white border-2 border-[#D8D2C2] rounded-xl px-4 py-3.5 text-[16px] text-[#1F2A24] font-medium focus:outline-none focus:border-[#C98A2C] appearance-none";

  const ok = kind !== "error";

}

function PermChips({ selected, onToggle }) {

function ReportTabChips({ selected, onToggle }) {

// A branch "has kitchens" if any kitchen record points to it.
function kitchensOf(db, branch) {
  return (db.kitchens || []).filter(k => k.branch === branch);
}

// Kitchens a given user is allowed to record for, within one branch.
// Empty session.kitchens means "all kitchens in their branches" (no restriction).
function myKitchensFor(db, session, branch) {
  const branchKitchens = kitchensOf(db, branch);
  if (!session.kitchens || session.kitchens.length === 0) return branchKitchens;
  return branchKitchens.filter(k => session.kitchens.includes(k.id));
}

function KitchenChips({ kitchens, selected, onToggle }) {

    </div>
  );
}

/* ---------- App ---------- */

function App() {
  const [db, setDb] = useState(null);
  const [session, setSession] = useState(null);
  const [screen, setScreen] = useState("menu");
  const [toast, setToast] = useState(null);

  useEffect(() => { apiGet().then(setDb).catch(() => setToast({ msg: "Could not connect to server", kind: "error" })); }, []);

  useEffect(() => {
    if (!["menu", "reports"].includes(screen)) return;
    const t = setInterval(() => { apiGet().then(setDb).catch(() => {}); }, 5000);
    return () => clearInterval(t);
  }, [screen]);

  const persist = useCallback(async (next) => {
    setDb(next);
    try { await apiSave(next); } catch { /* best effort */ }
  }, []);

  const flash = (msg, kind = "ok") => { setToast({ msg, kind }); setTimeout(() => setToast(null), 2200); };
  const addLog = (dbNext, action, detail) => {
    dbNext.log = [{ id: uid("l"), at: nowStr(), date: todayStr(), user: session?.name || "-", action, detail }, ...dbNext.log].slice(0, 2000);
  };

  const stockOf = useMemo(() => (branch, itemId, asOfDate) => {
    if (!db) return 0;
    let qty = 0;
    if (branch === "Store") db.purchases.forEach(p => { if (p.itemId === itemId && (!asOfDate || p.date <= asOfDate)) qty += Number(p.qty); });
    db.issues.forEach(iss => {
      if (iss.itemId !== itemId) return;
      if (asOfDate && iss.date > asOfDate) return;
      if (iss.from === branch) qty -= Number(iss.qty);
      if (iss.to === branch) qty += Number(iss.qty);
    });
    (db.adjustments || []).forEach(a => {
      if (a.itemId !== itemId || a.branch !== branch) return;
      if (asOfDate && a.date > asOfDate) return;
      qty += Number(a.qty);
    });
    return qty;
  }, [db]);

  const balanceOf = useMemo(() => (supplierId) => {
    if (!db) return 0;
    const owed = db.purchases.filter(p => p.supplierId === supplierId && p.paymentMode === "credit").reduce((a, p) => a + p.amount, 0);
    const paid = (db.payments || []).filter(x => x.supplierId === supplierId).reduce((a, x) => a + x.amount, 0);
    return owed - paid;
  }, [db]);

  const lastBillOf = useMemo(() => (supplierId) => {
    if (!db) return null;
    const list = db.purchases.filter(p => p.supplierId === supplierId);
    return list.length ? list[0] : null; // purchases are prepended, so first = latest
  }, [db]);

  if (!db) return <div className="min-h-screen flex items-center justify-center text-[#1F2A24] font-semibold">Loading…</div>;
  if (!session) return <LoginScreen db={db} onLogin={(u) => { setSession(u); setScreen("menu"); }} />;

  const commonProps = { db, session, persist, addLog, flash, stockOf, balanceOf, lastBillOf, setScreen };

  return (
    <div className="min-h-screen bg-[#F4EFE4] pb-8">
      <Toast msg={toast?.msg} kind={toast?.kind} />
      {screen === "menu" && <MainMenu db={db} session={session} onLogout={() => setSession(null)} setScreen={setScreen} />}
      {screen === "purchase" && <PurchaseScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "issue" && <IssueScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "ending" && <EndingScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "demand" && <DemandScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "adjustment" && <AdjustmentScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "receive" && <ConfirmReceiptScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "payment" && <PaymentScreen {...commonProps} onDone={() => setScreen("menu")} />}
      {screen === "reports" && <ReportsScreen {...commonProps} onBack={() => setScreen("menu")} />}
      {screen === "admin" && <AdminScreen {...commonProps} onBack={() => setScreen("menu")} />}
    </div>
  );
}

/* ---------- Login ---------- */

function LoginScreen({ db, onLogin }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const press = (d) => {
    setErr("");
    const next = (pin + d).slice(0, 6);
    setPin(next);
    const match = db.users.find(u => u.pin === next);
    if (match) setTimeout(() => onLogin(match), 120);
  };
  const back = () => setPin(pin.slice(0, -1));
  useEffect(() => {
    if (pin.length === 6 && !db.users.find(u => u.pin === pin)) {
      setErr("Incorrect PIN"); setTimeout(() => setPin(""), 500);
    }
  }, [pin]);

  return (
    <div className="min-h-screen bg-[#1F2A24] flex flex-col items-center justify-center px-6">
      <div className="text-2xl font-black tracking-tight text-[#F4EFE4] mb-1">🏭 StockFlow</div>
      <div className="text-[#8FA096] text-sm mb-8">Enter your PIN to continue</div>
      <div className="flex gap-3 mb-2 h-4">
        {Array.from({ length: Math.max(pin.length, 4) }).map((_, i) => (
          <div key={i} className={`w-3.5 h-3.5 rounded-full border-2 ${i < pin.length ? "bg-[#C98A2C] border-[#C98A2C]" : "border-[#4A5952]"}`} />
        ))}
      </div>
      <div className="text-xs h-5 mb-4 font-semibold" style={{ color: err ? "#E8877A" : "transparent" }}>{err || "-"}</div>
      <div className="grid grid-cols-3 gap-4 w-full max-w-[280px]">
        {[1,2,3,4,5,6,7,8,9].map(d => (
          <button key={d} onClick={() => press(String(d))} className="aspect-square rounded-full bg-[#2C3931] active:bg-[#3A4A40] text-[#F4EFE4] text-2xl font-bold">{d}</button>
        ))}
        <div />
        <button onClick={() => press("0")} className="aspect-square rounded-full bg-[#2C3931] active:bg-[#3A4A40] text-[#F4EFE4] text-2xl font-bold">0</button>
        <button onClick={back} className="aspect-square rounded-full flex items-center justify-center text-[#8FA096] active:text-white text-xl">⌫</button>
      </div>
    </div>
  );
}

/* ---------- Main Menu ---------- */

    { key: "issue", label: "Issue", sub: "Move to branches", emoji: "🔀", color: "#2B6E63" },

    { key: "ending", label: "Ending", sub: "Closing count", emoji: "📋", color: "#4A6FA5" },

    { key: "adjustment", label: "Adjustment", sub: "Wastage / theft", emoji: "⚖️", color: "#8A4A4A" },

  ].filter(t => perms.includes(t.key));

  return (
    <div>
      <div className="bg-[#1F2A24] text-[#F4EFE4] px-5 pt-6 pb-8 rounded-b-[28px] shadow-md">
        <div className="flex items-center justify-between">
          <div>
            <div className="text-[10px] uppercase tracking-[0.2em] text-[#C98A2C] font-semibold">StockFlow</div>
            <div className="text-2xl font-black">Hi, {session.name}</div>
          </div>
          <button onClick={onLogout} className="p-2.5 rounded-full bg-white/10 active:bg-white/20 text-lg">⎋</button>
        </div>
      </div>
      {tiles.length === 0 && (
        <div className="px-5 mt-6 text-center text-[#7A8880] text-sm">No options assigned to your account yet. Ask your admin.</div>

      {session.notifications !== false && pushState === "default" && (
        <div className="mx-5 mt-4 bg-[#FBF0DD] border-2 border-[#C98A2C] rounded-2xl p-3.5 flex items-center justify-between gap-3">
          <div className="text-sm text-[#7A5C2E] font-medium">Get notified when stock moves in or out of your branch.</div>
          <button onClick={async () => { const ok = await enablePush(session.id); setPushState(ok ? "granted" : Notification.permission); }} className="bg-[#C98A2C] text-white text-xs font-semibold px-3 py-2 rounded-xl whitespace-nowrap">Enable</button>
        </div>
      )}
      <div className="px-5 -mt-4 grid grid-cols-2 gap-4">
        {tiles.map(t => (
          <button key={t.key} onClick={() => setScreen(t.key)} className="bg-white rounded-2xl p-5 shadow-md text-left active:scale-[0.98] border border-[#EAE4D4]">
            <div className="w-11 h-11 rounded-xl flex items-center justify-center mb-3 text-xl" style={{ background: t.color + "1A" }}>{t.emoji}</div>
            <div className="font-bold text-[#1F2A24] text-lg leading-tight">{t.label}</div>
            <div className="text-xs text-[#7A8880] mt-0.5">{t.sub}</div>
          </button>
        ))}
      </div>
      <div className="px-5 mt-4 grid grid-cols-2 gap-4">
        {perms.includes("reports") && (
          <button onClick={() => setScreen("reports")} className="bg-white rounded-2xl p-4 shadow-sm border border-[#EAE4D4] flex items-center gap-3 active:scale-[0.98]">
            <span>🔎</span><span className="font-semibold text-[#1F2A24]">Reports</span>
          </button>
        )}
        {perms.includes("admin") && (
          <button onClick={() => setScreen("admin")} className="bg-white rounded-2xl p-4 shadow-sm border border-[#EAE4D4] flex items-center gap-3 active:scale-[0.98]">
            <span>🛡️</span><span className="font-semibold text-[#1F2A24]">Admin</span>
          </button>
        )}
      </div>
    </div>
  );
}

/* ---------- Purchase ---------- */

function PurchaseScreen({ db, session, persist, addLog, flash, onDone }) {
  const [supplierId, setSupplierId] = useState(db.suppliers[0]?.id || "");
  const [category, setCategory] = useState("");
  const [rows, setRows] = useState({}); // itemId -> { qty, rate }
  const [payMode, setPayMode] = useState("credit");
  const [todayInputs, setTodayInputs] = useState({}); // category -> value

  const supplier = db.suppliers.find(s => s.id === supplierId);
  const supplierItems = supplier ? db.items.filter(i => supplier.itemIds.includes(i.id)) : [];
  const supplierCats = [...new Set(supplierItems.map(i => i.category))];
  const visibleItems = payMode === "cash"
    ? (category ? db.items.filter(i => i.category === category) : [])
    : (category ? supplierItems.filter(i => i.category === category) : supplierItems);

  useEffect(() => { setRows({}); setCategory(""); }, [supplierId, payMode]);

  // pricing per item, recomputed whenever today's rates change
  const pricingByItem = useMemo(() => {
    const map = {};
    visibleItems.forEach(i => { map[i.id] = supplierId ? computeRate(db, supplierId, i.id) : null; });
    return map;
  }, [supplierId, visibleItems.map(i => i.id).join(","), db.todayRates]);

  useEffect(() => {
    setRows(prev => {
      const next = { ...prev };
      visibleItems.forEach(i => {
        const p = pricingByItem[i.id];
        if (p && p.rate !== undefined && (next[i.id]?.rate === undefined || next[i.id]?.rate === "")) {
          next[i.id] = { ...next[i.id], rate: String(p.rate) };
        }
      });
      return next;
    });
  }, [pricingByItem]);

  const anyCashOnly = visibleItems.some(i => rows[i.id]?.qty && pricingByItem[i.id]?.cashOnly);
  useEffect(() => { if (anyCashOnly) setPayMode("cash"); }, [anyCashOnly]);

  const categoriesNeedingToday = [...new Set(
    visibleItems.filter(i => rows[i.id]?.qty && pricingByItem[i.id]?.needsToday).map(i => pricingByItem[i.id].category)
  )];

  const setRow = (itemId, field, value) => setRows(v => ({ ...v, [itemId]: { ...v[itemId], [field]: value } }));

  const saveTodayRate = (cat) => {
    const val = todayInputs[cat];
    if (!val || Number(val) <= 0) { flash("Enter a valid rate", "error"); return; }
    const next = { ...db, todayRates: { ...db.todayRates, [cat]: { date: todayStr(), rate: Number(val) } } };
    addLog(next, "Today's Rate", `${cat} rate set to ${val}`);
    persist(next);
    setTodayInputs(v => ({ ...v, [cat]: "" }));
    flash("Today's rate saved");
  };

  const entries = Object.entries(rows).filter(([id, r]) => Number(r?.qty) > 0 && Number(r?.rate) > 0);
  const total = entries.reduce((a, [, r]) => a + Number(r.qty) * Number(r.rate), 0);

  const save = () => {
    if (entries.length === 0) { flash("Enter quantity and rate for at least one item", "error"); return; }
    if (categoriesNeedingToday.length > 0) { flash("Set today's rate for: " + categoriesNeedingToday.join(", "), "error"); return; }
    const recs = entries.map(([itemId, r]) => {
      const qty = Number(r.qty), rate = Number(r.rate);
      return { id: uid("p"), date: todayStr(), itemId, supplierId, qty, rate, amount: qty * rate, paymentMode: payMode, userId: session.id };
    });
    const next = { ...db, purchases: [...recs, ...db.purchases] };
    addLog(next, "Purchase", `${supplier.name}: ${recs.length} item(s), bill ${money(total)} (${payMode})`);
    persist(next);
    notifyUsers(adminRecipients(db), "New Purchase", `${supplier.name}: ${recs.length} item(s), ${money(total)} (${payMode})`);
    flash("Bill saved — " + recs.length + " item(s)");
    setRows({});
  };

  return (
    <div>
      <TopBar title="Purchase" onBack={onDone} />
      <div className="p-5">
        <Field label="Supplier">
          <select className={selCls} value={supplierId} onChange={e => setSupplierId(e.target.value)}>
            {db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>

        <Field label="Payment">
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={() => !anyCashOnly && setPayMode("credit")}
              className={`py-3 rounded-xl font-semibold border-2 ${payMode === "credit" ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white border-[#D8D2C2] text-[#5C6B62]"} ${anyCashOnly ? "opacity-40 pointer-events-none" : ""}`}>
              Credit (Udhaar)
            </button>
            <button type="button" onClick={() => setPayMode("cash")}
              className={`py-3 rounded-xl font-semibold border-2 ${payMode === "cash" ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white border-[#D8D2C2] text-[#5C6B62]"}`}>
              Cash
            </button>
          </div>
          {anyCashOnly && <div className="text-xs text-[#B3562C] font-semibold mt-1.5">One or more selected items are cash-only</div>}
        </Field>

        {payMode === "cash" && (
          <Field label="Category">
            <select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>
              <option value="">Select a category…</option>
              {db.categories.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
        )}

        {categoriesNeedingToday.map(cat => (
          <div key={cat} className="bg-[#FBF0DD] border-2 border-[#C98A2C] rounded-xl p-3.5 mb-4">
            <div className="text-sm font-semibold text-[#7A5C2E] mb-2">Set today's {cat} rate first</div>
            <div className="flex gap-2">
              <input className={numCls} type="number" inputMode="decimal" placeholder="e.g. 450"
                value={todayInputs[cat] || ""} onChange={e => setTodayInputs(v => ({ ...v, [cat]: e.target.value }))} />
              <button onClick={() => saveTodayRate(cat)} className="bg-[#C98A2C] text-white px-4 rounded-xl font-semibold whitespace-nowrap">Set</button>
            </div>
          </div>
        ))}

        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">
          {payMode === "cash"
            ? (category ? `${category} — Items & Rates` : "Select a category")
            : (supplier ? `${supplier.name} — Items & Rates` : "Select a supplier")}
        </div>
        <div className="space-y-2.5 mb-5">
          {visibleItems.map(it => {
            const p = pricingByItem[it.id];
            const locked = !!(p && (p.mode === "fixed" || (p.mode === "formula" && !p.needsToday)));
            const r = rows[it.id] || {};
            const amt = (Number(r.qty) || 0) * (Number(r.rate) || 0);
            return (
              <div key={it.id} className="bg-white rounded-xl p-3 border-2 border-[#EAE4D4]">
                <div className="flex items-center justify-between mb-2">
                  <div className="font-semibold text-[#1F2A24]">{it.name}{it.nameUr && <span className="text-[#8A9690] font-normal"> — {it.nameUr}</span>}</div>
                  <div className="text-[11px] text-[#8A9690]">{it.unit}{p?.cashOnly ? " · cash only" : ""}</div>
                </div>
                <div className="grid grid-cols-3 gap-2 items-center">
                  <input className="bg-[#F7F5F0] border-2 border-[#D8D2C2] rounded-lg px-2 py-2 text-right font-mono font-semibold text-[15px] focus:outline-none focus:border-[#C98A2C]"
                    type="number" inputMode="decimal" placeholder="Qty" value={r.qty || ""} onChange={e => setRow(it.id, "qty", e.target.value)} />
                  <input className="bg-[#F7F5F0] border-2 border-[#D8D2C2] rounded-lg px-2 py-2 text-right font-mono font-semibold text-[15px] focus:outline-none focus:border-[#C98A2C] disabled:opacity-70"
                    type="number" inputMode="decimal" placeholder="Rate" value={r.rate || ""} onChange={e => setRow(it.id, "rate", e.target.value)}
                    disabled={locked} />
                  <div className="text-right font-mono font-bold text-[#1F2A24]">{amt > 0 ? money(amt) : "–"}</div>
                </div>
              </div>
            );
          })}
          {payMode !== "cash" && supplier && visibleItems.length === 0 && <div className="text-sm text-[#8A9690]">No items linked to this supplier yet — add them in Admin.</div>}
          {payMode === "cash" && category && visibleItems.length === 0 && <div className="text-sm text-[#8A9690]">No items in this category yet — add them in Admin.</div>}
        </div>

        <div className="bg-[#2C3931] text-[#F4EFE4] rounded-xl p-4 mb-5 flex items-center justify-between">
          <span className="text-sm font-semibold text-[#C98A2C] uppercase tracking-wide">Bill Total</span>
          <span className="text-xl font-mono font-bold">{money(total)}</span>
        </div>
        <button className={btnPrimary} onClick={save} disabled={entries.length === 0}>Save Bill</button>
      </div>
    </div>
  );
}
/* ---------- Shared grid ---------- */

function ItemQtyGrid({ items, values, setValues, stockCheck }) {
  return (
    <div className="space-y-2.5">
      {items.map(it => {
        const val = values[it.id] || "";
        const avail = stockCheck ? stockCheck(it.id) : null;
        const over = stockCheck && Number(val) > avail;
        return (
          <div key={it.id} className={`bg-white rounded-xl p-3 border-2 flex items-center justify-between gap-3 ${over ? "border-[#B33A3A]" : "border-[#EAE4D4]"}`}>
            <div className="min-w-0">
              <div className="font-semibold text-[#1F2A24] truncate">{it.name}{it.nameUr && <span className="text-[#8A9690] font-normal"> — {it.nameUr}</span>}</div>
              <div className="text-[11px] text-[#8A9690]">{it.unit}{stockCheck && <span className={over ? "text-[#B33A3A] font-bold" : ""}> · {avail} in stock</span>}</div>
            </div>
            <input className="w-24 bg-[#F7F5F0] border-2 border-[#D8D2C2] rounded-lg px-2 py-2 text-right font-mono font-bold text-[16px] focus:outline-none focus:border-[#C98A2C]"
              type="number" inputMode="decimal" placeholder="0" value={val} onChange={e => setValues(v => ({ ...v, [it.id]: e.target.value }))} />
          </div>
        );
      })}
    </div>
  );
}

/* ---------- Issue ---------- */

function IssueScreen({ db, session, persist, addLog, flash, stockOf, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const [from, setFrom] = useState(myBranches[0]);
  const [to, setTo] = useState(BRANCHES.find(b => b !== myBranches[0]) || BRANCHES[1]);
  const toKitchens = kitchensOf(db, to);
  const [kitchenId, setKitchenId] = useState("");
  const [category, setCategory] = useState(db.categories[0]);
  const [values, setValues] = useState({});
  const items = db.items.filter(i => i.category === category);
  useEffect(() => { setValues({}); }, [category, from, to, kitchenId]);
  useEffect(() => { setKitchenId(""); }, [to]);
  const entries = Object.entries(values).filter(([, v]) => Number(v) > 0);
  const anyOver = entries.some(([id, v]) => Number(v) > stockOf(from, id));

  const save = () => {
    if (from === to) { flash("From and To must differ", "error"); return; }
    if (entries.length === 0) { flash("Enter at least one quantity", "error"); return; }
    if (anyOver) { flash("Not enough stock for one or more items", "error"); return; }
    const recs = entries.map(([itemId, v]) => ({ id: uid("iss"), date: todayStr(), ts: Date.now(), from, to, kitchenId: kitchenId || null, itemId, qty: Number(v), userId: session.id }));
    const next = { ...db, issues: [...recs, ...db.issues] };
    const kName = toKitchens.find(k => k.id === kitchenId)?.name;
    addLog(next, "Issue", `${from} → ${to}${kName ? " (" + kName + ")" : ""}: ${entries.length} item(s)`);
    persist(next);
    notifyUsers(branchRecipients(db, to, kitchenId), "Stock Delivered", `${entries.length} item(s) sent from ${from} to ${to}${kName ? " (" + kName + ")" : ""}`);
    flash("Issue saved"); setValues({});
  };

  return (
    <div>
      <TopBar title="Issue" onBack={onDone} />
      <div className="p-5">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Issue From"><select className={selCls} value={from} onChange={e => setFrom(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>
          <Field label="Issue To"><select className={selCls} value={to} onChange={e => setTo(e.target.value)}>{BRANCHES.filter(b => b !== from).map(b => <option key={b}>{b}</option>)}</select></Field>
        </div>
        {toKitchens.length > 0 && (
          <Field label="Kitchen (optional)">
            <select className={selCls} value={kitchenId} onChange={e => setKitchenId(e.target.value)}>
              <option value="">— Branch general —</option>
              {toKitchens.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}
            </select>
          </Field>
        )}
        <Field label="Item Category"><select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>{db.categories.map(c => <option key={c}>{c}</option>)}</select></Field>
        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">Items & Quantity</div>
        <div className="mb-5"><ItemQtyGrid items={items} values={values} setValues={setValues} stockCheck={(id) => stockOf(from, id)} /></div>
        <button className={btnPrimary} onClick={save}>Save Issue</button>
      </div>
    </div>
  );
}

/* ---------- Ending ---------- */

function EndingScreen({ db, session, persist, addLog, flash, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const [branch, setBranch] = useState(myBranches[0]);
  const myKitchens = myKitchensFor(db, session, branch);
  const [kitchenId, setKitchenId] = useState(myKitchens[0]?.id || "");
  const [category, setCategory] = useState(db.categories[0]);
  const [values, setValues] = useState({});
  const items = db.items.filter(i => i.category === category);
  useEffect(() => { setValues({}); }, [category, branch, kitchenId]);
  useEffect(() => { setKitchenId(myKitchensFor(db, session, branch)[0]?.id || ""); }, [branch]);
  const entries = Object.entries(values).filter(([, v]) => v !== "" && v !== undefined);

  const save = () => {
    if (entries.length === 0) { flash("Enter at least one quantity", "error"); return; }
    if (myKitchens.length > 0 && !kitchenId) { flash("Select a kitchen", "error"); return; }
    const recs = entries.map(([itemId, v]) => ({ id: uid("end"), date: todayStr(), branch, kitchenId: kitchenId || null, itemId, qty: Number(v), userId: session.id }));
    const next = { ...db, endings: [...recs, ...db.endings] };
    const kName = myKitchens.find(k => k.id === kitchenId)?.name;
    addLog(next, "Ending", `${branch}${kName ? " — " + kName : ""}: ${entries.length} item(s)`);
    persist(next);
    notifyUsers(adminRecipients(db), "Ending Recorded", `${branch}${kName ? " — " + kName : ""}: ${entries.length} item(s)`);
    flash("Ending saved"); setValues({});
  };

  return (
    <div>
      <TopBar title="Ending" onBack={onDone} />
      <div className="p-5">
        <Field label="Branch"><select className={selCls} value={branch} onChange={e => setBranch(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>
        {myKitchens.length > 0 && (
          <Field label="Kitchen">
            <select className={selCls} value={kitchenId} onChange={e => setKitchenId(e.target.value)}>
              {myKitchens.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}
            </select>
          </Field>
        )}
        <Field label="Item Category"><select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>{db.categories.map(c => <option key={c}>{c}</option>)}</select></Field>
        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">Closing Count</div>
        <div className="mb-5"><ItemQtyGrid items={items} values={values} setValues={setValues} /></div>
        <button className={btnPrimary} onClick={save}>Save Ending</button>
      </div>
    </div>
  );
}

/* ---------- Adjustment (wastage / theft / found stock) ---------- */

function AdjustmentScreen({ db, session, persist, addLog, flash, stockOf, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const [branch, setBranch] = useState(myBranches[0]);
  const [category, setCategory] = useState(db.categories[0]);
  const [kind, setKind] = useState("wastage"); // wastage | theft | damage | found
  const [reason, setReason] = useState("");
  const [values, setValues] = useState({}); // itemId -> qty (always entered positive, sign applied on save)
  const items = db.items.filter(i => i.category === category);
  useEffect(() => { setValues({}); }, [category, branch]);
  const entries = Object.entries(values).filter(([, v]) => Number(v) > 0);
  const isLoss = kind !== "found";

  const save = () => {
    if (entries.length === 0) { flash("Enter at least one quantity", "error"); return; }
    const recs = entries.map(([itemId, v]) => ({
      id: uid("adj"), date: todayStr(), branch, itemId,
      qty: isLoss ? -Math.abs(Number(v)) : Math.abs(Number(v)),
      kind, reason: reason.trim(), userId: session.id,
    }));
    const next = { ...db, adjustments: [...recs, ...(db.adjustments || [])] };
    addLog(next, "Adjustment", `${branch}: ${entries.length} item(s) — ${kind}${reason ? " (" + reason + ")" : ""}`);
    persist(next);
    notifyUsers(adminRecipients(db), "Stock Adjustment", `${branch}: ${entries.length} item(s) — ${kind}${reason ? " (" + reason + ")" : ""}`);
    flash("Adjustment saved"); setValues({}); setReason("");
  };

  return (
    <div>
      <TopBar title="Adjustment" onBack={onDone} />
      <div className="p-5">
        <Field label="Branch"><select className={selCls} value={branch} onChange={e => setBranch(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>
        <Field label="Type">
          <div className="grid grid-cols-4 gap-1.5">
            {["wastage", "theft", "damage", "found"].map(k => (
              <button key={k} onClick={() => setKind(k)} className={`py-2.5 rounded-lg text-xs font-semibold capitalize border-2 ${kind === k ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white border-[#D8D2C2] text-[#5C6B62]"}`}>{k}</button>
            ))}
          </div>
        </Field>
        <Field label="Note (optional)">
          <input className={numCls + " font-sans"} value={reason} onChange={e => setReason(e.target.value)} placeholder="e.g. spoiled overnight" />
        </Field>
        <Field label="Item Category"><select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>{db.categories.map(c => <option key={c}>{c}</option>)}</select></Field>
        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">
          {isLoss ? "Quantity Lost" : "Quantity Found"}
        </div>
        <div className="mb-5"><ItemQtyGrid items={items} values={values} setValues={setValues} stockCheck={(id) => stockOf(branch, id)} /></div>
        <button className={btnPrimary} onClick={save}>Save Adjustment</button>
      </div>
    </div>
  );
}

/* ---------- Confirm Receipt ---------- */

function ConfirmReceiptScreen({ db, session, persist, addLog, flash, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const itemName = (id) => db.items.find(i => i.id === id)?.name || id;
  const kitchenName = (id) => (db.kitchens || []).find(k => k.id === id)?.name;
  const pending = db.issues.filter(x => !x.confirmed && myBranches.includes(x.to)).sort((a, b) => tsOf(b) - tsOf(a));
  const [openId, setOpenId] = useState(null);
  const [adjustQty, setAdjustQty] = useState("");

  const confirmOk = (issue) => {
    const next = { ...db, issues: db.issues.map(x => x.id === issue.id ? { ...x, confirmed: true, confirmedQty: x.qty, confirmedBy: session.id, confirmedAt: nowStr() } : x) };
    addLog(next, "Receipt Confirmed", `${itemName(issue.itemId)} at ${issue.to}${kitchenName(issue.kitchenId) ? " (" + kitchenName(issue.kitchenId) + ")" : ""}: matches, ${issue.qty}`);
    persist(next); flash("Confirmed");
  };

  const confirmMismatch = (issue) => {
    const actual = Number(adjustQty);
    if (adjustQty === "" || isNaN(actual)) { flash("Enter the quantity you actually received", "error"); return; }
    const diff = actual - issue.qty;
    const next = { ...db, issues: db.issues.map(x => x.id === issue.id ? { ...x, confirmed: true, confirmedQty: actual, confirmedBy: session.id, confirmedAt: nowStr() } : x) };
    if (diff !== 0) {
      const adjRec = { id: uid("adj"), date: todayStr(), branch: issue.to, kitchenId: issue.kitchenId || null, itemId: issue.itemId, qty: diff, kind: "received-mismatch", reason: `Issued ${issue.qty}, received ${actual} (issue from ${issue.from})`, userId: session.id };
      next.adjustments = [adjRec, ...(next.adjustments || [])];
    }
    addLog(next, "Receipt Mismatch", `${itemName(issue.itemId)} at ${issue.to}: issued ${issue.qty}, received ${actual}`);
    persist(next);
    notifyUsers(
      [...adminRecipients(db), issue.userId],
      "Receipt mismatch",
      `${itemName(issue.itemId)}: issued ${issue.qty}, received ${actual} at ${issue.to}${kitchenName(issue.kitchenId) ? " (" + kitchenName(issue.kitchenId) + ")" : ""} — reported by ${session.name}`
    );
    setOpenId(null); setAdjustQty(""); flash("Mismatch recorded and reported");
  };

  return (
    <div>
      <TopBar title="Confirm Receipt" onBack={onDone} />
      <div className="p-5">
        {pending.length === 0 && <div className="text-sm text-[#8A9690]">Nothing waiting on confirmation.</div>}
        {pending.map(issue => (
          <div key={issue.id} className="bg-white rounded-xl p-3.5 border-2 border-[#EAE4D4] mb-3">
            <div className="flex justify-between items-start mb-2">
              <div>
                <div className="font-semibold text-[#1F2A24]">{itemName(issue.itemId)}</div>
                <div className="text-[11px] text-[#8A9690]">from {issue.from} → {issue.to}{kitchenName(issue.kitchenId) ? " (" + kitchenName(issue.kitchenId) + ")" : ""} · {issue.date}</div>
              </div>
              <div className="font-mono font-bold text-lg">{issue.qty}</div>
            </div>
            {openId !== issue.id ? (
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => confirmOk(issue)} className="bg-[#2B6E63] text-white py-2.5 rounded-xl font-semibold text-sm">✓ Received OK</button>
                <button onClick={() => { setOpenId(issue.id); setAdjustQty(""); }} className="bg-[#B33A3A] text-white py-2.5 rounded-xl font-semibold text-sm">✗ Different Amount</button>
              </div>
            ) : (
              <div className="flex gap-2">
                <input className={numCls} type="number" inputMode="decimal" placeholder="Actual qty received" value={adjustQty} onChange={e => setAdjustQty(e.target.value)} />
                <button onClick={() => confirmMismatch(issue)} className="bg-[#C98A2C] text-white px-4 rounded-xl font-semibold whitespace-nowrap">Save</button>
                <button onClick={() => setOpenId(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-3 rounded-xl font-semibold">Cancel</button>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- Demand ---------- */

function DemandScreen({ db, session, persist, addLog, flash, onDone }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const [branch, setBranch] = useState(myBranches[0]);
  const myKitchens = myKitchensFor(db, session, branch);
  const [kitchenId, setKitchenId] = useState(myKitchens[0]?.id || "");
  const [category, setCategory] = useState(db.categories[0]);
  const [values, setValues] = useState({});
  const items = db.items.filter(i => i.category === category);
  useEffect(() => { setValues({}); }, [category, branch, kitchenId]);
  useEffect(() => { setKitchenId(myKitchensFor(db, session, branch)[0]?.id || ""); }, [branch]);
  const entries = Object.entries(values).filter(([, v]) => Number(v) > 0);

  const save = () => {
    if (entries.length === 0) { flash("Enter at least one quantity", "error"); return; }
    if (myKitchens.length > 0 && !kitchenId) { flash("Select a kitchen", "error"); return; }
    const recs = entries.map(([itemId, v]) => ({ id: uid("dem"), date: demandDateStr(), ts: Date.now(), branch, kitchenId: kitchenId || null, itemId, qty: Number(v), userId: session.id }));
    const next = { ...db, demands: [...recs, ...db.demands] };
    const kName = myKitchens.find(k => k.id === kitchenId)?.name;
    addLog(next, "Demand", `${branch}${kName ? " — " + kName : ""}: ${entries.length} item(s)`);
    persist(next);
    notifyUsers(adminRecipients(db), "New Demand", `${branch}${kName ? " — " + kName : ""}: ${entries.length} item(s)`);
    flash("Demand saved"); setValues({});
  };

  return (
    <div>
      <TopBar title="Demand" onBack={onDone} />
      <div className="p-5">
        <Field label="Branch"><select className={selCls} value={branch} onChange={e => setBranch(e.target.value)}>{myBranches.map(b => <option key={b}>{b}</option>)}</select></Field>
        {myKitchens.length > 0 && (
          <Field label="Kitchen">
            <select className={selCls} value={kitchenId} onChange={e => setKitchenId(e.target.value)}>
              {myKitchens.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}
            </select>
          </Field>
        )}
        <Field label="Item Category"><select className={selCls} value={category} onChange={e => setCategory(e.target.value)}>{db.categories.map(c => <option key={c}>{c}</option>)}</select></Field>
        <div className="text-xs font-semibold uppercase tracking-wide text-[#5C6B62] mb-1.5">Quantity Required</div>
        <div className="mb-5"><ItemQtyGrid items={items} values={values} setValues={setValues} /></div>
        <button className={btnPrimary} onClick={save}>Save Demand</button>
      </div>
    </div>
  );
}

/* ---------- Payment ---------- */

function PaymentScreen({ db, session, persist, addLog, flash, balanceOf, lastBillOf, onDone }) {
  const [supplierId, setSupplierId] = useState(db.suppliers[0]?.id || "");
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const supplier = db.suppliers.find(s => s.id === supplierId);
  const balance = supplierId ? balanceOf(supplierId) : 0;
  const lastBill = supplierId ? lastBillOf(supplierId) : null;
  const itemName = (id) => db.items.find(i => i.id === id)?.name || id;

  const save = () => {
    if (!supplierId || !amount || Number(amount) <= 0) { flash("Select supplier and enter amount", "error"); return; }
    const rec = { id: uid("pay"), date: todayStr(), supplierId, amount: Number(amount), note, userId: session.id };
    const next = { ...db, payments: [rec, ...(db.payments || [])] };
    addLog(next, "Payment", `Paid ${amount} to ${supplier?.name}`);
    persist(next);
    notifyUsers(adminRecipients(db), "Payment Made", `${money(amount)} paid to ${supplier?.name}`);
    flash("Payment saved"); setAmount(""); setNote("");
  };

  return (
    <div>
      <TopBar title="Payment" onBack={onDone} />
      <div className="p-5">
        <Field label="Supplier">
          <select className={selCls} value={supplierId} onChange={e => setSupplierId(e.target.value)}>
            {db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>

        <div className="grid grid-cols-2 gap-3 mb-5">
          <div className={`rounded-xl p-3.5 border-2 ${balance > 0 ? "bg-[#FBEAEA] border-[#E4B8B8]" : "bg-[#EAF3F1] border-[#B8D8D2]"}`}>
            <div className="text-[10px] uppercase tracking-wide font-semibold text-[#5C6B62] mb-1">Balance Due</div>
            <div className={`text-lg font-mono font-bold ${balance > 0 ? "text-[#B33A3A]" : "text-[#2B6E63]"}`}>{money(balance)}</div>
          </div>
          <div className="rounded-xl p-3.5 border-2 bg-white border-[#EAE4D4]">
            <div className="text-[10px] uppercase tracking-wide font-semibold text-[#5C6B62] mb-1">Last Bill</div>
            {lastBill ? (
              <div>
                <div className="text-lg font-mono font-bold text-[#1F2A24]">{money(lastBill.amount)}</div>
                <div className="text-[11px] text-[#8A9690]">{itemName(lastBill.itemId)} · {lastBill.date}</div>
              </div>
            ) : <div className="text-sm text-[#8A9690]">No bills yet</div>}
          </div>
        </div>

        <Field label="Payment Amount">
          <input className={numCls} type="number" inputMode="decimal" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0" />
        </Field>
        <Field label="Note (optional)">
          <input className={numCls + " font-sans"} value={note} onChange={e => setNote(e.target.value)} placeholder="e.g. cash paid at shop" />
        </Field>
        <button className={btnPrimary} onClick={save}>Save Payment</button>
      </div>
    </div>
  );
}

/* ---------- Reports ---------- */

const REPORT_TABS = ["Stock Balance", "Material Used", "Purchases", "Supplier Ledger", "Supplier Demand", "Demand", "Demand vs Issue", "By Category", "Kitchens", "Ending", "Adjustments", "Activity Log"];

function ReportsScreen({ db, session, persist, addLog, flash, stockOf, balanceOf, onBack }) {
  const myBranches = (session.branches && session.branches.length) ? session.branches : BRANCHES;
  const myTabs = (session.reportTabs && session.reportTabs.length) ? REPORT_TABS.filter(t => session.reportTabs.includes(t)) : REPORT_TABS;
  const [tab, setTab] = useState(myTabs[0] || REPORT_TABS[0]);
  const [q, setQ] = useState("");
  const [catFilter, setCatFilter] = useState("");
  const [dateFilter, setDateFilter] = useState(todayStr());
  const [muBranch, setMuBranch] = useState(myBranches[0]);
  const [khItemId, setKhItemId] = useState("");
  const [adjOpenBranch, setAdjOpenBranch] = useState(null);
  const [demandMode, setDemandMode] = useState("current"); // "current" (after last issue) or "first" (before any issue)
  const [adjQty, setAdjQty] = useState("");
  const [adjReason, setAdjReason] = useState("");
  const [ledgerSupplierId, setLedgerSupplierId] = useState(db.suppliers[0]?.id || "");
  const ledgerSupplier = db.suppliers.find(s => s.id === ledgerSupplierId);
  const [editPurchaseId, setEditPurchaseId] = useState(null);
  const [editPurchaseDraft, setEditPurchaseDraft] = useState({});
  const itemName = (id) => db.items.find(i => i.id === id)?.name || id;
  const supplierName = (id) => db.suppliers.find(s => s.id === id)?.name || id;
  const filteredItems = db.items.filter(i => i.name.toLowerCase().includes(q.toLowerCase()) && (!catFilter || i.category === catFilter));

  const startEditPurchase = (p) => { setEditPurchaseId(p.id); setEditPurchaseDraft({ qty: String(p.qty), rate: String(p.rate), paymentMode: p.paymentMode || "credit" }); };
  const saveEditPurchase = () => {
    const qty = Number(editPurchaseDraft.qty) || 0, rate = Number(editPurchaseDraft.rate) || 0;
    if (qty <= 0 || rate <= 0) { flash("Enter valid qty and rate", "error"); return; }
    const next = { ...db, purchases: db.purchases.map(p => p.id === editPurchaseId ? { ...p, qty, rate, amount: qty * rate, paymentMode: editPurchaseDraft.paymentMode } : p) };
    addLog(next, "Admin", `Corrected purchase entry`);
    persist(next); setEditPurchaseId(null); flash("Purchase updated");
  };
  const deletePurchase = (id) => {
    const next = { ...db, purchases: db.purchases.filter(p => p.id !== id) };
    addLog(next, "Admin", `Deleted a purchase entry`);
    persist(next); flash("Purchase deleted");
  };

  const saveDemandAdjustment = (itemId) => {
    const qty = Number(adjQty);
    if (!qty) { flash("Enter a non-zero amount", "error"); return; }
    const rec = { id: uid("dadj"), date: dateFilter || todayStr(), itemId, qty, reason: adjReason.trim(), userId: session.id };
    const next = { ...db, demandAdjustments: [rec, ...(db.demandAdjustments || [])] };
    addLog(next, "Demand Adjustment", `${itemName(itemId)}: ${qty > 0 ? "+" : ""}${qty}${adjReason ? " (" + adjReason + ")" : ""}`);
    persist(next); setAdjOpenBranch(null); setAdjQty(""); setAdjReason(""); flash("Adjustment saved");
  };

  const toggleVoidForSupplier = (supplierId, itemId, date) => {
    const existing = (db.voidedDemandItems || []).find(v => v.supplierId === supplierId && v.itemId === itemId && v.date === date);
    let next;
    if (existing) {
      next = { ...db, voidedDemandItems: db.voidedDemandItems.filter(v => v.id !== existing.id) };
      addLog(next, "Demand Void", `Un-voided ${itemName(itemId)} for ${supplierName(supplierId)}`);
    } else {
      const rec = { id: uid("void"), date, supplierId, itemId, userId: session.id };
      next = { ...db, voidedDemandItems: [rec, ...(db.voidedDemandItems || [])] };
      addLog(next, "Demand Void", `Voided ${itemName(itemId)} for ${supplierName(supplierId)}`);
    }
    persist(next);
  };

  // Opening balance for an item at a branch: stock as of the day before the given date.
  const openingOf = (branch, itemId, date) => {
    if (!date) return 0;
    const d = new Date(date + "T00:00:00");
    d.setDate(d.getDate() - 1);
    const prevDay = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    return stockOf(branch, itemId, prevDay);
  };

  return (
    <div>
      <TopBar title="Reports" onBack={onBack} />
      <div className="px-4 pt-3">
        <div className="flex gap-2 overflow-x-auto pb-2 -mx-1 px-1">
          {myTabs.map(t => (
            <button key={t} onClick={() => setTab(t)} className={`whitespace-nowrap px-3.5 py-2 rounded-full text-sm font-semibold border-2 ${tab === t ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-white text-[#5C6B62] border-[#EAE4D4]"}`}>{t}</button>
          ))}
        </div>
      </div>
      <div className="px-4 mt-2 mb-3 flex gap-2 flex-wrap">
        <input className="flex-1 min-w-[110px] bg-white border-2 border-[#EAE4D4] rounded-xl pl-4 pr-3 py-2.5 text-sm" placeholder="Search item…" value={q} onChange={e => setQ(e.target.value)} />
        {(tab === "Stock Balance" || tab === "Demand vs Issue" || tab === "Ending" || tab === "By Category" || tab === "Kitchens" || tab === "Demand" || tab === "Material Used") && (
          <select className="bg-white border-2 border-[#EAE4D4] rounded-xl px-2.5 py-2.5 text-sm font-medium max-w-[130px]" value={catFilter} onChange={e => setCatFilter(e.target.value)}>
            <option value="">All categories</option>
            {db.categories.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        )}
        <input type="date" className="bg-white border-2 border-[#EAE4D4] rounded-xl px-2.5 py-2.5 text-sm font-medium" value={dateFilter} onChange={e => setDateFilter(e.target.value)} />
        {dateFilter && (
          <button onClick={() => setDateFilter("")} className="text-xs font-semibold text-[#5C6B62] bg-[#F0ECE0] px-3 rounded-xl">All dates</button>
        )}
        {(tab === "Demand" || tab === "Kitchens" || tab === "Supplier Demand" || tab === "Material Used") && (
          <div className="flex gap-1 bg-[#EAE4D4] rounded-xl p-1">
            <button onClick={() => setDemandMode("current")} className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold ${demandMode === "current" ? "bg-[#1F2A24] text-white" : "text-[#5C6B62]"}`}>After Issue</button>
            <button onClick={() => setDemandMode("first")} className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold ${demandMode === "first" ? "bg-[#1F2A24] text-white" : "text-[#5C6B62]"}`}>1st Demand</button>
          </div>
        )}
      </div>
      <div className="px-4 pb-8">
        {tab === "Stock Balance" && (
          <ReportTable title={dateFilter ? `Stock Balance as of ${dateFilter}` : "Stock Balance by Branch"} onExport={() => downloadCSV("stock-balance.csv", toCSV(filteredItems, [{ label: "Item", get: i => i.name }, { label: "Category", get: i => i.category }, ...myBranches.map(b => ({ label: b, get: i => stockOf(b, i.id, dateFilter) }))]))}>
            <table className="w-full text-sm">
              <thead><tr className="text-left text-[#7A8880]"><th className="py-1.5">Item</th>{myBranches.map(b => <th key={b} className="text-right py-1.5">{b}</th>)}</tr></thead>
              <tbody>
                {filteredItems.map(i => (
                  <tr key={i.id} className="border-t border-[#EFEBDF]">
                    <td className="py-2 font-medium">{i.name}</td>
                    {myBranches.map(b => { const v = stockOf(b, i.id, dateFilter); return <td key={b} className={`text-right py-2 font-mono ${v < 0 ? "text-[#B33A3A]" : v <= 5 && v >= 0 ? "text-[#B3562C] font-bold" : ""}`}>{v}</td>; })}
                  </tr>
                ))}
              </tbody>
            </table>
            {dateFilter && <div className="text-[11px] text-[#8A9690] mt-3">Includes all purchases, issues, and adjustments up to and including this date.</div>}
          </ReportTable>
        )}
        {tab === "Material Used" && (() => {
          const eff = dateFilter || todayStr();
          const demEff = dateFilter || demandDateStr();
          // Build the selector list: Store (no kitchens) as a plain branch entry;
          // branches with kitchens get an "All kitchens" combined entry plus one per kitchen.
          const options = [];
          myBranches.forEach(b => {
            const ks = kitchensOf(db, b);
            if (ks.length === 0) { options.push({ value: `b:${b}`, label: b, branch: b, kitchenId: null }); return; }
            options.push({ value: `ba:${b}`, label: `${b} — All Kitchens`, branch: b, kitchenId: null });
            ks.forEach(k => options.push({ value: `k:${k.id}`, label: `${k.name} (${b})`, branch: b, kitchenId: k.id }));
          });
          const current = options.find(o => o.value === muBranch) || options[0];
          const branch = current?.branch, kitchenId = current?.kitchenId;
          const mode = demandMode === "first" ? "firstDemand" : "currentDemand";

          const demandOf = (itemId) => kitchenId
            ? demandCycle(db, itemId, branch, kitchenId, demEff)[mode]
            : demandCycle(db, itemId, branch, null, demEff)[mode] + kitchensOf(db, branch).reduce((a, k) => a + demandCycle(db, itemId, branch, k.id, demEff)[mode], 0);
          const receivedOf = (itemId) => db.issues.filter(x => x.itemId === itemId && x.date === eff && x.to === branch && (kitchenId ? x.kitchenId === kitchenId : true)).reduce((a, x) => a + x.qty, 0) + (!kitchenId && branch === "Store" ? db.purchases.filter(p => p.itemId === itemId && p.date === eff).reduce((a, p) => a + p.qty, 0) : 0);
          const endingOf = (itemId) => db.endings.find(x => x.itemId === itemId && x.date === eff && x.branch === branch && (kitchenId ? x.kitchenId === kitchenId : true));

          const rowsData = filteredItems.map(i => {
            const demand = demandOf(i.id);
            const received = receivedOf(i.id);
            const e = endingOf(i.id);
            const opening = kitchenId ? null : openingOf(branch, i.id, eff);
            const used = e ? (opening || 0) + received - e.qty : null;
            return { item: i, demand, received, ending: e ? e.qty : null, used };
          }).filter(r => r.demand !== 0 || r.received !== 0 || r.ending !== null);

          return (
            <ReportTable
              title={`Material Used — ${current?.label} — ${eff}`}
              onExport={() => downloadCSV("material-used.csv", toCSV(rowsData, [
                { label: "Item", get: r => r.item.name }, { label: "Demand", get: r => r.demand },
                { label: "Received", get: r => r.received }, { label: "Ending", get: r => r.ending ?? "" },
                { label: "Used", get: r => r.used ?? "" },
              ]))}
            >
              <div className="mb-3">
                <select className="w-full bg-white border-2 border-[#D8D2C2] rounded-xl px-3 py-2.5 text-sm font-medium" value={muBranch} onChange={e => setMuBranch(e.target.value)}>
                  {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>
              <table className="w-full text-sm">
                <thead><tr className="text-left text-[#7A8880]"><th className="py-1.5">Item</th><th className="text-right py-1.5">Demand</th><th className="text-right py-1.5">Received</th><th className="text-right py-1.5">Ending</th><th className="text-right py-1.5 font-bold">Used</th></tr></thead>
                <tbody>
                  {rowsData.map(r => (
                    <tr key={r.item.id} className="border-t border-[#EFEBDF]">
                      <td className="py-2 font-medium">{r.item.name}{r.item.nameUr && <span className="text-[#8A9690]"> — {r.item.nameUr}</span>}</td>
                      <td className="text-right py-2 font-mono">{r.demand}</td>
                      <td className="text-right py-2 font-mono">{r.received}</td>
                      <td className="text-right py-2 font-mono">{r.ending ?? "–"}</td>
                      <td className="text-right py-2 font-mono font-bold">{r.used !== null ? r.used : "–"}</td>
                    </tr>
                  ))}
                  {rowsData.length === 0 && <tr><td colSpan={5} className="py-3 text-[#8A9690]">No entries.</td></tr>}
                </tbody>
              </table>
              <div className="text-[11px] text-[#8A9690] mt-3">Used = Opening (yesterday's ending) + Received − Ending. Opening isn't tracked per-kitchen, so it's blank when a single kitchen is selected.</div>
            </ReportTable>
          );
        })()}
        {tab === "Purchases" && (
          <ReportTable title="Purchase History" onExport={() => downloadCSV("purchases.csv", toCSV(db.purchases, [{ label: "Date", get: p => p.date }, { label: "Item", get: p => itemName(p.itemId) }, { label: "Supplier", get: p => supplierName(p.supplierId) }, { label: "Qty", get: p => p.qty }, { label: "Rate", get: p => p.rate }, { label: "Amount", get: p => p.amount }, { label: "Payment", get: p => p.paymentMode || "credit" }]))}>
            {db.purchases.filter(p => itemName(p.itemId).toLowerCase().includes(q.toLowerCase()) && (!dateFilter || p.date === dateFilter)).slice(0, 200).map(p => (
              editPurchaseId === p.id ? (
                <div key={p.id} className="bg-white rounded-xl p-3 mb-2 border-2 border-[#C98A2C]">
                  <div className="text-sm font-semibold mb-2">{itemName(p.itemId)} · {supplierName(p.supplierId)}</div>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <input className={numCls} type="number" placeholder="Qty" value={editPurchaseDraft.qty} onChange={e => setEditPurchaseDraft(d => ({ ...d, qty: e.target.value }))} />
                    <input className={numCls} type="number" placeholder="Rate" value={editPurchaseDraft.rate} onChange={e => setEditPurchaseDraft(d => ({ ...d, rate: e.target.value }))} />
                  </div>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <button onClick={() => setEditPurchaseDraft(d => ({ ...d, paymentMode: "credit" }))} className={`py-2 rounded-lg text-xs font-semibold border-2 ${editPurchaseDraft.paymentMode === "credit" ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-[#F7F5F0] border-[#D8D2C2] text-[#5C6B62]"}`}>Credit</button>
                    <button onClick={() => setEditPurchaseDraft(d => ({ ...d, paymentMode: "cash" }))} className={`py-2 rounded-lg text-xs font-semibold border-2 ${editPurchaseDraft.paymentMode === "cash" ? "bg-[#1F2A24] text-white border-[#1F2A24]" : "bg-[#F7F5F0] border-[#D8D2C2] text-[#5C6B62]"}`}>Cash</button>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={saveEditPurchase} className="bg-[#2B6E63] text-white px-4 py-2 rounded-xl font-semibold text-sm">Save</button>
                    <button onClick={() => setEditPurchaseId(null)} className="bg-[#F7F5F0] text-[#5C6B62] px-4 py-2 rounded-xl font-semibold text-sm">Cancel</button>
                    <button onClick={() => deletePurchase(p.id)} className="ml-auto text-[#B33A3A] text-sm font-semibold">Delete</button>
                  </div>
                </div>
              ) : (
                <div key={p.id} className="bg-white rounded-xl p-3 mb-2 border border-[#EAE4D4] flex justify-between items-center">
                  <div><div className="font-semibold">{itemName(p.itemId)}</div><div className="text-xs text-[#8A9690]">{supplierName(p.supplierId)} · {p.date} · {p.paymentMode === "cash" ? "Cash" : "Credit"}</div></div>
                  <div className="flex items-center gap-3">
                    <div className="text-right"><div className="font-mono font-bold">{money(p.amount)}</div><div className="text-xs text-[#8A9690]">{p.qty} × {p.rate}</div></div>
                    <button onClick={() => startEditPurchase(p)} className="text-[#5C6B62]">✎</button>
                  </div>
                </div>
              )
            ))}
          </ReportTable>
        )}
        {tab === "Supplier Ledger" && (
          <React.Fragment>
            <select className={selCls + " mb-3"} value={ledgerSupplierId} onChange={e => setLedgerSupplierId(e.target.value)}>
              {db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {ledgerSupplier && (() => {
              const purchaseTx = db.purchases.filter(p => p.supplierId === ledgerSupplierId).map(p => ({
                date: p.date, type: "Purchase",
                desc: `${itemName(p.itemId)} — ${p.qty} × ${p.rate}${p.paymentMode === "cash" ? " (cash)" : ""}`,
                amount: p.paymentMode === "cash" ? 0 : p.amount,
              }));
              const paymentTx = (db.payments || []).filter(x => x.supplierId === ledgerSupplierId).map(x => ({
                date: x.date, type: "Payment", desc: x.note || "Payment", amount: -x.amount,
              }));
              const allTx = [...purchaseTx, ...paymentTx]
                .filter(t => !dateFilter || t.date === dateFilter)
                .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
              let running = 0;
              const withBalance = allTx.map(t => { running += t.amount; return { ...t, balance: running }; });
              const totalPurchases = db.purchases.filter(p => p.supplierId === ledgerSupplierId).reduce((a, p) => a + p.amount, 0);
              const totalPaid = (db.payments || []).filter(x => x.supplierId === ledgerSupplierId).reduce((a, x) => a + x.amount, 0);
              const bal = balanceOf(ledgerSupplierId);

                  {[...withBalance].reverse().map((t, idx) => (

                      <div className="min-w-0">
                        <div className="text-sm font-medium truncate">{t.desc}</div>
                        <div className="text-[11px] text-[#8A9690]">{t.date} · {t.type}</div>
                      </div>
                      <div className="text-right shrink-0 ml-2">
